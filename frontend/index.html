<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<style>
  @keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
  .toast-enter { animation: toastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .toast-leave { animation: toastOut 0.25s ease-in forwards; }
  @keyframes welcomeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes welcomeLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .welcome-in { animation: welcomeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .welcome-line { animation: welcomeLine 0.5s cubic-bezier(0.65, 0, 0.35, 1) 0.15s both; transform-origin: center; }

  /* --- Linhas neon ---------------------------------------------------------
     Traço curto na borda de cima do card, na cor de acento do próprio card (nenhuma paleta
     nova foi criada). O degradê apaga nas pontas pra linha não virar uma "tampa" no card, e a
     largura é limitada: num card largo, uma linha de ponta a ponta vira um borrão em vez de um
     detalhe. O ::before é o fio nítido e o ::after é só o brilho — separados porque box-shadow
     ilumina a caixa inteira (vira mancha retangular) em vez de acompanhar o degradê.
     O brilho existe só no tema escuro: no claro ele sumiria no branco e deixaria a linha com
     aspecto sujo, então lá fica só o traço, mais opaco pra não desaparecer. */
  .neon-top { position: relative; }
  .neon-top::before, .neon-top::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    width: min(70%, 230px); pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--neon, #3b82f6), transparent);
  }
  .neon-top::before { top: -1px; height: 1px; opacity: .85; }
  .neon-top::after { top: -2px; height: 3px; filter: blur(4px); opacity: 0; }
  .neon-top.is-dark::before { opacity: 1; }
  .neon-top.is-dark::after { opacity: .7; }

  /* Botão de período ativo (só no escuro, mesmo motivo do brilho acima). */
  .neon-ativo { box-shadow: 0 0 0 1px rgba(59,130,246,.45), 0 0 14px -4px rgba(59,130,246,.95); }

  /* --- Easter egg: Konami code ("Modo Turbo") ------------------------------
     ↑ ↑ ↓ ↓ ← → ← → B A em qualquer tela — carrinhos cruzando de um lado ao
     outro, logo girando, mensagem que aparece e some sozinha em ~4.5s. */
  @keyframes turboFly { from { transform: translateX(-10vw) rotate(-6deg); } to { transform: translateX(110vw) rotate(6deg); } }
  .turbo-carro { position: absolute; left: 0; animation-name: turboFly; animation-timing-function: linear; animation-fill-mode: forwards; }
  @keyframes turboSpin { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(360deg) scale(1.15); } to { transform: rotate(720deg) scale(1); } }
  .turbo-logo { animation: turboSpin 1.4s ease-in-out; }
  @keyframes turboBannerIn {
    0% { opacity: 0; transform: scale(0.85); }
    12% { opacity: 1; transform: scale(1); }
    88% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.95); }
  }
  .turbo-banner { animation: turboBannerIn 4.5s cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* --- Easter egg 2: ↓ ↓ ↑ ↑ → ← → ← A B ("estrelas cadentes") -----------
     Estrelas cruzando a tela em diagonal, contínuas enquanto o vídeo roda (loop infinito, não
     uma rajada única como o Modo Turbo — aqui quem fecha é o vídeo acabando, não um timer). */
  @keyframes estrelaCair { 0% { transform: translate(0, 0) rotate(0deg); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translate(38vw, 38vh) rotate(8deg); opacity: 0; } }
  .estrela-cadente { position: absolute; animation-name: estrelaCair; animation-timing-function: linear; animation-iteration-count: infinite; pointer-events: none; }
</style>
</head>

<script type="text/babel" data-presets="react">

/* ================================================================== */
/* 1) CLIENTE DA API (backend próprio, substitui o Apps Script)         */
/* ================================================================== */

function formatApiError(detail) {
  if (!detail) return "";
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) {
    return detail
      .map((e) => (e && typeof e === "object" ? (e.loc ? e.loc[e.loc.length - 1] + ": " : "") + (e.msg || JSON.stringify(e)) : String(e)))
      .join(" · ");
  }
  return JSON.stringify(detail);
}
function authFetch(path, token, options = {}) {
  return fetch(path, { ...options, headers: { ...(options.headers || {}), Authorization: "Bearer " + token } });
}
async function authJson(path, token, options = {}) {
  const res = await authFetch(path, token, {
    ...options,
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(formatApiError(body.detail) || "Falha na requisição (" + res.status + ")");
  }
  if (res.status === 204) return null;
  return res.json();
}
async function login(email, password) {
  const body = new URLSearchParams();
  body.set("username", email);
  body.set("password", password);
  const res = await fetch("/auth/login", { method: "POST", body });
  if (!res.ok) throw new Error("E-mail ou senha incorretos.");
  return res.json();
}

const RUNWAY_CRITICO = 3;
const RUNWAY_ATENCAO = 7;

/* ================================================================== */
/* 2) HELPERS DE DATA / AGREGAÇÃO / FORMATAÇÃO                          */
/* ================================================================== */

function getPeriodRange(periodo, customStart, customEnd) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (periodo === "mesAtual" || periodo === "comparativo") return { start: new Date(today.getFullYear(), today.getMonth(), 1), end: today };
  if (periodo === "mesAnterior") {
    return { start: new Date(today.getFullYear(), today.getMonth() - 1, 1), end: new Date(today.getFullYear(), today.getMonth(), 0) };
  }
  return {
    start: customStart ? new Date(customStart) : new Date(today.getFullYear(), today.getMonth(), 1),
    end: customEnd ? new Date(customEnd) : today,
  };
}
function getPreviousRange({ start, end }) {
  const lengthDays = Math.round((end - start) / 86400000) + 1;
  const prevEnd = new Date(start); prevEnd.setDate(prevEnd.getDate() - 1);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevStart.getDate() - (lengthDays - 1));
  return { start: prevStart, end: prevEnd };
}
// Comparativo: mês atual (dia 1 até hoje) contra o mesmo recorte de dias no mês anterior ou
// no mesmo mês do ano passado — evita comparar mês parcial com mês inteiro.
function getComparativoRange(range, tipo) {
  const monthsBack = tipo === "anoAnterior" ? 12 : 1;
  const refYear = range.start.getFullYear();
  const refMonth = range.start.getMonth() - monthsBack;
  const prevStart = new Date(refYear, refMonth, 1);
  const daysInPrevMonth = new Date(refYear, refMonth + 1, 0).getDate();
  const prevEnd = new Date(refYear, refMonth, Math.min(range.end.getDate(), daysInPrevMonth));
  return { start: prevStart, end: prevEnd };
}
// r.data vem do backend como "AAAA-MM-DD" (sem hora). new Date("AAAA-MM-DD") interpreta isso
// como meia-noite UTC, mas os limites do range (range.start/end) são meia-noite LOCAL — em
// fusos negativos (Brasil) isso empurrava cada registro pro dia anterior e sumia com o dia 1
// de cada mês nos filtros de "Mês Atual". Por isso datas sem hora sempre são interpretadas
// como hora local aqui, nunca via new Date(string) direto.
function parseDateLocal(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtDateOnly(dateStr) {
  return parseDateLocal(dateStr).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}
// dashboardData.meta.lastSync vem com "Z" (horário UTC de verdade, ver backend) quando é um
// horário de sincronização real — nesse caso o navegador já converte certinho pro horário
// local de quem estiver olhando. Quando vem só "AAAA-MM-DD" (funil, sem hora de sincronização
// própria) mostramos só a data, sem hora nenhuma pra não inventar um horário sem sentido.
function fmtAtualizado(lastSync) {
  if (!lastSync) return "";
  if (lastSync.includes("T")) {
    const d = new Date(lastSync);
    return "Atualizado em " + d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" }) +
      " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }
  return "Atualizado em " + parseDateLocal(lastSync).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function filterByRange(records, range) {
  return records.filter((r) => { const d = parseDateLocal(r.data); return d >= range.start && d <= range.end; });
}
function aggregateTrafego(records) {
  const base = records.reduce((acc, r) => { acc.gasto += r.gasto; acc.quantidade += r.quantidade; return acc; }, { gasto: 0, quantidade: 0 });
  base.cpl = base.quantidade > 0 ? base.gasto / base.quantidade : 0;
  return base;
}
function variacao(atual, anterior) {
  if (!anterior) return null;
  return ((atual - anterior) / anterior) * 100;
}
function statusRunway(dias) {
  if (dias === null) return "semDados";
  if (dias <= RUNWAY_CRITICO) return "critico";
  if (dias <= RUNWAY_ATENCAO) return "atencao";
  return "ok";
}

const fmtDateShort = (iso) => new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });

/* ================================================================== */
/* 4) GRÁFICOS EM SVG NATIVO COM TOOLTIP INTERATIVO                     */
/* ================================================================== */

const PAD = { top: 14, right: 16, bottom: 58, left: 54 };
const CHART_H = 280;

function scaleFn(min, max, rangeMin, rangeMax) {
  if (max === min) max = min + 1;
  return (v) => rangeMax - ((v - min) / (max - min)) * (rangeMax - rangeMin);
}

function useElementWidth(ref, fallback) {
  const [width, setWidth] = useState(fallback);
  useEffect(() => {
    if (!ref.current) return;
    const update = () => { if (ref.current) setWidth(ref.current.clientWidth || fallback); };
    update();
    let ro;
    if (window.ResizeObserver) { ro = new ResizeObserver(update); ro.observe(ref.current); }
    window.addEventListener("resize", update);
    return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", update); };
  }, [ref]);
  return width;
}

function Tooltip({ hover, dark }) {
  if (!hover) return null;
  return (
    <div
      className={"absolute z-10 pointer-events-none rounded-lg border px-2.5 py-1.5 text-[11px] shadow-lg whitespace-nowrap " +
        (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100" : "bg-white border-neutral-200 text-neutral-900")}
      style={{ left: hover.xPct + "%", top: hover.yPct + "%", transform: "translate(-50%, -125%)" }}
    >
      {hover.lines.map((l, i) => <div key={i} className={i === 0 ? "font-semibold" : ""}>{l}</div>)}
    </div>
  );
}

function ChartLegend({ items, dark }) {
  return (
    <div className="flex flex-wrap items-center gap-4 mb-3">
      {items.map((it, i) => (
        <div key={i} className="flex items-center gap-1.5 text-[11px]">
          {it.shape === "bar" ? (
            <span className="inline-block shrink-0 w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: it.color }} />
          ) : (
            <svg width="16" height="8" className="shrink-0">
              <line x1="0" y1="4" x2="16" y2="4" stroke={it.color} strokeWidth="2" strokeDasharray={it.dashed ? "4 3" : undefined} />
            </svg>
          )}
          <span className={dark ? "text-neutral-400" : "text-neutral-500"}>{it.label}</span>
        </div>
      ))}
    </div>
  );
}

function EvolutionChart({ data, dark }) {
  const containerRef = useRef(null);
  const CHART_W = useElementWidth(containerRef, 760);
  const [hover, setHover] = useState(null);
  if (!data.length) return <div ref={containerRef} className="h-[280px] flex items-center justify-center text-xs text-neutral-500">Sem dados no período.</div>;
  const innerW = CHART_W - PAD.left - PAD.right;
  const innerH = CHART_H - PAD.top - PAD.bottom;
  const gastoMax = Math.max(...data.map((d) => d.gasto)) * 1.15 || 1;
  const leadsMax = Math.max(...data.map((d) => d.quantidade)) * 1.2 || 1;
  const yGasto = scaleFn(0, gastoMax, PAD.top, PAD.top + innerH);
  const yLeads = scaleFn(0, leadsMax, PAD.top, PAD.top + innerH);
  const x = (i) => PAD.left + (data.length > 1 ? (i / (data.length - 1)) * innerW : innerW / 2);
  const areaPath = data.map((d, i) => (i === 0 ? "M" : "L") + x(i) + "," + yGasto(d.gasto)).join(" ")
    + ` L${x(data.length - 1)},${PAD.top + innerH} L${x(0)},${PAD.top + innerH} Z`;
  const linePath = data.map((d, i) => (i === 0 ? "M" : "L") + x(i) + "," + yLeads(d.quantidade)).join(" ");
  const step = Math.max(1, Math.floor(data.length / 6));

  return (
    <div ref={containerRef} className="relative">
      <svg viewBox={`0 0 ${CHART_W} ${CHART_H}`} className="w-full h-[280px] block">
        {[0, 0.25, 0.5, 0.75, 1].map((g, i) => (
          <line key={i} x1={PAD.left} x2={CHART_W - PAD.right} y1={PAD.top + g * innerH} y2={PAD.top + g * innerH} stroke={dark ? "#1e293b" : "#e2e8f0"} strokeWidth="1" />
        ))}
        <path d={areaPath} fill="#3b82f6" fillOpacity="0.15" stroke="none" />
        <path d={data.map((d, i) => (i === 0 ? "M" : "L") + x(i) + "," + yGasto(d.gasto)).join(" ")} fill="none" stroke="#3b82f6" strokeWidth="2" />
        <path d={linePath} fill="none" stroke="#f59e0b" strokeWidth="2" strokeDasharray="4 3" />
        {data.map((d, i) => (
          <g key={i}
            onMouseEnter={() => setHover({ xPct: (x(i) / CHART_W) * 100, yPct: (Math.min(yGasto(d.gasto), yLeads(d.quantidade)) / CHART_H) * 100, lines: [d.dataLabel, "Leads: " + fmtNum(d.quantidade), "Investimento: " + fmtBRL(d.gasto)] })}
            onMouseLeave={() => setHover(null)}>
            <circle cx={x(i)} cy={yLeads(d.quantidade)} r="8" fill="transparent" />
            <circle cx={x(i)} cy={yLeads(d.quantidade)} r="2.5" fill="#f59e0b" />
          </g>
        ))}
        {data.map((d, i) => (i % step === 0 || i === data.length - 1) && (
          <text key={i} x={x(i)} y={CHART_H - PAD.bottom + 34} fontSize="10" textAnchor="middle" fill={dark ? "#64748b" : "#94a3b8"}>{d.dataLabel}</text>
        ))}
        <text x={PAD.left - 8} y={PAD.top + 4} fontSize="9" textAnchor="end" fill={dark ? "#64748b" : "#94a3b8"}>R${Math.round(gastoMax / 1000)}k</text>
        <text x={CHART_W - PAD.right + 8} y={PAD.top + 4} fontSize="9" textAnchor="end" fill={dark ? "#64748b" : "#94a3b8"}>{fmtNum(leadsMax)}</text>
      </svg>
      <Tooltip hover={hover} dark={dark} />
    </div>
  );
}

function RankingChart({ data, dark }) {
  const containerRef = useRef(null);
  const CHART_W = useElementWidth(containerRef, 760);
  const [hover, setHover] = useState(null);
  if (!data.length) return <div ref={containerRef} className="h-[280px] flex items-center justify-center text-xs text-neutral-500">Sem dados.</div>;
  const maxLabelLen = Math.max(...data.map((d) => d.marca.length));
  const pad = { ...PAD, bottom: Math.min(170, Math.max(80, maxLabelLen * 5.4 + 30)) };
  const chartH = 280 - PAD.bottom + pad.bottom;
  const innerW = CHART_W - pad.left - pad.right;
  const innerH = chartH - pad.top - pad.bottom;
  const leadsMax = Math.max(...data.map((d) => d.quantidade)) * 1.2 || 1;
  const gastoMax = Math.max(...data.map((d) => d.gasto)) * 1.2 || 1;
  const yLeads = scaleFn(0, leadsMax, pad.top, pad.top + innerH);
  const yGasto = scaleFn(0, gastoMax, pad.top, pad.top + innerH);
  const slot = innerW / data.length;

  return (
    <div ref={containerRef} className="relative">
      <svg viewBox={`0 0 ${CHART_W} ${chartH}`} className="w-full block" style={{ height: chartH }}>
        {[0, 0.25, 0.5, 0.75, 1].map((g, i) => (
          <line key={i} x1={pad.left} x2={CHART_W - pad.right} y1={pad.top + g * innerH} y2={pad.top + g * innerH} stroke={dark ? "#1e293b" : "#e2e8f0"} strokeWidth="1" />
        ))}
        {data.map((d, i) => {
          const cx = pad.left + slot * i + slot / 2;
          const barY = yLeads(d.quantidade);
          const gastoY = yGasto(d.gasto);
          return (
            <g key={i}
              onMouseEnter={() => setHover({ xPct: (cx / CHART_W) * 100, yPct: (Math.min(barY, gastoY) / chartH) * 100, lines: [d.marca, "Leads: " + fmtNum(d.quantidade), "Investimento: " + fmtBRL(d.gasto)] })}
              onMouseLeave={() => setHover(null)}>
              <rect x={pad.left + slot * i} y={pad.top} width={slot} height={innerH} fill="transparent" />
              <rect x={cx - barW / 2} y={barY} width={barW} height={pad.top + innerH - barY} fill="#3b82f6" rx="3" />
              <circle cx={cx} cy={gastoY} r="3.5" fill="#f59e0b" />
              <text x={cx} y={chartH - pad.bottom + 14} fontSize="10" textAnchor="end" fill={dark ? "#94a3b8" : "#64748b"} transform={`rotate(-60, ${cx}, ${chartH - pad.bottom + 14})`}>{d.marca}</text>
            </g>
          );
        })}
        <path d={data.map((d, i) => (i === 0 ? "M" : "L") + (pad.left + slot * i + slot / 2) + "," + yGasto(d.gasto)).join(" ")} fill="none" stroke="#f59e0b" strokeWidth="2" strokeDasharray="4 3" />
      </svg>
      <Tooltip hover={hover} dark={dark} />
    </div>
  );
}

function Badge({ value, dark }) {
  if (value === null || value === undefined || !isFinite(value)) return null;
  const positive = value >= 0;
  return (
    <span className={"inline-flex items-center gap-0.5 rounded-full px-1.5 py-0.5 text-[11px] font-semibold " +
      (positive ? (dark ? "bg-emerald-500/10 text-emerald-400" : "bg-emerald-50 text-emerald-600") : (dark ? "bg-red-500/10 text-red-400" : "bg-red-50 text-red-600"))}>
      {positive ? <IconArrowUp className="h-3 w-3" /> : <IconArrowDown className="h-3 w-3" />}
      {Math.abs(value).toFixed(1).replace(".", ",")}%
    </span>
  );
}
// Arco desenhado ponto a ponto (em vez de large-arc/sweep-flag do SVG) — mais fácil de
// acertar a direção certa em qualquer sentido, positivo ou negativo.
// Mini gráfico da evolução dia a dia da métrica dentro do período selecionado. Substituiu o
// velocímetro que ficava aqui: ele desenhava a variação percentual num arco de -100% a +100%,
// uma escala inventada (variação não tem teto), travava no talo em qualquer valor extremo e
// repetia em desenho o número que já aparece escrito logo abaixo. O sparkline usa o mesmo
// espaço pra mostrar algo que o número sozinho não conta: se o resultado veio de uma evolução
// constante ou de um pico isolado.
function Sparkline({ valores, cor, dark }) {
  const w = 132, h = 38;
  const pts = (valores || []).filter((v) => v !== null && v !== undefined && isFinite(v));
  if (pts.length < 2) {
    return (
      <div style={{ height: h }} className={"w-full flex items-center justify-center text-[10px] " + (dark ? "text-neutral-600" : "text-neutral-400")}>
        sem dados no período
      </div>
    );
  }
  const min = Math.min(...pts), max = Math.max(...pts);
  const passo = w / (pts.length - 1);
  // 3px de folga em cima e embaixo pra linha e o ponto final não encostarem na borda.
  // Quando todos os dias têm o mesmo valor não há amplitude pra normalizar: aí a linha vai pro
  // meio da caixa (lê como "estável") em vez de colar no fundo, que daria a impressão errada
  // de ter caído a zero.
  const coords = pts.map((v, i) => [
    i * passo,
    max === min ? h / 2 : h - 3 - ((v - min) / (max - min)) * (h - 6),
  ]);
  const linha = coords.map(([x, y], i) => (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
  const area = linha + " L " + w + " " + h + " L 0 " + h + " Z";
  const fim = coords[coords.length - 1];
  const gradId = "spark-" + cor.replace("#", "");
  return (
    <svg viewBox={"0 0 " + w + " " + h} width="100%" height={h} preserveAspectRatio="none" className="block">
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={cor} stopOpacity="0.25" />
          <stop offset="100%" stopColor={cor} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={"url(#" + gradId + ")"} />
      <path d={linha} fill="none" stroke={cor} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
      <circle cx={fim[0]} cy={fim[1]} r="2.4" fill={cor} vectorEffect="non-scaling-stroke" />
    </svg>
  );
}
// Anima o número contando até o valor final. Na primeira aparição sobe do zero; depois disso
// (ex.: ao trocar o período) parte do valor anterior, o que deixa claro se subiu ou desceu em
// vez de sempre "encher" de novo.
// A desaceleração no fim (curva cúbica) é o que faz parecer que o número "assenta" no lugar —
// uma contagem linear parece um cronômetro travando.
// Respeita quem configurou menos animação no sistema operacional: nesse caso o valor entra
// direto, sem contagem.
function useContagem(alvo, duracaoMs = 900) {
  const [valor, setValor] = useState(0);
  const anterior = useRef(0);
  useEffect(() => {
    const de = anterior.current;
    anterior.current = alvo;
    if (!isFinite(alvo) || !isFinite(de) || de === alvo) { setValor(alvo); return; }
    const reduzir = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Aba em segundo plano não executa requestAnimationFrame — sem esta guarda o card ficaria
    // parado no zero, mostrando "R$ 0,00" no lugar do investimento real até alguém olhar pra
    // aba. Melhor entregar o número certo na hora e abrir mão da animação nesse caso.
    if (reduzir || document.hidden) { setValor(alvo); return; }
    let raf, inicio = null;
    const passo = (agora) => {
      if (inicio === null) inicio = agora;
      const p = Math.min((agora - inicio) / duracaoMs, 1);
      setValor(de + (alvo - de) * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(passo);
    };
    raf = requestAnimationFrame(passo);
    return () => cancelAnimationFrame(raf);
  }, [alvo, duracaoMs]);
  return valor;
}

function KpiCard({ IconComp, label, value, badgeValue, previousValue, previousLabel, dark, accent, gauge, menorMelhor, serie, valorNum, formatar }) {
  // `valorNum` + `formatar` ligam a contagem. Sem eles o card mostra `value` direto, do jeito
  // que sempre foi — os outros painéis (Google, Funil, SAC) seguem funcionando sem alteração.
  const anima = valorNum !== undefined && valorNum !== null && typeof formatar === "function";
  const contado = useContagem(anima ? valorNum : 0);
  const valorExibido = anima ? formatar(contado) : value;
  if (gauge) {
    const temValor = badgeValue !== null && badgeValue !== undefined && isFinite(badgeValue);
    // badgeValue é sempre a variação REAL do número (ex.: CPL subiu 20% → +20%, mostrado
    // assim mesmo). Mas pra métricas onde menor é melhor (ex.: CPL), quem sobe é ruim — por
    // isso a COR do percentual usa o valor invertido só pra essa decisão, sem mexer no texto.
    const valorParaCor = menorMelhor ? -badgeValue : badgeValue;
    const positive = temValor && valorParaCor >= 0;
    const corPct = !temValor ? (dark ? "text-neutral-500" : "text-neutral-400") : positive ? (dark ? "text-emerald-400" : "text-emerald-600") : (dark ? "text-red-400" : "text-red-600");
    return (
      <div className={"neon-top rounded-xl border p-4 flex flex-col gap-2 " + (dark ? "is-dark bg-neutral-900/70 border-neutral-800" : "bg-white border-neutral-200 shadow-sm")} style={{ "--neon": accent }}>
        <div className="w-full flex items-center justify-between">
          <div className={"h-8 w-8 rounded-lg flex items-center justify-center shrink-0 " + (dark ? "bg-neutral-800" : "bg-neutral-100")} style={{ color: accent }}>
            <IconComp className="h-4 w-4" />
          </div>
          <p className={"text-[11px] font-medium uppercase tracking-wide text-right " + (dark ? "text-neutral-500" : "text-neutral-500")}>{label}</p>
        </div>
        <div className="w-full">
          <p className={"text-2xl font-bold tabular-nums tracking-tight " + (dark ? "text-neutral-50" : "text-neutral-900")}>{valorExibido}</p>
          <div className="flex items-baseline gap-1.5">
            <span className={"text-sm font-bold tabular-nums " + corPct}>
              {temValor ? (badgeValue >= 0 ? "+" : "-") + Math.abs(badgeValue).toFixed(1).replace(".", ",") + "%" : "—"}
            </span>
            <span className={"text-[10px] " + (dark ? "text-neutral-500" : "text-neutral-400")}>vs. período anterior</span>
          </div>
        </div>
        <Sparkline valores={serie} cor={accent} dark={dark} />
        {previousValue !== undefined && (
          <div className={"self-start inline-flex items-center gap-1 rounded-md px-2 py-1 text-xs font-semibold tabular-nums " + (dark ? "bg-neutral-800 text-neutral-200" : "bg-neutral-100 text-neutral-700")}>
            <span className={dark ? "text-neutral-500" : "text-neutral-400"}>{previousLabel}:</span> {previousValue}
          </div>
        )}
      </div>

  }
  return (
    <div className={"neon-top rounded-xl border p-4 flex flex-col gap-3 " + (dark ? "is-dark bg-neutral-900/70 border-neutral-800" : "bg-white border-neutral-200 shadow-sm")} style={{ "--neon": accent }}>
      <div className="flex items-center justify-between">
        <div className={"h-9 w-9 rounded-lg flex items-center justify-center " + (dark ? "bg-neutral-800" : "bg-neutral-100")} style={{ color: accent }}>
          <IconComp className="h-5 w-5" />
        </div>
        <Badge value={badgeValue} dark={dark} />
      </div>
      <div>
        <p className={"text-[11px] font-medium uppercase tracking-wide " + (dark ? "text-neutral-500" : "text-neutral-500")}>{label}</p>
        <p className={"text-xl font-bold tabular-nums tracking-tight " + (dark ? "text-neutral-50" : "text-neutral-900")}>{valorExibido}</p>
        {previousValue !== undefined && (
          <div className={"inline-flex items-center gap-1 mt-2 rounded-md px-2 py-1 text-xs font-semibold tabular-nums " + (dark ? "bg-neutral-800 text-neutral-200" : "bg-neutral-100 text-neutral-700")}>
            <span className={dark ? "text-neutral-500" : "text-neutral-400"}>{previousLabel}:</span> {previousValue}
          </div>
        )}
      </div>
    </div>
  );
}
function StatusPill({ status, dark }) {
  const map = {
    ok: { label: "Saldo OK", cls: dark ? "bg-emerald-500/10 text-emerald-400" : "bg-emerald-50 text-emerald-700", IconComp: IconCheck },

function SortableTh({ label, sortKey, sortConfig, onSort }) {
  const active = sortConfig.key === sortKey;
  return (
    <th className="pb-2 font-semibold cursor-pointer select-none whitespace-nowrap" onClick={() => onSort(sortKey)}>
      <span className="inline-flex items-center gap-1">
        {label}

      </span>

}
const dataParaIso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

// Tabela por marca do modo "Comparativo". Só é montada nesse modo, então a busca no histórico
// (relatórios diários congelados) só acontece quando a pessoa escolhe Comparativo. Compara só
// DIAS FECHADOS (até ontem) — hoje está no meio e ainda não tem relatório gravado; o período
// anterior é cortado no mesmo número de dias, pra não comparar recorte parcial com mês cheio.
function ComparativoMarcas({ token, range, prevRange, brandsToShow, dark, cardBg, mutedText, verInvestimento }) {
  const [estado, setEstado] = useState({ carregando: true, erro: "", atual: [], anterior: [] });
  const [sortConfig, setSortConfig] = useState({ key: "gastoAtual", dir: "desc" });

  const janela = useMemo(() => {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const ontem = new Date(hoje); ontem.setDate(ontem.getDate() - 1);
    const fimAtual = range.end < ontem ? range.end : ontem;
    if (fimAtual < range.start) return null;
    const dias = Math.round((fimAtual - range.start) / 86400000) + 1;
    const fimAnt = new Date(prevRange.start); fimAnt.setDate(fimAnt.getDate() + dias - 1);
    return { iniAtual: range.start, fimAtual, iniAnt: prevRange.start, fimAnt: fimAnt < prevRange.end ? fimAnt : prevRange.end, dias };
  }, [range, prevRange]);
  const chave = janela ? [janela.iniAtual, janela.fimAtual, janela.iniAnt, janela.fimAnt].map(dataParaIso).join("|") : "";

  useEffect(() => {
    if (!janela) { setEstado({ carregando: false, erro: "", atual: [], anterior: [] }); return; }
    let cancelado = false;
    setEstado((e) => ({ ...e, carregando: true, erro: "" }));
    const url = (de, ate) => "/api/historico/snapshots?de=" + dataParaIso(de) + "&ate=" + dataParaIso(ate);
    Promise.all([
      authJson(url(janela.iniAtual, janela.fimAtual), token),
      authJson(url(janela.iniAnt, janela.fimAnt), token),
    ]).then(([atual, anterior]) => {
      if (!cancelado) setEstado({ carregando: false, erro: "", atual, anterior });
    }).catch((e) => {
      if (!cancelado) setEstado({ carregando: false, erro: e.message || "Não foi possível carregar o comparativo.", atual: [], anterior: [] });
    });
    return () => { cancelado = true; };
  }, [token, chave]);

  const { linhas, total } = useMemo(() => {
    const nomes = new Set(brandsToShow);
    const mapa = {};
    const acumular = (lista, campoGasto, campoLeads) => {
      lista.forEach((s) => {
        if (!nomes.has(s.marca)) return;
        if (!mapa[s.marca]) mapa[s.marca] = { marca: s.marca, gastoAtual: 0, leadsAtual: 0, gastoAnt: 0, leadsAnt: 0 };
        mapa[s.marca][campoGasto] += s.gasto || 0;
        mapa[s.marca][campoLeads] += (s.leadsFormulario || 0) + (s.leadsWhatsapp || 0);
      });
    };
    acumular(estado.atual, "gastoAtual", "leadsAtual");
    acumular(estado.anterior, "gastoAnt", "leadsAnt");
    const completar = (l) => {
      l.cplAtual = l.leadsAtual > 0 ? l.gastoAtual / l.leadsAtual : null;
      l.cplAnt = l.leadsAnt > 0 ? l.gastoAnt / l.leadsAnt : null;
      l.varGasto = variacao(l.gastoAtual, l.gastoAnt);
      l.varLeads = variacao(l.leadsAtual, l.leadsAnt);
      l.varCpl = l.cplAtual !== null && l.cplAnt ? variacao(l.cplAtual, l.cplAnt) : null;
      return l;
    };
    const lista = Object.values(mapa).map(completar);
    const soma = lista.reduce((t, l) => ({
      marca: "Total (" + lista.length + ")", gastoAtual: t.gastoAtual + l.gastoAtual, leadsAtual: t.leadsAtual + l.leadsAtual,
      gastoAnt: t.gastoAnt + l.gastoAnt, leadsAnt: t.leadsAnt + l.leadsAnt,
    }), { gastoAtual: 0, leadsAtual: 0, gastoAnt: 0, leadsAnt: 0 });
    return { linhas: lista, total: completar(soma) };
  }, [estado, brandsToShow]);

  const ordenadas = useMemo(() => {
    const arr = [...linhas];
    const { key, dir } = sortConfig;
    arr.sort((a, b) => {
      const va = a[key], vb = b[key];
      if (va === null || va === undefined) return 1;   // sem valor vai sempre pro fim
      if (vb === null || vb === undefined) return -1;
      const c = typeof va === "string" ? va.localeCompare(vb, "pt-BR") : va - vb;
      return dir === "asc" ? c : -c;
    });
    return arr;
  }, [linhas, sortConfig]);
  function handleSort(key) {
    setSortConfig((s) => (s.key === key ? { key, dir: s.dir === "asc" ? "desc" : "asc" } : { key, dir: key === "marca" ? "asc" : "desc" }));
  }

  const reconstruido = [...estado.atual, ...estado.anterior].some((s) => s.fonte === "reconstruido");
  const sinAnterior = !estado.carregando && !estado.erro && janela && estado.anterior.length === 0;
  const th = (label, k) => <SortableTh label={label} sortKey={k} sortConfig={sortConfig} onSort={handleSort} />;
  const bom = dark ? "text-emerald-400" : "text-emerald-600";
  const ruim = dark ? "text-red-400" : "text-red-600";
  const VarCell = ({ v, menorMelhor, neutro }) => {
    if (v === null || v === undefined) return <td className={"py-2.5 tabular-nums " + mutedText}>—</td>;
    const cor = neutro || Math.abs(v) < 0.5 ? mutedText : ((v > 0) !== !!menorMelhor ? bom : ruim);
    return <td className={"py-2.5 tabular-nums font-semibold " + cor}>{(v > 0 ? "+" : "") + v.toFixed(0).replace("-", "−") + "%"}</td>;
  };
  const fmtCpl = (v) => (v === null ? "—" : fmtBRL(v));
  // O ano só aparece quando o período de comparação é de outro ano — sem ele, "Mesmo Mês Ano
  // Passado" ficaria escrito igual ao período atual.

function NewsCarousel({ itens, dark, mutedText }) {
  const scrollRef = useRef(null);
  const [activeIndex, setActiveIndex] = useState(0);

  function handleScroll() {
    const el = scrollRef.current;
    if (!el) return;
    const center = el.scrollLeft + el.clientWidth / 2;
    let closest = 0, closestDist = Infinity;
    Array.from(el.children).forEach((child, i) => {
      const childCenter = child.offsetLeft + child.offsetWidth / 2;
      const dist = Math.abs(center - childCenter);
      if (dist < closestDist) { closestDist = dist; closest = i; }
    });
    setActiveIndex(closest);
  }
  useEffect(() => { const t = setTimeout(handleScroll, 50); return () => clearTimeout(t); }, [itens]);

  function scrollToIndex(i) {
    const el = scrollRef.current;
    const child = el && el.children[i];
    if (!el || !child) return;
    el.scrollTo({ left: child.offsetLeft - (el.clientWidth - child.offsetWidth) / 2, behavior: "smooth" });
  }

  if (!itens.length) return null;
  return (
    <div className="relative">
      <div ref={scrollRef} onScroll={handleScroll}
        className="flex gap-4 overflow-x-auto pb-2 px-[16%] snap-x snap-mandatory scroll-smooth [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        {itens.map((n, i) => (
          <a key={i} href={n.link} target="_blank" rel="noopener noreferrer"
            className={"shrink-0 w-64 sm:w-72 snap-center rounded-xl border overflow-hidden transition-all duration-300 hover:scale-105 hover:opacity-100 hover:shadow-lg hover:z-10 relative " +
              (dark ? "bg-neutral-900 border-neutral-800" : "bg-white border-neutral-200 shadow-sm") + " " +
              (i === activeIndex ? "scale-100 opacity-100" : "scale-90 opacity-40")}>
            <div className={"h-36 w-full " + (dark ? "bg-neutral-800" : "bg-neutral-100")}>
              {n.thumbnailUrl ? <img src={n.thumbnailUrl} alt="" className="h-full w-full object-cover" /> : (
                <div className="h-full w-full flex items-center justify-center"><IconImage className={"h-6 w-6 " + mutedText} /></div>
              )}
            </div>
            <div className="p-3">
              <p className="text-sm font-semibold leading-snug line-clamp-3">{n.titulo}</p>
              <p className={"text-[11px] mt-1 " + mutedText}>{n.fonte}{n.publicadoEm ? " · " + fmtDateShort(n.publicadoEm) : ""}</p>
            </div>
          </a>
        ))}
      </div>
      {itens.length > 1 && (
        <>
          <button onClick={() => scrollToIndex(Math.max(0, activeIndex - 1))} aria-label="Anterior"
            className={"absolute left-0 top-1/2 -translate-y-1/2 h-8 w-8 rounded-full flex items-center justify-center border z-10 " + (dark ? "bg-neutral-900 border-neutral-700" : "bg-white border-neutral-200 shadow")}>
            <IconChevronDown className="h-4 w-4 rotate-90" />
          </button>
          <button onClick={() => scrollToIndex(Math.min(itens.length - 1, activeIndex + 1))} aria-label="Próxima"
            className={"absolute right-0 top-1/2 -translate-y-1/2 h-8 w-8 rounded-full flex items-center justify-center border z-10 " + (dark ? "bg-neutral-900 border-neutral-700" : "bg-white border-neutral-200 shadow")}>
            <IconChevronDown className="h-4 w-4 -rotate-90" />
          </button>
        </>
      )}
    </div>
  );
}

function OrganicAccountCard({ item, dark, cardBg, mutedText, range }) {
  // O período é aplicado aqui, não no servidor: a conta chega com o ganho de seguidores dia a
  // dia e com todas as publicações datadas, e o card recorta o intervalo selecionado — mesma
  // mecânica do tráfego e do top 3 de criativos. Antes, o backend mandava um vencedor já
  // escolhido entre as últimas 50 publicações, sem olhar data, e o card exibia post de maio
  // como se fosse do mês corrente.
  const { post, ganho } = useMemo(() => {
    // Compara por DIA, como parseDateLocal/filterByRange fazem no resto do sistema. O
    // range.end é meia-noite de hoje: comparando data e hora, uma publicação feita hoje à
    // tarde ficaria de fora do próprio dia dela.
    const dentro = (iso) => {
      if (!iso) return false;
      const d = parseDateLocal(iso.slice(0, 10));
      return d >= range.start && d <= range.end;
    };
    const ganhoPeriodo = (item.ganhosDiarios || [])
      .filter((g) => dentro(g.data))
      .reduce((a, g) => a + (g.ganho || 0), 0);
    const doPeriodo = (item.posts || []).filter((p) => dentro(p.publicadoEm));
    const melhor = doPeriodo.reduce(
      (a, p) => (a === null || (p.curtidas || 0) > (a.curtidas || 0) ? p : a),
      null
    );
    return { post: melhor, ganho: ganhoPeriodo };
  }, [item, range.start, range.end]);

  const ganhoPositivo = ganho >= 0;
  return (
    <div className={"rounded-xl border p-4 flex flex-col gap-3 " + cardBg}>
      <div className="flex items-start justify-between gap-2">
        <div className="min-w-0">
          <p className="text-sm font-semibold truncate">@{item.username}</p>
          <p className={"text-[11px] truncate " + mutedText}>{item.marcas.join(" · ")}</p>
        </div>
        <div className="text-right shrink-0">
          <p className="text-lg font-bold tabular-nums leading-tight">{fmtNum(item.seguidoresAtual)}</p>
          <p className={"text-[10px] uppercase tracking-wide font-medium " + mutedText}>seguidores</p>
        </div>
      </div>

      <div className={"inline-flex items-center gap-1 self-start rounded-full px-2 py-0.5 text-[11px] font-semibold " +
        (ganhoPositivo ? (dark ? "bg-emerald-500/10 text-emerald-400" : "bg-emerald-50 text-emerald-600") : (dark ? "bg-red-500/10 text-red-400" : "bg-red-50 text-red-600"))}>
        {ganhoPositivo ? <IconArrowUp className="h-3 w-3" /> : <IconArrowDown className="h-3 w-3" />}
        {fmtNum(Math.abs(ganho))} seguidores no período
      </div>

      {post ? (
        // Post inteiro é um link pro Instagram — clicar em qualquer parte (miniatura, legenda
        // ou curtidas) abre o post de verdade, pra quem tá analisando não precisar procurar
        // ele à mão dentro do Instagram. Sem permalink (posts demo, ou conta ainda sem
        // sincronizar), cai pra div comum — sem link morto.
        <PostLink permalink={post.permalink} dark={dark}>
          <div className={"h-16 w-16 shrink-0 rounded-lg overflow-hidden flex items-center justify-center " + (dark ? "bg-neutral-800" : "bg-neutral-100")}>
            {post.thumbnailUrl ? (
              <img src={post.thumbnailUrl} alt="Post" className="h-full w-full object-cover" />
            ) : (
              <IconImage className={"h-5 w-5 " + mutedText} />
            )}
          </div>
          <div className="min-w-0 flex-1">
            <p className="text-xs font-medium truncate">{post.legenda || "Post em destaque"}</p>
            <p className={"text-xs flex items-center gap-1 " + mutedText}>
              <IconHeart className="h-3 w-3" /> {fmtNum(post.curtidas)} · {fmtNum(post.comentarios)} comentários
            </p>
          </div>
          {post.permalink && <IconArrowUp className={"h-3.5 w-3.5 shrink-0 rotate-45 " + mutedText} />}
        </PostLink>
      ) : (
        <p className={"text-xs " + mutedText}>Nenhuma publicação neste período.</p>
      )}
    </div>
  );
}

// Easter eggs pedidos pelo Felipe (15/09/2026): sequências de teclado funcionando em qualquer
// tela do sistema (não só uma), por isso vivem aqui e são usadas no componente raiz
// (RavieraDashboard), não numa tela específica. useSequenciaTeclas é genérico (aceita
// qualquer sequência) pra não duplicar a lógica de reconhecimento entre os dois easter eggs.
const KONAMI_SEQUENCIA = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
const ESTRELAS_SEQUENCIA = ["ArrowDown", "ArrowDown", "ArrowUp", "ArrowUp", "ArrowRight", "ArrowLeft", "ArrowRight", "ArrowLeft", "a", "b"];

function useSequenciaTeclas(sequencia, onTrigger) {
  useEffect(() => {
    let progresso = 0;
    function aoTeclar(e) {
      // Teclas de uma letra só (a/b) vêm maiúsculas com Caps Lock ligado — normaliza; as de
      // seta (ArrowUp etc.) já são um nome fixo, não precisam disso.
      const tecla = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (tecla === sequencia[progresso]) {
        progresso += 1;
        if (progresso === sequencia.length) {
          progresso = 0;
          onTrigger();
        }
      } else {
        // Não zera direto pra "primeira tecla errada de novo já conta como o primeiro passo"
        // funcionar (ex.: ↑ ↑ ↑ ↓ ↓... continua reconhecendo a partir do segundo ↑).
        progresso = tecla === sequencia[0] ? 1 : 0;
      }
    }
    window.addEventListener("keydown", aoTeclar);
    return () => window.removeEventListener("keydown", aoTeclar);
  }, [sequencia, onTrigger]);
}

                      setNewUser({ ...newUser, brand_ids: checked ? newUser.brand_ids.filter((id) => id !== b.id) : [...newUser.brand_ids, b.id] });

          {newUser.role === "gerente" && (

          <button onClick={() => withErrorHandling(async () => {

      <ConfirmModal confirm={confirm} dark={dark} onCancel={() => setConfirm(null)} onConfirm={handleConfirm} />

/* 7b) DASHBOARD GOOGLE ADS                                             */
/* ================================================================== */

function KeywordCard({ kw, dark, cardBg, mutedText }) {
  return (
    <div className={"rounded-xl border p-3 flex gap-2.5 items-center " + cardBg}>
      <span className="text-lg leading-none shrink-0">{RANK_MEDAL[kw.rank] || kw.rank}</span>
      <div className="min-w-0 flex-1">
        <p className="text-sm font-semibold truncate">{kw.texto || "—"}</p>
        <p className={"text-xs " + mutedText}>
          Investido {fmtBRL(kw.gasto)} · {fmtNum(kw.cliques)} cliques · {fmtNum(kw.conversoes)} conv. · CPA {fmtBRL(kw.custoPorConversao)}
        </p>
      </div>
    </div>
  );
}

function KeywordsBrandGroup({ item, dark, cardBg, mutedText }) {
  return (
    <div className="flex flex-col gap-2">
      <p className={"text-[11px] font-semibold uppercase tracking-wide " + mutedText}>{item.marca}</p>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {item.palavrasChave.map((k) => (
          <KeywordCard key={k.rank} kw={k} dark={dark} cardBg={cardBg} mutedText={mutedText} />
        ))}
      </div>
    </div>
  );
}

function LocationHeatRow({ loc, maxConversoes, dark, mutedText }) {
  const intensidade = maxConversoes > 0 ? loc.conversoes / maxConversoes : 0;
  return (
    <div className={"relative rounded-lg overflow-hidden border " + (dark ? "border-neutral-800" : "border-neutral-200")}>
      <div className="absolute inset-y-0 left-0" style={{
        width: (8 + intensidade * 92) + "%",
        background: dark ? "rgba(248,113,113," + (0.1 + intensidade * 0.35).toFixed(2) + ")" : "rgba(220,38,38," + (0.06 + intensidade * 0.3).toFixed(2) + ")",
      }} />
      <div className="relative flex items-center justify-between gap-2 px-3 py-2 text-xs">
        <span className="font-semibold truncate">{loc.cidade}{loc.estado ? " · " + loc.estado : ""}</span>
        <span className={"shrink-0 " + mutedText}>{fmtNum(loc.conversoes)} conv. · {fmtNum(loc.cliques)} cliques · {fmtBRL(loc.gasto)}</span>
      </div>
    </div>
  );
}

function LocationHeatmapBrandGroup({ item, dark, mutedText }) {
  const maxConversoes = Math.max(...item.localidades.map((l) => l.conversoes), 0.001);
  return (
    <div className="flex flex-col gap-2">
      <p className={"text-[11px] font-semibold uppercase tracking-wide " + mutedText}>{item.marca}</p>
      <div className="flex flex-col gap-1.5">
        {item.localidades.map((l) => (
          <LocationHeatRow key={l.cidade} loc={l} maxConversoes={maxConversoes} dark={dark} mutedText={mutedText} />
        ))}
      </div>
    </div>
  );
}

function RegionHeatRow({ item, dark, mutedText, maxLeads, onAbrirCidades }) {
  const intensidade = maxLeads > 0 ? item.leads / maxLeads : 0;
  return (
    <button onClick={() => onAbrirCidades(item.regiao)}
      className={"relative w-full text-left rounded-lg overflow-hidden border transition-colors " +
        (dark ? "border-neutral-800 hover:border-neutral-600" : "border-neutral-200 hover:border-neutral-400")}
      title="Clique pra ver as cidades configuradas nesse estado">
      <div className="absolute inset-y-0 left-0" style={{
        width: (8 + intensidade * 92) + "%",
        background: dark ? "rgba(96,165,250," + (0.1 + intensidade * 0.35).toFixed(2) + ")" : "rgba(37,99,235," + (0.06 + intensidade * 0.3).toFixed(2) + ")",
      }} />
      <div className="relative flex items-center justify-between gap-2 px-3 py-2 text-xs">
        <span className="font-semibold truncate">{item.regiao}</span>
        <span className={"shrink-0 " + mutedText}>{fmtNum(item.leads)} leads · {fmtBRL(item.gasto)}</span>
      </div>
    </button>
  );
}

function RegionHeatmapBrandGroup({ item, dark, mutedText, onAbrirCidades }) {
  // Cada marca pode ter de 1 a 8 estados — num grid de 3 colunas, mostrar todos direto deixa
  // cada cartão com uma altura diferente e a grade inteira desalinhada. Por padrão só o
  // estado principal aparece (mesma altura pra todo mundo); "+N estados" abre o resto.
  const [expandido, setExpandido] = useState(false);
  const regioesOrdenadas = [...item.regioes].sort((a, b) => b.leads - a.leads);
  const [principal, ...restante] = regioesOrdenadas;
  const maxLeads = Math.max(...regioesOrdenadas.map((r) => r.leads), 0.001);
  const abrir = (regiao) => onAbrirCidades(item.brandId, item.marca, regiao);

  return (
    <div className={"rounded-lg border overflow-hidden " + (dark ? "border-neutral-800" : "border-neutral-200")}>
      <button onClick={() => setExpandido((v) => !v)} disabled={restante.length === 0}
        className={"w-full flex items-center justify-between gap-2 px-2.5 pt-2 pb-1 text-left " + (restante.length > 0 ? "cursor-pointer" : "cursor-default")}>
        <span className={"text-[11px] font-semibold uppercase tracking-wide truncate " + mutedText}>{item.marca}</span>
        {restante.length > 0 && (
          <span className={"shrink-0 flex items-center gap-0.5 text-[11px] font-semibold " + (dark ? "text-neutral-400" : "text-neutral-500")}>
            {expandido ? "ver menos" : `+${restante.length}`}
            <IconChevronDown className={"h-3 w-3 transition-transform" + (expandido ? " rotate-180" : "")} />
          </span>
        )}
      </button>
      <div className="flex flex-col gap-1.5 p-1.5 pt-0.5">
        <RegionHeatRow item={principal} dark={dark} mutedText={mutedText} maxLeads={maxLeads} onAbrirCidades={abrir} />
        {expandido && restante.map((r) => (
          <RegionHeatRow key={r.regiao} item={r} dark={dark} mutedText={mutedText} maxLeads={maxLeads} onAbrirCidades={abrir} />
        ))}
      </div>
    </div>
  );
}

function GoogleAdsDashboard({ token, dark, cardBg, mutedText, pushToast, permissoes }) {
  const [marcaFiltro, setMarcaFiltro] = useState("todas");
  const [periodo, setPeriodo] = useState("mesAtual");
  const [comparativoTipo, setComparativoTipo] = useState("mesAnterior");
  const [customStart, setCustomStart] = useState("");
  const [customEnd, setCustomEnd] = useState("");
  const [dashboardData, setDashboardData] = useState({ brands: [], trafego: [], orcamentos: [], topKeywords: [], heatmap: [], meta: {} });
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);

  async function loadDashboard() {
    setLoading(true);
    try {
      const data = await authJson("/api/dashboard/google", token);
      setDashboardData(data);
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setLoading(false);
    }
  }
  async function refreshData() {
    setSyncing(true);
    try {
      await authJson("/api/sync", token, { method: "POST" });
      await loadDashboard();
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setSyncing(false);
    }
  }
  useEffect(() => { loadDashboard(); }, []);

  const brandsList = useMemo(() => dashboardData.brands.map((b) => b.nome).sort(), [dashboardData.brands]);
  const brandsToShow = useMemo(() => (marcaFiltro === "todas" ? brandsList : [marcaFiltro]), [marcaFiltro, brandsList]);

  const range = useMemo(() => getPeriodRange(periodo, customStart, customEnd), [periodo, customStart, customEnd]);
  const prevRange = useMemo(
    () => (periodo === "comparativo" ? getComparativoRange(range, comparativoTipo) : getPreviousRange(range)),
    [range, periodo, comparativoTipo]
  );

  const scopedTrafego = useMemo(() => dashboardData.trafego.filter((r) => brandsToShow.includes(r.marca)), [dashboardData.trafego, brandsToShow]);
  const currentRecords = useMemo(() => filterByRange(scopedTrafego, range), [scopedTrafego, range]);
  const previousRecords = useMemo(() => filterByRange(scopedTrafego, prevRange), [scopedTrafego, prevRange]);

  function aggregateGoogle(records) {
    const base = records.reduce((acc, r) => { acc.gasto += r.gasto; acc.cliques += r.cliques; acc.conversoes += r.conversoes; return acc; }, { gasto: 0, cliques: 0, conversoes: 0 });
    base.cpa = base.conversoes > 0 ? base.gasto / base.conversoes : 0;
    return base;
  }
  const currentAgg = useMemo(() => aggregateGoogle(currentRecords), [currentRecords]);
  const previousAgg = useMemo(() => aggregateGoogle(previousRecords), [previousRecords]);

  const topKeywordsToShow = useMemo(() => dashboardData.topKeywords.filter((g) => brandsToShow.includes(g.marca)), [dashboardData.topKeywords, brandsToShow]);
  const heatmapToShow = useMemo(() => dashboardData.heatmap.filter((g) => brandsToShow.includes(g.marca)), [dashboardData.heatmap, brandsToShow]);

  const [keywordsExpanded, setKeywordsExpanded] = useState(false);
  const [heatmapExpanded, setHeatmapExpanded] = useState(false);
  useEffect(() => { setKeywordsExpanded(false); setHeatmapExpanded(false); }, [brandsToShow]);
  const KEYWORDS_PREVIEW_COUNT = 3;
  const HEATMAP_PREVIEW_COUNT = 3;
  const keywordsToRender = keywordsExpanded ? topKeywordsToShow : topKeywordsToShow.slice(0, KEYWORDS_PREVIEW_COUNT);
  const hasMoreKeywords = topKeywordsToShow.length > KEYWORDS_PREVIEW_COUNT;
  const heatmapToRender = heatmapExpanded ? heatmapToShow : heatmapToShow.slice(0, HEATMAP_PREVIEW_COUNT);
  const hasMoreHeatmap = heatmapToShow.length > HEATMAP_PREVIEW_COUNT;

  const linhasOrcamento = useMemo(() => {
    return brandsToShow.map((marca) => {
      const orc = dashboardData.orcamentos.find((o) => o.marca === marca) || {};
      const recs = filterByRange(dashboardData.trafego.filter((r) => r.marca === marca), range);
      const agg = aggregateGoogle(recs);
      return {
        marca, orcamentoDiario: orc.orcamentoDiario || 0, status: orc.status || "",
        orcamentoMensal: orc.orcamentoMensal || 0, gastoMesAtual: orc.gastoMesAtual || 0, saldoAtual: orc.saldoAtual || 0,
        gasto: agg.gasto, cliques: agg.cliques, conversoes: agg.conversoes, cpa: agg.cpa,
      };
    });
  }, [brandsToShow, dashboardData.orcamentos, dashboardData.trafego, range]);

  const totals = useMemo(() => {
    const t = linhasOrcamento.reduce((acc, r) => {
      acc.gasto += r.gasto; acc.cliques += r.cliques; acc.conversoes += r.conversoes; acc.orcamentoDiario += r.orcamentoDiario;
      acc.orcamentoMensal += r.orcamentoMensal; acc.saldoAtual += r.saldoAtual;
      return acc;
    }, { gasto: 0, cliques: 0, conversoes: 0, orcamentoDiario: 0, orcamentoMensal: 0, saldoAtual: 0 });
    t.cpa = t.conversoes > 0 ? t.gasto / t.conversoes : 0;
    return t;
  }, [linhasOrcamento]);

  const previousLabel = comparativoTipo === "anoAnterior" ? "mesmo mês " + prevRange.start.getFullYear() : "mês anterior";

  return (
    <div className="flex flex-col gap-6">
      {dashboardData.meta.demoMode && (
        <div className={"rounded-lg border px-3 py-2 flex items-center gap-2 text-xs " + (dark ? "bg-amber-500/5 border-amber-500/20 text-amber-400" : "bg-amber-50 border-amber-200 text-amber-700")}>
          <IconRefresh className="h-3.5 w-3.5 shrink-0" />
          Exibindo dados de demonstração (credenciais do Google Ads não configuradas no servidor).
        </div>
      )}

      {syncing && (

/* ================================================================== */
/* 7.1) FUNIL DE VENDAS (Lead → Proposta → Venda)                       */
/* ================================================================== */

function aggregateFunil(records) {
  const base = records.reduce((acc, r) => { acc.leads += r.leads; acc.propostas += r.propostas; acc.vendas += r.vendas; return acc; }, { leads: 0, propostas: 0, vendas: 0 });
  base.taxaLeadProposta = base.leads > 0 ? (base.propostas / base.leads) * 100 : 0;
  base.taxaPropostaVenda = base.propostas > 0 ? (base.vendas / base.propostas) * 100 : 0;
  base.taxaGeral = base.leads > 0 ? (base.vendas / base.leads) * 100 : 0;
  return base;
}
function clampNum(v, min, max) { return Math.min(max, Math.max(min, v)); }
const fmtPct1 = (v) => v.toFixed(1).replace(".", ",") + "%";

// Arredonda os cantos de um polígono qualquer (usado nos trapézios do funil):
// pra cada vértice, recua um pouco pelas duas arestas vizinhas e conecta com uma curva quadrática.
function roundedPolygonPath(points, radius) {
  const n = points.length;
  const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  let d = "";
  for (let i = 0; i < n; i++) {
    const curr = points[i];
    const prev = points[(i - 1 + n) % n];
    const next = points[(i + 1) % n];
    const len1 = dist(prev, curr) || 1;
    const len2 = dist(curr, next) || 1;
    const r = Math.min(radius, len1 / 2, len2 / 2);
    const p1 = [curr[0] + (prev[0] - curr[0]) / len1 * r, curr[1] + (prev[1] - curr[1]) / len1 * r];
    const p2 = [curr[0] + (next[0] - curr[0]) / len2 * r, curr[1] + (next[1] - curr[1]) / len2 * r];
    d += (i === 0 ? `M ${p1[0]},${p1[1]} ` : `L ${p1[0]},${p1[1]} `) + `Q ${curr[0]},${curr[1]} ${p2[0]},${p2[1]} `;
  }
  return d + "Z";
}
function FunnelShape({ y0, y1, topHalf, bottomHalf, cx, fill, dark }) {
  const points = [[cx - topHalf, y0], [cx + topHalf, y0], [cx + bottomHalf, y1], [cx - bottomHalf, y1]];
  return (
    <path d={roundedPolygonPath(points, 12)} fill={fill}
      stroke={dark ? "rgba(255,255,255,0.10)" : "rgba(255,255,255,0.5)"} strokeWidth="1"
      style={!dark ? { filter: "drop-shadow(0 10px 16px rgba(15,23,42,0.14))" } : undefined} />
  );
}
function FunnelDiagram({ agg, dark }) {
  const cx = 190, maxHalf = 150, stageH = 82, gap = 14, marginTop = 16, labelX = 372;
  const s0y0 = marginTop, s0y1 = s0y0 + stageH;
  const s1y0 = s0y1 + gap, s1y1 = s1y0 + stageH;
  const s2y0 = s1y1 + gap, s2y1 = s2y0 + stageH;
  const viewH = s2y1 + marginTop;

  const propostasRatio = agg.leads > 0 ? agg.propostas / agg.leads : 0;
  const vendasRatio = agg.leads > 0 ? agg.vendas / agg.leads : 0;
  const w0 = maxHalf;
  const w1 = clampNum(maxHalf * propostasRatio, 55, maxHalf);
  const w2 = clampNum(Math.min(w1, maxHalf * vendasRatio), 38, w1);
  const w3 = clampNum(w2 - 18, 26, w2);

  const mid = (a, b) => (a + b) / 2;
  const textMuted = dark ? "#9ca3af" : "#64748b";
  const textStrong = dark ? "#e5e7eb" : "#334155";
  const lineColor = dark ? "#404040" : "#cbd5e1";

  return (
    <svg viewBox={`0 0 500 ${viewH}`} className="w-full h-auto block" style={{ maxWidth: 460, margin: "0 auto" }}>
      <defs>
        <linearGradient id="funilGradLeads" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#60a5fa" /><stop offset="100%" stopColor="#3b82f6" />
        </linearGradient>
        <linearGradient id="funilGradPropostas" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#a78bfa" /><stop offset="100%" stopColor="#8b5cf6" />
        </linearGradient>
        <linearGradient id="funilGradVendas" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#34d399" /><stop offset="100%" stopColor="#10b981" />
        </linearGradient>
      </defs>

      <FunnelShape y0={s0y0} y1={s0y1} topHalf={w0} bottomHalf={w1} cx={cx} fill="url(#funilGradLeads)" dark={dark} />
      <FunnelShape y0={s1y0} y1={s1y1} topHalf={w1} bottomHalf={w2} cx={cx} fill="url(#funilGradPropostas)" dark={dark} />
      <FunnelShape y0={s2y0} y1={s2y1} topHalf={w2} bottomHalf={w3} cx={cx} fill="url(#funilGradVendas)" dark={dark} />

      <text x={cx} y={mid(s0y0, s0y1) - 6} textAnchor="middle" fontSize="11" fontWeight="600" letterSpacing="0.5" fill="rgba(255,255,255,0.85)">LEADS</text>
      <text x={cx} y={mid(s0y0, s0y1) + 19} textAnchor="middle" fontSize="23" fontWeight="700" fill="#fff">{fmtNum(agg.leads)}</text>

      <text x={cx} y={mid(s1y0, s1y1) - 6} textAnchor="middle" fontSize="11" fontWeight="600" letterSpacing="0.5" fill="rgba(255,255,255,0.85)">PROPOSTAS</text>
      <text x={cx} y={mid(s1y0, s1y1) + 19} textAnchor="middle" fontSize="23" fontWeight="700" fill="#fff">{fmtNum(agg.propostas)}</text>

      <text x={cx} y={mid(s2y0, s2y1) - 6} textAnchor="middle" fontSize="11" fontWeight="600" letterSpacing="0.5" fill="rgba(255,255,255,0.85)">VENDAS</text>
      <text x={cx} y={mid(s2y0, s2y1) + 19} textAnchor="middle" fontSize="23" fontWeight="700" fill="#fff">{fmtNum(agg.vendas)}</text>

      <text x={labelX} y={mid(s0y0, s0y1)} dominantBaseline="middle" fontSize="12" fontWeight="600" fill={textStrong}>100% do total</text>

      <line x1={cx + w1 + 6} y1={mid(s0y1, s1y0)} x2={labelX - 10} y2={mid(s0y1, s1y0)} stroke={lineColor} strokeWidth="1" />
      <text x={labelX} y={mid(s0y1, s1y0)} dominantBaseline="middle" fontSize="11" fontWeight="600" fill={textMuted}>{fmtPct1(agg.taxaLeadProposta)} de conversão</text>

      <text x={labelX} y={mid(s1y0, s1y1)} dominantBaseline="middle" fontSize="12" fontWeight="600" fill={textStrong}>{fmtPct1(agg.taxaLeadProposta)} do total</text>

      <line x1={cx + w2 + 6} y1={mid(s1y1, s2y0)} x2={labelX - 10} y2={mid(s1y1, s2y0)} stroke={lineColor} strokeWidth="1" />
      <text x={labelX} y={mid(s1y1, s2y0)} dominantBaseline="middle" fontSize="11" fontWeight="600" fill={textMuted}>{fmtPct1(agg.taxaPropostaVenda)} de conversão</text>

      <text x={labelX} y={mid(s2y0, s2y1)} dominantBaseline="middle" fontSize="12" fontWeight="600" fill={textStrong}>{fmtPct1(agg.taxaGeral)} do total</text>
    </svg>
  );
}

// Cor por tipo de campanha do concorrente. Os públicos com isenção (PcD, taxista, produtor
// rural) ganham cor própria porque são o dado mais acionável da aba: são vendas de margem
// garantida, e dá pra ver rápido se o concorrente está explorando um nicho que a gente não.
function corTipo(tipo, dark) {
  const mapa = {
    "PcD": dark ? "bg-violet-500/15 text-violet-300" : "bg-violet-100 text-violet-700",
    "Taxista": dark ? "bg-amber-500/15 text-amber-300" : "bg-amber-100 text-amber-700",
    "Produtor rural / CNPJ": dark ? "bg-lime-500/15 text-lime-300" : "bg-lime-100 text-lime-700",
    "Consórcio": dark ? "bg-cyan-500/15 text-cyan-300" : "bg-cyan-100 text-cyan-700",
    "Pós-venda": dark ? "bg-sky-500/15 text-sky-300" : "bg-sky-100 text-sky-700",
    "Seminovos": dark ? "bg-teal-500/15 text-teal-300" : "bg-teal-100 text-teal-700",
    "Bônus na troca": dark ? "bg-rose-500/15 text-rose-300" : "bg-rose-100 text-rose-700",
    "Taxa 0%": dark ? "bg-indigo-500/15 text-indigo-300" : "bg-indigo-100 text-indigo-700",
  };
  return mapa[tipo] || (dark ? "bg-neutral-800 text-neutral-400" : "bg-neutral-100 text-neutral-600");
}

// Aviso de token perto de vencer. Só aparece quando há o que avisar — em condição saudável
// (tudo em token de usuário do sistema, que não tem prazo) some da tela.
// Existe porque token do Meta morre em silêncio: o painel zera e ninguém sabe por quê.
function AlertaTokens({ tokens, dark }) {
  if (!tokens || !tokens.alertas || !tokens.alertas.length) return null;
  const vencidos = tokens.alertas.filter((t) => !t.valido || (t.diasRestantes !== null && t.diasRestantes <= 0));
  const grave = vencidos.length > 0;
  const cor = grave
    ? (dark ? "bg-red-500/5 border-red-500/20 text-red-400" : "bg-red-50 border-red-200 text-red-700")
    : (dark ? "bg-amber-500/5 border-amber-500/20 text-amber-400" : "bg-amber-50 border-amber-200 text-amber-700");
  // Vários tokens vencendo no mesmo dia são um problema só (os do Instagram saem todos do
  // mesmo token de usuário) — resumimos em vez de empilhar 23 avisos iguais.
  const primeiro = tokens.alertas[0];
  const outros = tokens.alertas.length - 1;
  return (
    <div className={"rounded-lg border px-3 py-2 flex items-start gap-2 text-xs " + cor}>
      <IconAlertTriangle className="h-3.5 w-3.5 shrink-0 mt-0.5" />
      <span>
        <strong>{grave ? "Token vencido" : "Token perto de vencer"}:</strong> {primeiro.rotulo}
        {primeiro.diasRestantes !== null && primeiro.diasRestantes > 0
          ? ` vence em ${primeiro.diasRestantes} dia${primeiro.diasRestantes === 1 ? "" : "s"}`
          : " já não está mais valendo"}
        {outros > 0 && ` — e mais ${outros} na mesma situação`}. Sem renovar, esses dados param de atualizar.
      </span>
    </div>
  );
}
