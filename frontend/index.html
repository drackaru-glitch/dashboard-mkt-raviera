/* REDES SOCIAIS — o que chegou nas redes e o que ainda não foi respondido */
/* ================================================================== */

// Quanto tempo um comentário sem resposta pode esperar antes de virar problema. Não é regra
// do Meta, é escolha nossa: quem comenta num anúncio de carro está com intenção agora, e
// meio dia parado já é um lead esfriando.
const HORAS_ATRASO = 12;

function esperaTexto(horas) {
  if (horas === null || horas === undefined) return "—";
  if (horas < 1) return Math.max(Math.round(horas * 60), 1) + " min";
  if (horas < 48) return Math.round(horas) + "h";
  return Math.round(horas / 24) + " dias";
}

function RedesSociaisDashboard({ token, dark, cardBg, mutedText, pushToast }) {
  const [dados, setDados] = useState(null);
  const [loading, setLoading] = useState(true);
  const [dias, setDias] = useState(30);
  const [marcaFiltro, setMarcaFiltro] = useState("todas");
  const [soPendentes, setSoPendentes] = useState(true);
  const [limite, setLimite] = useState(40);

  async function carregar(d = dias) {
    setLoading(true);
    try {
      setDados(await authJson("/api/redes-sociais?dias=" + d, token));
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setLoading(false);
    }
  }
  useEffect(() => { carregar(); }, []);

  const comentarios = useMemo(() => {
    if (!dados) return [];
    return dados.comentarios.filter(
      (m) => (marcaFiltro === "todas" || m.marca === marcaFiltro) && (!soPendentes || !m.respondido)
    );
  }, [dados, marcaFiltro, soPendentes]);

  useEffect(() => { setLimite(40); }, [marcaFiltro, soPendentes]);

  if (loading) return <div className={"text-sm " + mutedText}>Carregando…</div>;
  if (!dados) return null;

  const r = dados.resumo;
  const semNada = !dados.comentarios.length;

  return (
    <>
      <div className={"neon-top rounded-xl border p-3 flex flex-wrap items-center gap-3 " + (dark ? "is-dark " : "") + cardBg} style={{ "--neon": "#ec4899" }}>
        <h2 className="text-sm font-bold flex items-center gap-1.5"><IconMessage className="h-4 w-4" /> Redes Sociais</h2>
        <span className={"text-xs " + mutedText}>
          {dados.marcas.length} marca{dados.marcas.length === 1 ? "" : "s"} · analista{dados.analistasColetados.length === 1 ? "" : "s"}{" "}
          {dados.analistasColetados.join(", ") || "todos"}
        </span>
        <div className="ml-auto flex items-center gap-2">
          <select value={dias} onChange={(e) => { const d = Number(e.target.value); setDias(d); carregar(d); }}
            className={"h-8 rounded-lg border px-2 text-xs font-semibold " + (dark ? "bg-neutral-900 border-neutral-800 text-neutral-200" : "bg-white border-neutral-200 text-neutral-700")}>
            <option value={7}>Últimos 7 dias</option>
            <option value={30}>Últimos 30 dias</option>
            <option value={90}>Últimos 90 dias</option>
          </select>
          <button onClick={() => carregar()} className={"h-8 px-3 rounded-lg border text-xs font-semibold flex items-center gap-1.5 " + (dark ? "bg-neutral-900 border-neutral-800 text-neutral-200" : "bg-white border-neutral-200 text-neutral-700")}>
            <IconRefresh className="h-3.5 w-3.5" /> Atualizar
          </button>
        </div>
      </div>

      {/* A tela não pode dar a impressão de ser a caixa de entrada inteira: Direct e Messenger
          dependem de uma liberação do Meta que ainda não saiu, então isso fica dito na cara. */}
      {!dados.canais.instagramDireto && (
        <div className={"rounded-lg border px-3 py-2 flex items-start gap-2 text-xs " + (dark ? "bg-blue-500/5 border-blue-500/20 text-blue-300" : "bg-blue-50 border-blue-200 text-blue-700")}>
          <IconAlertCircle className="h-3.5 w-3.5 shrink-0 mt-0.5" />
          <span>
            Aqui estão os <strong>comentários</strong> dos posts do Instagram.
            Mensagens (Direct e Messenger) ainda não entram: dependem de uma permissão do Meta que exige App Review.
          </span>
        </div>
      )}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <KpiCard IconComp={IconMessage} label="Comentários Recebidos" value={fmtNum(r.recebidos)} dark={dark} accent="#ec4899"
          valorNum={r.recebidos} formatar={(v) => fmtNum(Math.round(v))} />
        <KpiCard IconComp={IconAlertTriangle} label="Sem Resposta" value={fmtNum(r.pendentes)} dark={dark} accent="#ef4444"
          valorNum={r.pendentes} formatar={(v) => fmtNum(Math.round(v))} />
        <KpiCard IconComp={IconCheck} label="Taxa de Resposta" value={(r.taxaResposta || 0).toFixed(1).replace(".", ",") + "%"} dark={dark} accent="#10b981"
          valorNum={r.taxaResposta || 0} formatar={(v) => v.toFixed(1).replace(".", ",") + "%"} />
        <KpiCard IconComp={IconClock} label="Tempo Médio de Resposta" value={esperaTexto(r.tempoMedioRespostaH)} dark={dark} accent="#f59e0b" />
      </div>

      {semNada ? (
        <div className={"rounded-xl border p-6 text-center text-sm " + cardBg + " " + mutedText}>
          Nenhum comentário coletado ainda. Clique em <strong>Atualizar dados</strong> no painel principal — a coleta acontece junto da sincronização.
        </div>
      ) : (
        <>
          <div className={"neon-top rounded-xl border p-4 " + (dark ? "is-dark " : "") + cardBg} style={{ "--neon": "#ec4899" }}>
            <h2 className="text-sm font-bold mb-3">Por Marca</h2>
            <div className="overflow-x-auto">
              <table className="w-full text-xs">
                <thead>
                  <tr className={dark ? "text-neutral-500" : "text-neutral-400"}>
                    <th className="text-left font-medium pb-2">Marca</th>
                    <th className="text-left font-medium pb-2">Analista</th>
                    <th className="text-right font-medium pb-2">Recebidos</th>
                    <th className="text-right font-medium pb-2">Sem resposta</th>
                    <th className="text-right font-medium pb-2">Taxa</th>
                    <th className="text-right font-medium pb-2">Tempo médio</th>
                  </tr>
                </thead>
                <tbody>
                  {dados.marcas.map((m) => (
                    <tr key={m.brandId} onClick={() => setMarcaFiltro(marcaFiltro === m.marca ? "todas" : m.marca)}
                      className={"border-t cursor-pointer " + (dark ? "border-neutral-800 hover:bg-neutral-800/40" : "border-neutral-100 hover:bg-neutral-50") + (marcaFiltro === m.marca ? (dark ? " bg-neutral-800/60" : " bg-neutral-100") : "")}>
                      <td className="py-2 font-semibold">{m.marca}</td>
                      <td className={"py-2 " + mutedText}>{m.analista || "—"}</td>
                      <td className="py-2 text-right tabular-nums">{fmtNum(m.recebidos)}</td>
                      <td className={"py-2 text-right tabular-nums font-bold " + (m.pendentes ? (dark ? "text-red-400" : "text-red-600") : mutedText)}>{fmtNum(m.pendentes)}</td>
                      <td className="py-2 text-right tabular-nums">{m.taxaResposta.toFixed(0)}%</td>
                      <td className={"py-2 text-right tabular-nums " + mutedText}>{esperaTexto(m.tempoMedioRespostaH)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className={"text-[11px] mt-2 " + mutedText}>Clique numa marca pra filtrar a lista abaixo.</p>
          </div>

          <div className={"neon-top rounded-xl border p-4 " + (dark ? "is-dark " : "") + cardBg} style={{ "--neon": "#ec4899" }}>
            <div className="flex flex-wrap items-center gap-2 mb-3">
              <h2 className="text-sm font-bold">Comentários</h2>
              {marcaFiltro !== "todas" && (
                <button onClick={() => setMarcaFiltro("todas")}
                  className={"text-[11px] font-semibold rounded-md px-2 py-0.5 flex items-center gap-1 " + (dark ? "bg-neutral-800 text-neutral-300" : "bg-neutral-100 text-neutral-600")}>
                  {marcaFiltro} <IconX className="h-3 w-3" />
                </button>
              )}
              <label className={"ml-auto flex items-center gap-1.5 text-xs cursor-pointer " + mutedText}>
                <input type="checkbox" checked={soPendentes} onChange={(e) => setSoPendentes(e.target.checked)} />
                Só sem resposta
              </label>
            </div>

            {!comentarios.length ? (
              <p className={"text-sm py-4 text-center " + mutedText}>
                {soPendentes ? "Nenhum comentário sem resposta. Tudo atendido." : "Nada nesse filtro."}
              </p>
            ) : (
              <div className="flex flex-col gap-2">
                {comentarios.slice(0, limite).map((m) => {
                  const atrasada = !m.respondido && m.horasEspera !== null && m.horasEspera >= HORAS_ATRASO;
                  return (
                    <div key={m.id} className={"rounded-lg border p-2.5 " + (dark ? "border-neutral-800 bg-neutral-900/40" : "border-neutral-200 bg-neutral-50/60")}>
                      <div className="flex flex-wrap items-center gap-1.5 text-[11px] mb-1">
                        <span className={"font-semibold rounded px-1.5 py-0.5 " + (dark ? "bg-neutral-800 text-neutral-300" : "bg-neutral-200 text-neutral-700")}>{m.marca}</span>
                        <span className={mutedText}>{m.autor ? "@" + m.autor : "perfil não identificado"}</span>
                        <span className={"ml-auto font-semibold " + (m.respondido ? (dark ? "text-emerald-400" : "text-emerald-600") : atrasada ? (dark ? "text-red-400" : "text-red-600") : mutedText)}>
                          {m.respondido ? "respondido em " + esperaTexto(m.horasEspera) : "esperando há " + esperaTexto(m.horasEspera)}
                        </span>
                      </div>
                      <p className={"text-xs " + (dark ? "text-neutral-200" : "text-neutral-800")}>{m.texto || <em className={mutedText}>(sem texto)</em>}</p>
                      {m.permalink && (
                        <a href={m.permalink} target="_blank" rel="noopener noreferrer"
                          className={"text-[11px] font-semibold mt-1 inline-block " + (dark ? "text-blue-400" : "text-blue-600")}>
                          Abrir no Instagram →
                        </a>
                      )}
                    </div>
                  );
                })}
                {comentarios.length > limite && (
                  <button onClick={() => setLimite((v) => v + 40)}
                    className={"text-xs font-semibold py-2 rounded-lg border " + (dark ? "border-neutral-800 text-neutral-300 hover:bg-neutral-800/50" : "border-neutral-200 text-neutral-600 hover:bg-neutral-50")}>
                    Ver mais ({comentarios.length - limite} restantes)
                  </button>
                )}
              </div>
            )}
          </div>
        </>
      )}

      <footer className={"text-center text-[11px] py-2 " + mutedText}>FEFO · Redes Sociais · v{APP_VERSION}</footer>
    </>
  );
}

function ConcorrenciaDashboard({ token, dark, cardBg, mutedText, pushToast, role }) {
  const [dados, setDados] = useState({ concorrentes: [] });
  const [loading, setLoading] = useState(true);
  const [importOpen, setImportOpen] = useState(false);
  const [texto, setTexto] = useState("");
  const [previa, setPrevia] = useState(null);
  const [selecionadas, setSelecionadas] = useState([]);
  const [ocupado, setOcupado] = useState(false);
  const [expandido, setExpandido] = useState({});

  async function carregar() {
    setLoading(true);
    try {
      setDados(await authJson("/api/concorrentes", token));
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setLoading(false);
    }
  }
  useEffect(() => { carregar(); }, []);

  async function analisar() {
    if (!texto.trim()) { pushToast("Cole o texto da Biblioteca de Anúncios primeiro.", "error"); return; }
    setOcupado(true);
    try {
      const r = await authJson("/admin/concorrentes/analisar", token, { method: "POST", body: JSON.stringify({ texto }) });
      setPrevia(r);
      // já vem marcado quem é concorrente conhecido; anunciante novo entra desmarcado de
      // propósito, porque busca por palavra-chave traz gente que nada tem a ver.
      setSelecionadas(r.paginas.filter((p) => p.jaCadastrado).map((p) => p.pagina));
      if (!r.totalAnuncios) pushToast("Não encontrei anúncios nesse texto. Copiou a página inteira?", "error");
    } catch (e) {
      pushToast(e.message, "error");
    } finally { setOcupado(false); }
  }

  async function importar() {
    if (!selecionadas.length) { pushToast("Escolha ao menos um anunciante.", "error"); return; }
    setOcupado(true);
    try {
      const r = await authJson("/admin/concorrentes/importar", token, {
        method: "POST", body: JSON.stringify({ texto, paginas: selecionadas }),
      });
      const tot = r.resultado.reduce((a, x) => a + x.encontrados, 0);
      const nov = r.resultado.reduce((a, x) => a + x.novos, 0);
      pushToast(`Importado: ${tot} anúncios, ${nov} novo${nov === 1 ? "" : "s"}.`, "success");
      setImportOpen(false); setTexto(""); setPrevia(null); setSelecionadas([]);
      carregar();
    } catch (e) {
      pushToast(e.message, "error");
    } finally { setOcupado(false); }
  }

  const fmtData = (iso) => iso ? iso.split("-").reverse().slice(0, 2).join("/") : "—";
  const oferta = (a) => {
    if (a.precoDe && a.precoPor) return fmtBRL(a.precoDe) + " → " + fmtBRL(a.precoPor);
    // Preço único, sem desconto anunciado (ex.: "Territory por apenas R$ 199.900") — comum em
    // concessionária que não trabalha com "de/por", como a Recol (Ford).
    if (a.precoPor) return fmtBRL(a.precoPor);
    if (a.bonus) return "Bônus " + fmtBRL(a.bonus);
    return "—";
  };

  if (loading) return <div className={"text-sm " + mutedText}>Carregando…</div>;

  const totalAtivos = dados.concorrentes.reduce((a, c) => a + c.ativos, 0);
  const semDados = !dados.concorrentes.length;

  return (
    <div className="flex flex-col gap-4">
      <div className={"neon-top rounded-xl border p-3 flex flex-wrap items-center gap-3 " + (dark ? "is-dark " : "") + cardBg} style={{ "--neon": "#f97316" }}>
        <div className="flex items-center gap-1.5">
          <IconTarget className="h-4 w-4 text-orange-500" />
          <span className="text-sm font-bold">Insights da Concorrência</span>
        </div>
        <span className={"text-xs " + mutedText}>
          {dados.concorrentes.length} concorrente{dados.concorrentes.length === 1 ? "" : "s"} · {totalAtivos} anúncio{totalAtivos === 1 ? "" : "s"} ativo{totalAtivos === 1 ? "" : "s"}
        </span>
        <div className="ml-auto flex items-center gap-2">
          <button onClick={carregar} className={"px-3 py-1.5 rounded-md text-xs font-semibold border " + (dark ? "bg-neutral-800 border-neutral-700 text-neutral-200" : "bg-neutral-100 border-neutral-200 text-neutral-700")}>
            Atualizar
          </button>
          {role === "admin" && (
            <button onClick={() => setImportOpen(true)} className="px-3 py-1.5 rounded-md text-xs font-semibold bg-blue-600 text-white">
              Importar coleta
            </button>
          )}
        </div>
      </div>

      {semDados && (
        <div className={"rounded-xl border p-6 text-center " + cardBg}>
          <p className="text-sm font-semibold mb-1">Nenhuma coleta ainda</p>
          <p className={"text-xs mb-1 " + mutedText}>
            Abra a Biblioteca de Anúncios do Meta, busque o concorrente, selecione a página inteira (Ctrl+A),
            copie (Ctrl+C) e clique em “Importar coleta”.
          </p>
          <p className={"text-xs " + mutedText}>
            O histórico começa do zero: em algumas semanas dá pra ver quais criativos o concorrente mantém no ar.
          </p>
        </div>
      )}

      {dados.concorrentes.map((c) => {
        const modelos = Object.keys(c.grade).sort();
        const aberto = expandido[c.id];
        return (
          <div key={c.id} className={"neon-top rounded-xl border p-4 " + (dark ? "is-dark " : "") + cardBg} style={{ "--neon": "#f97316" }}>
            <div className="flex flex-wrap items-start justify-between gap-2 mb-3">
              <div>
                <h2 className="text-sm font-bold">{c.nome}</h2>
                <p className={"text-xs " + mutedText}>
                  {[c.cidade, c.marcaChave].filter(Boolean).join(" · ") || c.pagina}
                  {c.marcaRival && <span> · concorre com <b>{c.marcaRival}</b></span>}
                </p>
              </div>
              <div className="text-right">
                <p className="text-xl font-bold tabular-nums">{c.ativos}</p>
                <p className={"text-[10px] uppercase tracking-wide " + mutedText}>anúncios ativos</p>
              </div>
            </div>

            <div className="flex flex-wrap gap-2 mb-3">
              <span className={"text-[11px] px-2 py-1 rounded-md " + (dark ? "bg-neutral-800 text-neutral-300" : "bg-neutral-100 text-neutral-600")}>
                Última coleta: <b>{fmtData(c.ultimaColeta)}</b>
              </span>
              {c.novosUltimaColeta > 0 && (
                <span className="text-[11px] px-2 py-1 rounded-md bg-emerald-500/10 text-emerald-600 font-semibold">
                  +{c.novosUltimaColeta} novo{c.novosUltimaColeta === 1 ? "" : "s"}
                </span>
              )}
              {c.encerradosUltimaColeta > 0 && (
                <span className="text-[11px] px-2 py-1 rounded-md bg-red-500/10 text-red-600 font-semibold">
                  −{c.encerradosUltimaColeta} encerrado{c.encerradosUltimaColeta === 1 ? "" : "s"}
                </span>
              )}
            </div>

            {modelos.length > 0 && (
              <div className="overflow-x-auto mb-3">
                <table className="w-full text-sm">
                  <thead>
                    <tr className={"text-left text-[10px] uppercase tracking-wide " + mutedText}>
                      <th className="pb-2 pr-3">Modelo</th>
                      <th className="pb-2">Tipos de campanha</th>
                      <th className="pb-2 text-right">Anúncios</th>
                    </tr>
                  </thead>
                  <tbody className={"divide-y " + (dark ? "divide-neutral-800" : "divide-neutral-100")}>
                    {modelos.map((m) => {
                      const tipos = c.grade[m];
                      const total = Object.values(tipos).reduce((a, b) => a + b, 0);
                      return (
                        <tr key={m}>
                          <td className="py-2 pr-3 font-semibold">{m}</td>
                          <td className="py-2">
                            <div className="flex flex-wrap gap-1">
                              {Object.entries(tipos).sort().map(([t, n]) => (
                                <span key={t} className={"text-[10px] px-1.5 py-0.5 rounded " + corTipo(t, dark)}>
                                  {t}{n > 1 ? " ×" + n : ""}
                                </span>
                              ))}
                            </div>
                          </td>
                          <td className="py-2 text-right tabular-nums font-semibold">{total}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            <button onClick={() => setExpandido((v) => ({ ...v, [c.id]: !v[c.id] }))}
              className={"w-full flex items-center justify-center gap-1.5 py-2 rounded-md text-xs font-semibold border " +
                (dark ? "bg-neutral-800 border-neutral-700 text-neutral-200" : "bg-neutral-100 border-neutral-200 text-neutral-700")}>
              {aberto ? "Ocultar criativos" : "Ver os " + c.ativos + " criativos"}
              <IconChevronDown className={"h-3.5 w-3.5 transition-transform" + (aberto ? " rotate-180" : "")} />
            </button>

            {aberto && (
              <div className="overflow-x-auto mt-3">
                <table className="w-full text-sm min-w-[720px]">
                  <thead>
                    <tr className={"text-left text-[10px] uppercase tracking-wide " + mutedText}>
                      <th className="pb-2">Início</th>
                      <th className="pb-2">Dias no ar</th>
                      <th className="pb-2">Modelo</th>
                      <th className="pb-2">Campanha</th>
                      <th className="pb-2">Oferta</th>
                      <th className="pb-2">Destino</th>
                    </tr>
                  </thead>
                  <tbody className={"divide-y " + (dark ? "divide-neutral-800" : "divide-neutral-100")}>
                    {c.anuncios.map((a) => (
                      <tr key={a.id} title={a.texto}>
                        <td className="py-2 tabular-nums">{fmtData(a.inicio)}</td>
                        <td className="py-2 tabular-nums">
                          {a.diasNoAr !== null ? (
                            <span className={a.diasNoAr >= 30 ? "font-bold text-emerald-600" : ""}>{a.diasNoAr}d</span>
                          ) : "—"}
                        </td>
                        <td className="py-2 font-semibold">{a.modelo || "—"}</td>
                        <td className="py-2">
                          <span className={"text-[10px] px-1.5 py-0.5 rounded " + corTipo(a.tipoCampanha || "Geral", dark)}>
                            {a.tipoCampanha || "Geral"}
                          </span>
                        </td>
                        <td className="py-2 tabular-nums">{oferta(a)}</td>
                        <td className={"py-2 text-[11px] " + mutedText}>{a.cta || a.dominio || "—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {c.encerrados.length > 0 && (
                  <div className="mt-3">
                    <p className={"text-[10px] uppercase tracking-wide mb-1 " + mutedText}>Saíram do ar recentemente</p>
                    <div className="flex flex-wrap gap-1.5">
                      {c.encerrados.map((a) => (
                        <span key={a.id} className={"text-[10px] px-2 py-1 rounded " + (dark ? "bg-neutral-800 text-neutral-400" : "bg-neutral-100 text-neutral-500")}>
                          {(a.modelo || "?") + " · " + (a.tipoCampanha || "Geral") + " · até " + fmtData(a.vistoUltimo)}
                        </span>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}

      {importOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60" onClick={() => !ocupado && setImportOpen(false)}>
          <div onClick={(e) => e.stopPropagation()}
            className={"w-full max-w-2xl rounded-xl border p-5 max-h-[90vh] overflow-y-auto " + (dark ? "bg-neutral-900 border-neutral-800" : "bg-white border-neutral-200")}>
            <h3 className="text-sm font-bold mb-1">Importar coleta da Biblioteca de Anúncios</h3>
            <ol className={"text-xs mb-3 list-decimal pl-4 space-y-0.5 " + mutedText}>
              <li>Abra <b>facebook.com/ads/library</b>, país Brasil, e busque o concorrente pelo nome exato.</li>
              <li>Role a página até o fim para carregar todos os anúncios.</li>
              <li>Selecione tudo (Ctrl+A), copie (Ctrl+C) e cole abaixo.</li>
            </ol>
            <textarea value={texto} onChange={(e) => { setTexto(e.target.value); setPrevia(null); }}
              rows={7} placeholder="Cole aqui o conteúdo da página…"
              className={"w-full rounded-lg border p-2 text-xs font-mono " + (dark ? "bg-neutral-950 border-neutral-700 text-neutral-200" : "bg-white border-neutral-300")} />

            {previa && (
              <div className="mt-3">
                <p className="text-xs font-semibold mb-1">
                  {previa.totalAnuncios} anúncios · escolha de quem importar:
                </p>
                <div className={"rounded-lg border divide-y " + (dark ? "border-neutral-800 divide-neutral-800" : "border-neutral-200 divide-neutral-100")}>
                  {previa.paginas.map((p) => (
                    <label key={p.pagina} className="flex items-center gap-2 px-3 py-2 text-xs cursor-pointer">
                      <input type="checkbox" checked={selecionadas.includes(p.pagina)}
                        onChange={(e) => setSelecionadas((v) => e.target.checked ? [...v, p.pagina] : v.filter((x) => x !== p.pagina))} />
                      <span className="font-semibold flex-1">{p.pagina}</span>
                      {!p.jaCadastrado && <span className="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-600">novo</span>}
                      <span className={"tabular-nums " + mutedText}>{p.anuncios}</span>
                    </label>
                  ))}
                </div>
                <p className={"text-[11px] mt-1.5 " + mutedText}>
                  Anunciantes novos vêm desmarcados: a busca por palavra-chave costuma trazer empresas sem relação com o concorrente.
                </p>
              </div>
            )}

            <div className="flex justify-end gap-2 mt-4">
              <button onClick={() => setImportOpen(false)} disabled={ocupado}
                className={"px-3 py-1.5 rounded-md text-xs font-semibold border " + (dark ? "bg-neutral-800 border-neutral-700 text-neutral-200" : "bg-neutral-100 border-neutral-200 text-neutral-700")}>
                Cancelar
              </button>
              {!previa ? (
                <button onClick={analisar} disabled={ocupado} className="px-3 py-1.5 rounded-md text-xs font-semibold bg-blue-600 text-white disabled:opacity-50">
                  {ocupado ? "Lendo…" : "Analisar"}
                </button>
              ) : (
                <button onClick={importar} disabled={ocupado || !selecionadas.length} className="px-3 py-1.5 rounded-md text-xs font-semibold bg-emerald-600 text-white disabled:opacity-50">
                  {ocupado ? "Importando…" : "Importar " + selecionadas.length + " anunciante" + (selecionadas.length === 1 ? "" : "s")}
                </button>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function FunilVendasDashboard({ token, dark, cardBg, mutedText, pushToast, permissoes }) {
  const [marcaFiltro, setMarcaFiltro] = useState("todas");
  const [periodo, setPeriodo] = useState("mesAtual");
  const [comparativoTipo, setComparativoTipo] = useState("mesAnterior");
  const [customStart, setCustomStart] = useState("");
  const [customEnd, setCustomEnd] = useState("");
  const [dashboardData, setDashboardData] = useState({ brands: [], trafego: [], noticias: [], sacStats: [], meta: {} });
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);
  const [marcasExpanded, setMarcasExpanded] = useState(false);
  const [noticiasExpanded, setNoticiasExpanded] = useState(false);

  async function loadDashboard() {
    setLoading(true);
    try {
      const data = await authJson("/api/dashboard/funil", token);
      setDashboardData(data);
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setLoading(false);
    }
  }
  async function refreshData() {
    setSyncing(true);
    try {
      await authJson("/api/sync", token, { method: "POST" });
      await loadDashboard();
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setSyncing(false);
    }
  }
  useEffect(() => { loadDashboard(); }, []);

  const brandsList = useMemo(() => dashboardData.brands.map((b) => b.nome).sort(), [dashboardData.brands]);
  const brandsToShow = useMemo(() => (marcaFiltro === "todas" ? brandsList : [marcaFiltro]), [marcaFiltro, brandsList]);

  const range = useMemo(() => getPeriodRange(periodo, customStart, customEnd), [periodo, customStart, customEnd]);
  const prevRange = useMemo(
    () => (periodo === "comparativo" ? getComparativoRange(range, comparativoTipo) : getPreviousRange(range)),
    [range, periodo, comparativoTipo]
  );

  const scopedTrafego = useMemo(() => dashboardData.trafego.filter((r) => brandsToShow.includes(r.marca)), [dashboardData.trafego, brandsToShow]);
  const currentRecords = useMemo(() => filterByRange(scopedTrafego, range), [scopedTrafego, range]);
  const previousRecords = useMemo(() => filterByRange(scopedTrafego, prevRange), [scopedTrafego, prevRange]);

  const currentAgg = useMemo(() => aggregateFunil(currentRecords), [currentRecords]);
  const previousAgg = useMemo(() => aggregateFunil(previousRecords), [previousRecords]);

  const linhasPorMarca = useMemo(() => {
    return brandsToShow.map((marca) => {
      const recs = filterByRange(dashboardData.trafego.filter((r) => r.marca === marca), range);
      const agg = aggregateFunil(recs);
      return { marca, ...agg };
    });
  }, [brandsToShow, dashboardData.trafego, range]);
  const MARCAS_PREVIEW_COUNT = 5;
  const linhasPorMarcaToRender = marcasExpanded ? linhasPorMarca : linhasPorMarca.slice(0, MARCAS_PREVIEW_COUNT);
  const hasMoreMarcas = linhasPorMarca.length > MARCAS_PREVIEW_COUNT;

  const sacScoped = useMemo(() => dashboardData.sacStats.filter((r) => brandsToShow.includes(r.marca)), [dashboardData.sacStats, brandsToShow]);
  const sacAtual = useMemo(() => filterByRange(sacScoped, range), [sacScoped, range]);
  const sacStats = useMemo(() => {
    const base = sacAtual.reduce((acc, r) => {
      acc.recebidas += r.recebidas;
      acc.respondidas += r.respondidas;
      acc.somaTempo += r.tempoRespostaMin;
      acc.qtd += 1;
      return acc;
    }, { recebidas: 0, respondidas: 0, somaTempo: 0, qtd: 0 });
    base.taxaResposta = base.recebidas > 0 ? (base.respondidas / base.recebidas) * 100 : 0;
    base.tempoMedioMin = base.qtd > 0 ? base.somaTempo / base.qtd : 0;
    return base;
  }, [sacAtual]);

  const noticiasToShow = useMemo(() => dashboardData.noticias.filter((n) => brandsToShow.includes(n.marca)), [dashboardData.noticias, brandsToShow]);
  const NOTICIAS_PREVIEW_COUNT = 3;
  const noticiasToRender = noticiasExpanded ? noticiasToShow : noticiasToShow.slice(0, NOTICIAS_PREVIEW_COUNT);
  const hasMoreNoticias = noticiasToShow.length > NOTICIAS_PREVIEW_COUNT;

  useEffect(() => { setMarcasExpanded(false); setNoticiasExpanded(false); }, [brandsToShow]);

  const previousLabel = comparativoTipo === "anoAnterior" ? "mesmo mês " + prevRange.start.getFullYear() : "mês anterior";

  return (
    <div className="flex flex-col gap-6">
      {dashboardData.meta.demoMode && (
        <div className={"rounded-lg border px-3 py-2 flex items-center gap-2 text-xs " + (dark ? "bg-amber-500/5 border-amber-500/20 text-amber-400" : "bg-amber-50 border-amber-200 text-amber-700")}>
          <IconRefresh className="h-3.5 w-3.5 shrink-0" />
          Leads são reais (Meta Ads). Propostas e Vendas estão em modo de demonstração — a API do NBS ainda não foi integrada.
        </div>
      )}

      {syncing && (
        <div className={"rounded-lg border px-3 py-2 flex items-center gap-2 text-xs " + (dark ? "bg-blue-500/5 border-blue-500/20 text-blue-400" : "bg-blue-50 border-blue-200 text-blue-700")}>
          <IconRefresh className="h-3.5 w-3.5 shrink-0 animate-spin" />
          Sincronizando dados — pode levar alguns minutos. Não clique de novo nem feche esta aba.
        </div>
      )}

      <div className={"rounded-xl border p-3 flex flex-wrap items-center gap-3 " + cardBg}>
        <div className="flex items-center gap-1.5"><IconCalendar className={"h-4 w-4 " + mutedText} /><span className={"text-xs font-medium " + mutedText}>Período:</span></div>
        <div className="flex flex-wrap gap-1">
          {[{ id: "mesAtual", label: "Mês Atual" }, { id: "mesAnterior", label: "Mês Anterior" }, { id: "comparativo", label: "Comparativo" }, { id: "custom", label: "Customizado" }].map((p) => (
            <button key={p.id} onClick={() => setPeriodo(p.id)} className={"px-3 py-1.5 rounded-md text-xs font-semibold transition-colors " + (periodo === p.id ? "bg-blue-600 text-white" + (dark ? " neon-ativo" : "") : (dark ? "bg-neutral-800 text-neutral-300 hover:bg-neutral-700" : "bg-neutral-100 text-neutral-600 hover:bg-neutral-200"))}>{p.label}</button>
          ))}
        </div>
        <span className={"text-xs " + mutedText}>
          {range.start.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })} – {range.end.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })}
        </span>
        {periodo === "comparativo" && (
          <div className="w-full flex flex-wrap items-center gap-3">
            <span className={"text-xs font-medium " + mutedText}>Comparar com:</span>
            <div className="flex flex-wrap gap-1">
              {[{ id: "mesAnterior", label: "Mês Anterior" }, { id: "anoAnterior", label: "Mesmo Mês Ano Passado" }].map((c) => (
                <button key={c.id} onClick={() => setComparativoTipo(c.id)} className={"px-3 py-1.5 rounded-md text-xs font-semibold transition-colors " + (comparativoTipo === c.id ? "bg-blue-600 text-white" : (dark ? "bg-neutral-800 text-neutral-300 hover:bg-neutral-700" : "bg-neutral-100 text-neutral-600 hover:bg-neutral-200"))}>{c.label}</button>
              ))}
            </div>
            <span className={"text-xs " + mutedText}>
              vs {prevRange.start.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" })} – {prevRange.end.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" })}
            </span>
          </div>
        )}
        {periodo === "custom" && (
          <div className="flex items-center gap-2">
            <input type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)} className={"px-2 py-1.5 rounded-md border text-xs " + (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100" : "bg-white border-neutral-200")} />
            <span className={"text-xs " + mutedText}>até</span>
            <input type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} className={"px-2 py-1.5 rounded-md border text-xs " + (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100" : "bg-white border-neutral-200")} />
          </div>
        )}
        <div className="flex items-center gap-3 ml-auto">
          <div className="flex items-center gap-1.5 text-xs">
            <span className={mutedText}>{fmtAtualizado(dashboardData.meta.lastSync)}</span>
            <button onClick={refreshData} disabled={loading || syncing} aria-label="Atualizar dados"
              className={"h-7 w-7 flex items-center justify-center rounded-md border disabled:opacity-50 " + (dark ? "bg-neutral-800 border-neutral-700" : "bg-neutral-100 border-neutral-200")}>
              <IconRefresh className={"h-3.5 w-3.5 " + mutedText + (loading || syncing ? " animate-spin" : "")} />
            </button>
          </div>
          <div className="flex items-center gap-1.5">
            <IconBuilding className={"h-4 w-4 " + mutedText} />
            <div className="relative">
              <select value={marcaFiltro} onChange={(e) => setMarcaFiltro(e.target.value)} className={"appearance-none pl-3 pr-8 py-1.5 rounded-md border text-xs font-semibold cursor-pointer " + (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100" : "bg-white border-neutral-200 text-neutral-900")}>
                <option value="todas">Todas as Marcas</option>
                {brandsList.map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
              <IconChevronDown className={"h-3.5 w-3.5 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none " + mutedText} />
            </div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <KpiCard IconComp={IconUsers} label="Leads" value={fmtNum(currentAgg.leads)} badgeValue={variacao(currentAgg.leads, previousAgg.leads)} previousValue={periodo === "comparativo" ? fmtNum(previousAgg.leads) : undefined} previousLabel={previousLabel} dark={dark} accent="#3b82f6" />
        <KpiCard IconComp={IconTarget} label="Propostas" value={fmtNum(currentAgg.propostas)} badgeValue={variacao(currentAgg.propostas, previousAgg.propostas)} previousValue={periodo === "comparativo" ? fmtNum(previousAgg.propostas) : undefined} previousLabel={previousLabel} dark={dark} accent="#8b5cf6" />
        <KpiCard IconComp={IconCheck} label="Vendas" value={fmtNum(currentAgg.vendas)} badgeValue={variacao(currentAgg.vendas, previousAgg.vendas)} previousValue={periodo === "comparativo" ? fmtNum(previousAgg.vendas) : undefined} previousLabel={previousLabel} dark={dark} accent="#10b981" />
        <KpiCard IconComp={IconGauge} label="Taxa de Conversão" value={currentAgg.taxaGeral.toFixed(1).replace(".", ",") + "%"} badgeValue={variacao(currentAgg.taxaGeral, previousAgg.taxaGeral)} previousValue={periodo === "comparativo" ? previousAgg.taxaGeral.toFixed(1).replace(".", ",") + "%" : undefined} previousLabel={previousLabel} dark={dark} accent="#f59e0b" />
      </div>

      <div className={"rounded-xl border p-6 " + cardBg}>
        <h2 className="text-sm font-bold mb-1 text-center">Funil de Vendas — Visão Geral</h2>
        <p className={"text-xs mb-5 text-center " + mutedText}>Lead (Meta Ads) → Proposta → Venda, no período selecionado</p>
        <FunnelDiagram agg={currentAgg} dark={dark} />
      </div>

      <div className={"rounded-xl border p-4 overflow-x-auto " + cardBg}>
        <h2 className="text-sm font-bold mb-1">Funil por Marca</h2>
        <p className={"text-xs mb-4 " + mutedText}>Taxas de conversão de cada etapa, por marca, no período selecionado</p>
        <table className="w-full text-sm min-w-[680px]">
          <thead><tr className={"text-left text-xs uppercase tracking-wide " + mutedText}>
            <th className="pb-2">Marca</th>
            <th className="pb-2">Leads</th>
            <th className="pb-2">Propostas</th>
            <th className="pb-2">Vendas</th>
            <th className="pb-2">Lead → Proposta</th>
            <th className="pb-2">Proposta → Venda</th>
            <th className="pb-2">Taxa Geral</th>
          </tr></thead>
          <tbody className={"divide-y " + (dark ? "divide-neutral-800" : "divide-neutral-100")}>
            {linhasPorMarcaToRender.map((row) => (
              <tr key={row.marca}>
                <td className="py-2.5 font-semibold">{row.marca}</td>
                <td className="py-2.5 tabular-nums">{fmtNum(row.leads)}</td>
                <td className="py-2.5 tabular-nums">{fmtNum(row.propostas)}</td>
                <td className="py-2.5 tabular-nums">{fmtNum(row.vendas)}</td>
                <td className="py-2.5 tabular-nums">{row.taxaLeadProposta.toFixed(1).replace(".", ",")}%</td>
                <td className="py-2.5 tabular-nums">{row.taxaPropostaVenda.toFixed(1).replace(".", ",")}%</td>
                <td className="py-2.5 tabular-nums font-semibold">{row.taxaGeral.toFixed(1).replace(".", ",")}%</td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr className={"border-t font-semibold " + (dark ? "border-neutral-800" : "border-neutral-200")}>
              <td className="py-2.5">Total ({linhasPorMarca.length})</td>
              <td className="py-2.5 tabular-nums">{fmtNum(currentAgg.leads)}</td>
              <td className="py-2.5 tabular-nums">{fmtNum(currentAgg.propostas)}</td>
              <td className="py-2.5 tabular-nums">{fmtNum(currentAgg.vendas)}</td>
              <td className="py-2.5 tabular-nums">{currentAgg.taxaLeadProposta.toFixed(1).replace(".", ",")}%</td>
              <td className="py-2.5 tabular-nums">{currentAgg.taxaPropostaVenda.toFixed(1).replace(".", ",")}%</td>
              <td className="py-2.5 tabular-nums">{currentAgg.taxaGeral.toFixed(1).replace(".", ",")}%</td>
            </tr>
          </tfoot>
        </table>
        {hasMoreMarcas && (
          <button onClick={() => setMarcasExpanded((v) => !v)}
            className={"mt-4 w-full flex items-center justify-center gap-1.5 py-2 rounded-md text-xs font-semibold border transition-colors " +
              (dark ? "bg-neutral-800 border-neutral-700 text-neutral-200 hover:bg-neutral-700" : "bg-neutral-100 border-neutral-200 text-neutral-700 hover:bg-neutral-200")}>
            {marcasExpanded ? "Ver menos" : "Ver todas (" + linhasPorMarca.length + ")"}
            <IconChevronDown className={"h-3.5 w-3.5 transition-transform" + (marcasExpanded ? " rotate-180" : "")} />
          </button>
        )}
      </div>

      <div className={"rounded-xl border p-4 " + cardBg}>
        <h2 className="text-sm font-bold mb-1 flex items-center gap-1.5">💬 Estatísticas de Respostas SAC</h2>
        <p className={"text-xs mb-3 " + mutedText}>Mensagens do Instagram e Facebook no período selecionado — dados de demonstração, aguardando permissão do Meta pra mensagens</p>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <KpiCard IconComp={IconUsers} label="Recebidas" value={fmtNum(sacStats.recebidas)} dark={dark} accent="#3b82f6" />
          <KpiCard IconComp={IconCheck} label="Respondidas" value={fmtNum(sacStats.respondidas)} dark={dark} accent="#10b981" />
          <KpiCard IconComp={IconTarget} label="Taxa de Resposta" value={sacStats.taxaResposta.toFixed(1).replace(".", ",") + "%"} dark={dark} accent="#8b5cf6" />
          <KpiCard IconComp={IconGauge} label="Tempo Médio de Resposta" value={fmtNum(sacStats.tempoMedioMin) + " min"} dark={dark} accent="#f59e0b" />
        </div>
      </div>

      {permissoes.verNoticias && noticiasToShow.length > 0 && (
        <div className={"neon-top rounded-xl border p-4 " + (dark ? "is-dark " : "") + (marcaFiltro !== "todas" ? "overflow-hidden " : "") + cardBg} style={{ "--neon": "#f59e0b" }}>
          <h2 className="text-sm font-bold mb-1 flex items-center gap-1.5"><IconSparkle className="h-4 w-4 text-amber-500" /> Notícias do Setor</h2>
          <p className={"text-xs mb-3 " + mutedText}>Manchetes recentes de portais automotivos (Quatro Rodas, Motor1, AutoPapo) que citam as marcas do grupo — atualiza sozinho às 08h e 15h, ou ao clicar em "Atualizar"</p>
          {marcaFiltro !== "todas" ? (
            <NewsCarousel itens={(noticiasToShow[0] || {}).itens || []} dark={dark} mutedText={mutedText} />
          ) : (
            <>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {noticiasToRender.map((item) => (
                  <NewsBrandGroup key={item.brandId} item={item} dark={dark} mutedText={mutedText} />
                ))}
              </div>
              {hasMoreNoticias && (
                <button onClick={() => setNoticiasExpanded((v) => !v)}
                  className={"mt-4 w-full flex items-center justify-center gap-1.5 py-2 rounded-md text-xs font-semibold border transition-colors " +
                    (dark ? "bg-neutral-800 border-neutral-700 text-neutral-200 hover:bg-neutral-700" : "bg-neutral-100 border-neutral-200 text-neutral-700 hover:bg-neutral-200")}>
                  {noticiasExpanded ? "Ver menos" : "Ver todas (" + noticiasToShow.length + ")"}
                  <IconChevronDown className={"h-3.5 w-3.5 transition-transform" + (noticiasExpanded ? " rotate-180" : "")} />
                </button>
              )}
            </>
          )}
        </div>
      )}

      <footer className={"text-center text-[11px] py-2 " + mutedText}>FEFO · Informações Gerais · v{APP_VERSION}</footer>
    </div>
  );
}

function normalizeTexto(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w\s]/g, " ");
}
function buscarRespostaFaq(pergunta) {
  // Cada gatilho "casa" se todas as suas palavras aparecem em algum lugar da pergunta,
  // não precisa ser a frase exata na mesma ordem (ex: "usuário novo" também bate com "novo usuário").
  const texto = normalizeTexto(pergunta);
  let melhor = null;
  let melhorPontos = 0;
  for (const item of FAQ_BASE) {
    for (const gatilho of item.gatilhos) {
      const palavras = normalizeTexto(gatilho).split(/\s+/).filter(Boolean);
      const matches = palavras.filter((p) => texto.includes(p)).length;
      if (matches === palavras.length && matches > melhorPontos) {
        melhor = item;
        melhorPontos = matches;
      }
    }
  }
  return melhor ? melhor.resposta : null;
}

// Ordem em que os quadros aparecem quando ninguém nunca arrastou nada, e também o que volta
// se o valor salvo no localStorage estiver corrompido ou de uma versão antiga com menos ids.
const BLOCOS_PADRAO = ["topCriativos", "organico", "noticias", "evolucao", "ranking", "mapaMeta", "saldo"];

// A pega do arraste só fica "draggable" enquanto o botão de grip está pressionado — do
// contrário, um clique em qualquer parte do quadro (um botão "Ver mais", uma célula da
// tabela de saldo) dispararia um arraste nativo do navegador sem a pessoa querer.
function DraggableBlock({ id, className, style, dark, isDragging, isOver, onDragStartId, onDragOverId, onDropId, onDragEndReset, children }) {
  const [podeArrastar, setPodeArrastar] = useState(false);
  return (
    <div
      draggable={podeArrastar}
      onDragStart={(e) => { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", id); onDragStartId(id); }}
      onDragEnd={() => { setPodeArrastar(false); onDragEndReset(); }}
      onDragOver={(e) => { e.preventDefault(); onDragOverId(id); }}
      onDragLeave={() => onDragOverId(null)}
      onDrop={(e) => { e.preventDefault(); onDropId(e.dataTransfer.getData("text/plain"), id); onDragEndReset(); }}
      className={"relative " + className + (isDragging ? " opacity-40" : "") + (isOver ? (dark ? " ring-2 ring-blue-500" : " ring-2 ring-blue-400") : "")}
      // Enquanto o botão de grip está pressionado, o navegador pode não reconhecer a tempo
      // que é um arraste (ex.: mouse parado meio segundo antes de mover) — sem isto, esse
      // instante vira seleção de texto acidental na tela inteira em vez de arrastar o quadro.
      style={{ ...style, userSelect: podeArrastar ? "none" : undefined }}
    >
      <button
        type="button"
        onMouseDown={() => setPodeArrastar(true)}
        onMouseUp={() => setPodeArrastar(false)}
        onDragStart={(e) => e.stopPropagation()}
        title="Arraste para reordenar os quadros"
        aria-label="Arraste para reordenar este quadro"
        className={"absolute top-3 right-3 h-6 w-6 flex items-center justify-center rounded cursor-grab active:cursor-grabbing z-10 select-none " +
          (dark ? "text-neutral-600 hover:text-neutral-300 hover:bg-neutral-800" : "text-neutral-300 hover:text-neutral-500 hover:bg-neutral-100")}
      >
        <IconGripVertical className="h-4 w-4" />
      </button>
      {children}
    </div>
  );
}

function tempoRelativo(iso) {
  const min = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return `há ${min}min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `há ${h}h`;
  return `há ${Math.floor(h / 24)}d`;
}

const NOTIFICACOES_INTERVALO_MS = 3 * 60 * 1000;

function NotificationBell({ token, dark }) {
  const [itens, setItens] = useState([]);
  const [naoLidas, setNaoLidas] = useState(0);
  const [aberto, setAberto] = useState(false);

  async function buscar() {
    try {
      const data = await authJson("/api/notificacoes", token);
      setItens(data.itens);
      setNaoLidas(data.naoLidas);
    } catch {} // o sino não deve derrubar o painel se essa chamada falhar
  }

  useEffect(() => {
    buscar();
    const id = setInterval(buscar, NOTIFICACOES_INTERVALO_MS);
    return () => clearInterval(id);
  }, []);

  function alternar() {
    setAberto((v) => {
      const abrindo = !v;
      if (abrindo && naoLidas > 0) {
        setNaoLidas(0);
        authJson("/api/notificacoes/marcar-lidas", token, { method: "POST" }).catch(() => {});
      }
      return abrindo;

  return (
    <div className="relative">

        className={"relative h-9 w-9 flex items-center justify-center rounded-lg border " + (dark ? "bg-neutral-900 border-neutral-800" : "bg-white border-neutral-200")}

          <div className="fixed inset-0 z-10" onClick={() => setAberto(false)} />

              <div className={"px-3 py-6 text-xs text-center " + (dark ? "text-neutral-500" : "text-neutral-400")}>Nenhuma notificação por aqui ainda.</div>

  const [estrelasCadentes, setEstrelasCadentes] = useState(false);

  const [view, setView] = useState("dashboard"); // "dashboard" (Meta) | "google" | "funil" | "redes" | "concorrencia" | "config"
  const [dashboardMenuOpen, setDashboardMenuOpen] = useState(false);

  const [customStart, setCustomStart] = useState("");
  const [customEnd, setCustomEnd] = useState("");
  const [sortConfig, setSortConfig] = useState({ key: "status", dir: "asc" });

  // Ordem dos quadros do painel principal — cada pessoa que usa o FEFO neste navegador pode
  // arrastar os quadros pra montar o painel do jeito que faz mais sentido pra ela.
  const [blocoOrdem, setBlocoOrdem] = useState(() => {
    try {
      const salvo = JSON.parse(localStorage.getItem("raviera_ordem_blocos") || "null");
      if (Array.isArray(salvo) && BLOCOS_PADRAO.every((id) => salvo.includes(id)) && salvo.every((id) => BLOCOS_PADRAO.includes(id))) {
        return salvo;
      }
    } catch {}
    return BLOCOS_PADRAO;
  });
  useEffect(() => { localStorage.setItem("raviera_ordem_blocos", JSON.stringify(blocoOrdem)); }, [blocoOrdem]);
  // A ordem salva no navegador (acima) é só pra não "piscar" a ordem padrão no primeiro
  // instante — quem manda de verdade é a conta, guardada no servidor. Busca uma vez ao abrir
  // o painel; assim, ao logar num computador novo (ou depois de limpar o navegador), a pessoa
  // já vê do jeito que arrastou da última vez, sem precisar refazer.
  useEffect(() => {
    let cancelado = false;
    authJson("/auth/me", token).then((me) => {
      if (cancelado || !Array.isArray(me.ordemBlocos)) return;
      const valido = BLOCOS_PADRAO.every((id) => me.ordemBlocos.includes(id)) && me.ordemBlocos.every((id) => BLOCOS_PADRAO.includes(id));
      if (valido) setBlocoOrdem(me.ordemBlocos);
    }).catch(() => {}); // sem conexão ou token expirado: fica com o que já tinha localmente
    return () => { cancelado = true; };
  }, []);
  const [blocoArrastando, setBlocoArrastando] = useState(null);
  const [blocoSobre, setBlocoSobre] = useState(null);
  function moverBloco(origemId, destinoId) {
    if (!origemId || origemId === destinoId) return;
    const semOrigem = blocoOrdem.filter((id) => id !== origemId);
    const idx = semOrigem.indexOf(destinoId);
    if (idx === -1) return;
    const nova = [...semOrigem];
    nova.splice(idx, 0, origemId);
    setBlocoOrdem(nova);
    // Salva na conta pra valer em qualquer computador — se falhar (sem internet, etc.), a
    // pessoa já vê o quadro no lugar certo agora e tenta salvar de novo no próximo arraste.
    authJson("/auth/me/ordem-blocos", token, { method: "PUT", body: JSON.stringify({ ordem: nova }) }).catch(() => {});
  }

  const [dashboardData, setDashboardData] = useState({ brands: [], trafego: [], saldos: [], criativosDiarios: [], organico: [], noticias: [], mapaCalorMeta: [], meta: {} });
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [selectedCreative, setSelectedCreative] = useState(null);

  function pushToast(message, type) {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { id, message, type: type || "error" }]);
    setTimeout(() => setToasts((prev) => prev.map((t) => (t.id === id ? { ...t, leaving: true } : t))), 3700);
    setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 4000);
  }

  useEffect(() => { localStorage.setItem("raviera_theme", dark ? "dark" : "light"); }, [dark]);

  async function loadDashboard() {
    setLoading(true);
    try {
      const data = await authJson("/api/dashboard", token);
      setDashboardData(data);
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setLoading(false);
    }
  }
  async function refreshData() {
    setSyncing(true);
    try {
      const result = await authJson("/api/sync", token, { method: "POST" });
      await loadDashboard();
      pushToast(`Dados atualizados — ${result.contas_sincronizadas} contas do Meta sincronizadas`, "success");
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setSyncing(false);
    }
  }
  useEffect(() => { loadDashboard(); }, []);

  const brandsList = useMemo(
    () => dashboardData.brands.map((b) => b.nome).sort(),
    [dashboardData.brands]
  );
  const brandsToShow = useMemo(() => (marcaFiltro === "todas" ? brandsList : [marcaFiltro]), [marcaFiltro, brandsList]);

  const range = useMemo(() => getPeriodRange(periodo, customStart, customEnd), [periodo, customStart, customEnd]);
  const prevRange = useMemo(
    () => (periodo === "comparativo" ? getComparativoRange(range, comparativoTipo) : getPreviousRange(range)),
    [range, periodo, comparativoTipo]
  );

  const scopedTrafego = useMemo(() => dashboardData.trafego.filter((r) => brandsToShow.includes(r.marca)), [dashboardData.trafego, brandsToShow]);
  const currentRecords = useMemo(() => filterByRange(scopedTrafego, range), [scopedTrafego, range]);
  const previousRecords = useMemo(() => filterByRange(scopedTrafego, prevRange), [scopedTrafego, prevRange]);
  const currentAgg = useMemo(() => aggregateTrafego(currentRecords), [currentRecords]);
  const previousAgg = useMemo(() => aggregateTrafego(previousRecords), [previousRecords]);

  const evolucaoDiaria = useMemo(() => {
    const byDate = {};
    currentRecords.forEach((r) => {
      if (!byDate[r.data]) byDate[r.data] = { data: r.data, gasto: 0, quantidade: 0 };
      byDate[r.data].gasto += r.gasto; byDate[r.data].quantidade += r.quantidade;
    });
    return Object.values(byDate).sort((a, b) => a.data.localeCompare(b.data)).map((d) => ({ ...d, dataLabel: fmtDateOnly(d.data) }));
  }, [currentRecords]);

  // Séries diárias dos sparklines dos KPIs — saem da mesma evolucaoDiaria já usada no gráfico
  // maior, então acompanham o período selecionado sem nenhuma chamada extra ao backend.
  const seriesKpi = useMemo(() => ({
    gasto: evolucaoDiaria.map((d) => d.gasto),
    quantidade: evolucaoDiaria.map((d) => d.quantidade),
    // dia sem lead não tem CPL definido (seria divisão por zero) — vira null e o sparkline ignora.
    cpl: evolucaoDiaria.map((d) => (d.quantidade > 0 ? d.gasto / d.quantidade : null)),
  }), [evolucaoDiaria]);

  const rankingMarcas = useMemo(() => {
    return brandsList.map((marca) => {
      const recs = filterByRange(dashboardData.trafego.filter((r) => r.marca === marca), range);
      const agg = aggregateTrafego(recs);
      return { marca, gasto: agg.gasto, quantidade: agg.quantidade };
    }).filter((r) => brandsToShow.includes(r.marca)).sort((a, b) => b.quantidade - a.quantidade);
  }, [brandsList, brandsToShow, range, dashboardData.trafego]);

  const linhasSaldo = useMemo(() => {
    return brandsToShow.map((marca) => {
      const brand = dashboardData.brands.find((b) => b.nome === marca) || {};
      const brandId = brand.id;
      const saldo = dashboardData.saldos.find((s) => s.marca === marca) || {};
      const trafRecs = filterByRange(dashboardData.trafego.filter((r) => r.marca === marca), range);
      const agg = aggregateTrafego(trafRecs);
      const saldoAtual = saldo.saldoAtualMeta || 0;
      // Planejado: número digitado à mão na aba Marcas. Real: soma do daily_budget das
      // campanhas ativas dessa marca, lido do Meta a cada sincronização — os dois podem
      // divergir quando alguém reajusta orçamento direto na campanha e esquece de atualizar
      // aqui (ou vice-versa). O runway usa o planejado, que é o ritmo que a pessoa decidiu.
      const diarioEsperado = saldo.diarioEsperadoMeta || 0;
      const orcamentoReal = saldo.orcamentoDiarioReal;
      // Mais de 10% de diferença entre o que foi planejado e o que está configurado agora no
      // Meta é o suficiente pra valer a pena conferir — reajuste feito direto na campanha e
      // esquecido de replicar aqui, ou o contrário.
      const orcamentoDivergente = diarioEsperado > 0 && orcamentoReal != null && Math.abs(orcamentoReal - diarioEsperado) > diarioEsperado * 0.1;
      // Fôlego por CONTA (o saldo é da conta: BMW Auto + Motorrad + MINI gastam do mesmo), sobre o
      // gasto real recente — calculado no backend com todas as marcas da conta (app/runway.py).
      const diasRestantes = saldo.runwayDias ?? null;
      return {
        marca, brandId, analista: brand.analista || "", gasto: agg.gasto, quantidade: agg.quantidade, cpl: agg.cpl, saldoAtual, diarioEsperado,
        orcamentoReal, orcamentoDivergente, diasRestantes, status: statusRunway(diasRestantes),
        gastoMedioRecente: saldo.gastoMedioRecente, orcamentoSubutilizado: saldo.orcamentoSubutilizado,
        notaFiscalUrl: saldo.notaFiscalUrl || null,
        contaId: saldo.contaId ?? null, marcasNaConta: saldo.marcasNaConta || [], totalMarcasNaConta: saldo.totalMarcasNaConta || 1,
        ritmoDiario: saldo.ritmoDiario ?? null, ritmoFonte: saldo.ritmoFonte || null,
        faltaAteFimDoMes: saldo.faltaAteFimDoMes || 0,
      };
    });
  }, [brandsToShow, dashboardData.saldos, dashboardData.trafego, range]);

  // Conta, não marca: uma conta compartilhada por três marcas zerada é UM problema, não três.
  const chaveConta = (l) => (l.contaId != null ? "c" + l.contaId : "m" + l.marca);
  const contasEmRisco = useMemo(
    () => new Set(linhasSaldo.filter((l) => l.status === "critico" || l.status === "atencao").map(chaveConta)).size,
    [linhasSaldo]
  );

  const STATUS_ORDER = { critico: 0, atencao: 1, semDados: 2, ok: 3 };
  const linhasSaldoOrdenadas = useMemo(() => {
    const arr = [...linhasSaldo];
    const { key, dir } = sortConfig;
    const mult = dir === "asc" ? 1 : -1;
    arr.sort((a, b) => {
      let av, bv;
      if (key === "status") { av = STATUS_ORDER[a.status]; bv = STATUS_ORDER[b.status]; }
      else if (key === "diasRestantes") { av = a.diasRestantes === null ? Infinity : a.diasRestantes; bv = b.diasRestantes === null ? Infinity : b.diasRestantes; }
      else if (key === "orcamentoReal") { av = a.orcamentoReal ?? Infinity; bv = b.orcamentoReal ?? Infinity; }
      else { av = a[key]; bv = b[key]; }
      if (typeof av === "string") return av.localeCompare(bv) * mult;
      return (av - bv) * mult;
    });
    return arr;
  }, [linhasSaldo, sortConfig]);

  const totalsSaldo = useMemo(() => {
    const contasSomadas = new Set();
    const t = linhasSaldo.reduce((acc, r) => {
      acc.gasto += r.gasto; acc.quantidade += r.quantidade; acc.diarioEsperado += r.diarioEsperado;
      // Saldo é da conta: marcas que dividem a mesma repetiam o mesmo valor e o total saía inflado.
      if (!contasSomadas.has(chaveConta(r))) { contasSomadas.add(chaveConta(r)); acc.saldoAtual += r.saldoAtual; }
      if (r.orcamentoReal != null) acc.orcamentoReal += r.orcamentoReal;
      return acc;
    }, { gasto: 0, quantidade: 0, saldoAtual: 0, diarioEsperado: 0, orcamentoReal: 0 });
    t.cpl = t.quantidade > 0 ? t.gasto / t.quantidade : 0;
    return t;
  }, [linhasSaldo]);

  // Recalcula o top 3 de criativos a partir do histórico diário por anúncio, filtrado pelo
  // MESMO período selecionado no topo da tela (Mês Atual, Mês Anterior, período customizado
  // etc.) — igual já fazemos com leads/gasto. Não existe mais um "top 3" fixo do backend.
  const topCreativesToShow = useMemo(() => {
    const filtrados = filterByRange(
      dashboardData.criativosDiarios.filter((c) => brandsToShow.includes(c.marca)),
      range
    );
    const porMarca = {};
    filtrados.forEach((c) => {
      const porAnuncio = (porMarca[c.marca] ||= {});
      const acc = (porAnuncio[c.adId] ||= {
        brandId: c.brandId, nomeAnuncio: c.nomeAnuncio, thumbnailUrl: c.thumbnailUrl, gasto: 0, leads: 0, ultimaData: c.data,
      });
      acc.gasto += c.gasto;
      acc.leads += c.leads;
      if (c.data > acc.ultimaData) acc.ultimaData = c.data;
    });
    return Object.entries(porMarca)
      .map(([marca, anuncios]) => {
        const lista = Object.values(anuncios)
          .sort((a, b) => b.leads - a.leads)
          .slice(0, 3)
          .map((a, i) => ({
            rank: i + 1,
            nomeAnuncio: a.nomeAnuncio,
            thumbnailUrl: a.thumbnailUrl,
            gasto: a.gasto,
            leads: a.leads,
            custoPorLead: a.leads ? a.gasto / a.leads : 0,
            atualizadoEm: a.ultimaData,
          }));
        return { brandId: Object.values(anuncios)[0]?.brandId, marca, criativos: lista };
      })
      .filter((item) => item.criativos.length > 0);
  }, [dashboardData.criativosDiarios, brandsToShow, range]);
  const organicoToShow = useMemo(
    () => dashboardData.organico.filter((o) => o.marcas.some((m) => brandsToShow.includes(m))),
    [dashboardData.organico, brandsToShow]
  );
  const noticiasToShow = useMemo(
    () => dashboardData.noticias.filter((n) => brandsToShow.includes(n.marca)),
    [dashboardData.noticias, brandsToShow]
  );
  const mapaCalorMetaToShow = useMemo(
    () => dashboardData.mapaCalorMeta.filter((m) => brandsToShow.includes(m.marca)),
    [dashboardData.mapaCalorMeta, brandsToShow]
  );
  const [cidadesModalInfo, setCidadesModalInfo] = useState(null);
  const [diagnosticoInfo, setDiagnosticoInfo] = useState(null);
  const [creativesExpanded, setCreativesExpanded] = useState(false);
  const [noticiasExpanded, setNoticiasExpanded] = useState(false);
  const [organicoExpanded, setOrganicoExpanded] = useState(false);
  const [mapaExpanded, setMapaExpanded] = useState(false);
  useEffect(() => { setCreativesExpanded(false); setNoticiasExpanded(false); setOrganicoExpanded(false); setMapaExpanded(false); }, [brandsToShow]);
  const CREATIVES_PREVIEW_COUNT = 3;
  const creativesToRender = creativesExpanded ? topCreativesToShow : topCreativesToShow.slice(0, CREATIVES_PREVIEW_COUNT);
  const hasMoreCreatives = topCreativesToShow.length > CREATIVES_PREVIEW_COUNT;
  // 6 = duas linhas cheias da grade de 3 colunas (são mais de 20 contas quando não há filtro
  // de marca, então mostrar só 3 cortaria demais).
  const ORGANICO_PREVIEW_COUNT = 6;
  const organicoToRender = organicoExpanded ? organicoToShow : organicoToShow.slice(0, ORGANICO_PREVIEW_COUNT);
  const hasMoreOrganico = organicoToShow.length > ORGANICO_PREVIEW_COUNT;
  const NOTICIAS_PREVIEW_COUNT = 3;
  const noticiasToRender = noticiasExpanded ? noticiasToShow : noticiasToShow.slice(0, NOTICIAS_PREVIEW_COUNT);
  const hasMoreNoticias = noticiasToShow.length > NOTICIAS_PREVIEW_COUNT;
  const MAPA_PREVIEW_COUNT = 4;
  const mapaToRender = mapaExpanded ? mapaCalorMetaToShow : mapaCalorMetaToShow.slice(0, MAPA_PREVIEW_COUNT);
  const hasMoreMapa = mapaCalorMetaToShow.length > MAPA_PREVIEW_COUNT;

  function handleSort(key) {
    setSortConfig((prev) => (prev.key === key ? { key, dir: prev.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" }));
  }
  function runwayTooltip(row) {
    const base = row.ritmoFonte === "real" ? "gasto real recente" : "orçamento planejado (sem gasto recente)";
    let t = "Saldo da conta ÷ " + base + " de " + fmtBRL(row.ritmoDiario) + "/dia";
    if (row.totalMarcasNaConta > 1) {
      t += " — conta compartilhada por " + row.totalMarcasNaConta + " marcas" + (row.marcasNaConta.length ? " (com " + row.marcasNaConta.join(", ") + ")" : "");
    }
    if (row.faltaAteFimDoMes > 0) {
      const hoje = new Date();
      const ultimo = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
      t += ". Faltam " + fmtBRL(row.faltaAteFimDoMes) + " pra cobrir até o dia " + ultimo;
    }
    return t;
  }

  const bg = dark ? "bg-neutral-950" : "bg-neutral-50";
  const text = dark ? "text-neutral-100" : "text-neutral-900";
  const cardBg = dark ? "bg-neutral-900/70 border-neutral-800" : "bg-white border-neutral-200 shadow-sm";
  const mutedText = dark ? "text-neutral-400" : "text-neutral-500";
  const previousLabel = comparativoTipo === "anoAnterior" ? "mesmo mês " + prevRange.start.getFullYear() : "mês anterior";

  return (
    <div className={"min-h-screen w-full " + bg + " " + text + " font-sans transition-colors"}>
      <ToastStack toasts={toasts} dark={dark} />
      <CreativeDetailModal creative={selectedCreative} onClose={() => setSelectedCreative(null)} dark={dark} />
      <CidadesConfiguradasModal info={cidadesModalInfo} onClose={() => setCidadesModalInfo(null)} dark={dark} token={token} />
      <CampanhaDiagnosticoModal info={diagnosticoInfo} onClose={() => setDiagnosticoInfo(null)} dark={dark} token={token} />
      <WelcomeOverlay show={showWelcome} nome={nome} dark={dark} />
      <ModoTurboOverlay show={modoTurbo} dark={dark} onDone={() => setModoTurbo(false)} />
      <EstrelasCadentesOverlay show={estrelasCadentes} onDone={() => setEstrelasCadentes(false)} />
      <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex flex-col gap-6">
        <header className="flex flex-wrap items-center justify-between gap-4">
          <div className="flex items-center gap-3 cursor-pointer" title="Voltar para a tela principal"
            onClick={() => { setView("dashboard"); setMarcaFiltro("todas"); }}>
            <img src={dark ? "/static/assets/logo-escuro.png" : "/static/assets/logo-claro.png"} alt="Grupo Raviera"
              className="h-10 w-auto object-contain" />
            <div>
              <h1 className="text-lg font-bold tracking-tight leading-none">FEFO</h1>
              <p className={"text-xs " + mutedText}>Fast Executive Follow-up & Overview</p>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap relative">
            <div className="relative">
              <button onClick={() => setDashboardMenuOpen((v) => !v)}
                className={"flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold " +
                  (view !== "config" ? "bg-blue-600 text-white border-blue-600" : (dark ? "bg-neutral-900 border-neutral-800 text-neutral-200" : "bg-white border-neutral-200 text-neutral-700"))}>
                {view === "google" ? "Google Ads" : view === "funil" ? "Informações Gerais" : view === "redes" ? "Redes Sociais" : view === "concorrencia" ? "Insights da Concorrência" : "Meta Ads"}
                <IconChevronDown className={"h-3.5 w-3.5 transition-transform" + (dashboardMenuOpen ? " rotate-180" : "")} />
              </button>
              {dashboardMenuOpen && (
                <>
                  <div className="fixed inset-0 z-10" onClick={() => setDashboardMenuOpen(false)} />
                  <div className={"absolute left-0 top-11 z-20 w-44 rounded-lg border shadow-xl overflow-hidden " + (dark ? "bg-neutral-900 border-neutral-800" : "bg-white border-neutral-200")}>
                    <button onClick={() => { setView("dashboard"); setDashboardMenuOpen(false); }}
                      className={"w-full text-left px-3 py-2 text-xs font-semibold " + (view === "dashboard" ? "bg-blue-600 text-white" : (dark ? "text-neutral-200 hover:bg-neutral-800" : "text-neutral-700 hover:bg-neutral-100"))}>
                      Meta Ads
                    </button>
                    <button onClick={() => { setView("google"); setDashboardMenuOpen(false); }}
                      className={"w-full text-left px-3 py-2 text-xs font-semibold " + (view === "google" ? "bg-blue-600 text-white" : (dark ? "text-neutral-200 hover:bg-neutral-800" : "text-neutral-700 hover:bg-neutral-100"))}>
                      Google Ads
                    </button>
                    {permissoes.verFunil && (
                      <button onClick={() => { setView("funil"); setDashboardMenuOpen(false); }}
                        className={"w-full text-left px-3 py-2 text-xs font-semibold " + (view === "funil" ? "bg-blue-600 text-white" : (dark ? "text-neutral-200 hover:bg-neutral-800" : "text-neutral-700 hover:bg-neutral-100"))}>
                        Informações Gerais
                      </button>
                    )}
                    <button onClick={() => { setView("redes"); setDashboardMenuOpen(false); }}
                      className={"w-full text-left px-3 py-2 text-xs font-semibold " + (view === "redes" ? "bg-blue-600 text-white" : (dark ? "text-neutral-200 hover:bg-neutral-800" : "text-neutral-700 hover:bg-neutral-100"))}>
                      Redes Sociais
                    </button>
                    <button onClick={() => { setView("concorrencia"); setDashboardMenuOpen(false); }}
                      className={"w-full text-left px-3 py-2 text-xs font-semibold " + (view === "concorrencia" ? "bg-blue-600 text-white" : (dark ? "text-neutral-200 hover:bg-neutral-800" : "text-neutral-700 hover:bg-neutral-100"))}>
                      Insights da Concorrência
                    </button>
                  </div>
                </>
              )}
            </div>
            <NotificationBell token={token} dark={dark} />
            <button onClick={() => setSettingsOpen((v) => !v)} className={"h-9 w-9 flex items-center justify-center rounded-lg border " + (dark ? "bg-neutral-900 border-neutral-800" : "bg-white border-neutral-200")} aria-label="Configurações">
              <IconSettings className="h-4 w-4" />
            </button>
            <button onClick={onLogout} className={"h-9 w-9 flex items-center justify-center rounded-lg border " + (dark ? "bg-neutral-900 border-neutral-800" : "bg-white border-neutral-200")} aria-label="Sair" title={email}>
              <IconLogOut className="h-4 w-4" />
            </button>
            <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} dark={dark} setDark={setDark} role={role} view={view} setView={setView} />
          </div>
        </header>

        {view === "config" ? (
          <AdminPanel token={token} dark={dark} cardBg={cardBg} mutedText={mutedText} pushToast={pushToast} />
        ) : view === "google" ? (
          <GoogleAdsDashboard token={token} dark={dark} cardBg={cardBg} mutedText={mutedText} pushToast={pushToast} permissoes={permissoes} />
        ) : view === "funil" && permissoes.verFunil ? (
          <FunilVendasDashboard token={token} dark={dark} cardBg={cardBg} mutedText={mutedText} pushToast={pushToast} permissoes={permissoes} />
        ) : view === "redes" ? (
          <RedesSociaisDashboard token={token} dark={dark} cardBg={cardBg} mutedText={mutedText} pushToast={pushToast} />
        ) : view === "concorrencia" ? (
          <ConcorrenciaDashboard token={token} dark={dark} cardBg={cardBg} mutedText={mutedText} pushToast={pushToast} role={role} />
        ) : (
          <>
            <div className={"rounded-xl border p-3 flex items-center gap-2.5 " + cardBg}>
              <h2 className="text-sm font-bold">{marcaFiltro === "todas" ? "Visão Geral" : marcaFiltro}</h2>
            </div>

            {dashboardData.meta.demoMode && (
              <div className={"rounded-lg border px-3 py-2 flex items-center gap-2 text-xs " + (dark ? "bg-amber-500/5 border-amber-500/20 text-amber-400" : "bg-amber-50 border-amber-200 text-amber-700")}>
                <IconRefresh className="h-3.5 w-3.5 shrink-0" />
                Exibindo dados de demonstração (token do Meta não configurado no servidor).
              </div>
            )}

            <AlertaTokens tokens={dashboardData.meta.tokens} dark={dark} />

            {syncing && (
              <div className={"rounded-lg border px-3 py-2 flex items-center gap-2 text-xs " + (dark ? "bg-blue-500/5 border-blue-500/20 text-blue-400" : "bg-blue-50 border-blue-200 text-blue-700")}>
                <IconRefresh className="h-3.5 w-3.5 shrink-0 animate-spin" />
                Sincronizando com o Meta (saldo, gastos e criativos de todas as contas) — pode levar alguns minutos. Não clique de novo nem feche esta aba.
              </div>
            )}

            <div className={"rounded-xl border p-3 flex flex-wrap items-center gap-3 " + cardBg}>
              <div className="flex items-center gap-1.5"><IconCalendar className={"h-4 w-4 " + mutedText} /><span className={"text-xs font-medium " + mutedText}>Período:</span></div>
              <div className="flex flex-wrap gap-1">
                {[{ id: "mesAtual", label: "Mês Atual" }, { id: "mesAnterior", label: "Mês Anterior" }, { id: "comparativo", label: "Comparativo" }, { id: "custom", label: "Customizado" }].map((p) => (
                  <button key={p.id} onClick={() => setPeriodo(p.id)} className={"px-3 py-1.5 rounded-md text-xs font-semibold transition-colors " + (periodo === p.id ? "bg-blue-600 text-white" + (dark ? " neon-ativo" : "") : (dark ? "bg-neutral-800 text-neutral-300 hover:bg-neutral-700" : "bg-neutral-100 text-neutral-600 hover:bg-neutral-200"))}>{p.label}</button>
                ))}
              </div>
              <span className={"text-xs " + mutedText}>
                {range.start.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })} – {range.end.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })}
              </span>
              {periodo === "comparativo" && (
                <div className="w-full flex flex-wrap items-center gap-3">
                  <span className={"text-xs font-medium " + mutedText}>Comparar com:</span>
                  <div className="flex flex-wrap gap-1">
                    {[{ id: "mesAnterior", label: "Mês Anterior" }, { id: "anoAnterior", label: "Mesmo Mês Ano Passado" }].map((c) => (
                      <button key={c.id} onClick={() => setComparativoTipo(c.id)} className={"px-3 py-1.5 rounded-md text-xs font-semibold transition-colors " + (comparativoTipo === c.id ? "bg-blue-600 text-white" : (dark ? "bg-neutral-800 text-neutral-300 hover:bg-neutral-700" : "bg-neutral-100 text-neutral-600 hover:bg-neutral-200"))}>{c.label}</button>
                    ))}
                  </div>
                  <span className={"text-xs " + mutedText}>
                    vs {prevRange.start.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" })} – {prevRange.end.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" })}
                  </span>
                </div>
              )}
              {periodo === "custom" && (
                <div className="flex items-center gap-2">
                  <input type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)} className={"px-2 py-1.5 rounded-md border text-xs " + (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100" : "bg-white border-neutral-200")} />
                  <span className={"text-xs " + mutedText}>até</span>
                  <input type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} className={"px-2 py-1.5 rounded-md border text-xs " + (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100" : "bg-white border-neutral-200")} />
                </div>
              )}
              <div className="flex items-center gap-3 ml-auto">

                          <tr className={"border-t font-semibold " + (dark ? "border-neutral-800" : "border-neutral-200")}>

                            <td className="py-2.5 tabular-nums">{fmtBRL(totalsSaldo.gasto)}</td>

                            <td className="py-2.5 tabular-nums">{fmtBRL(totalsSaldo.saldoAtual)}</td>
                            <td className="py-2.5 tabular-nums">{fmtBRL(totalsSaldo.diarioEsperado)}</td>
                            <td className="py-2.5 tabular-nums">{fmtBRL(totalsSaldo.orcamentoReal)}</td>
                            <td className="py-2.5" colSpan="2">
                              <span className={contasEmRisco > 0 ? (dark ? "text-amber-400" : "text-amber-700") : mutedText}>

                          </tr>

                      </div>
                    </>

              return blocoOrdem.map((id) => {
                const b = blocosDef[id];
                if (!b || !b.show) return null;
                return (
                  <DraggableBlock key={id} id={id} className={b.className} style={b.style} dark={dark}
                    isDragging={blocoArrastando === id} isOver={blocoSobre === id && blocoArrastando !== id}
                    onDragStartId={setBlocoArrastando} onDragOverId={setBlocoSobre} onDropId={moverBloco}
                    onDragEndReset={() => { setBlocoArrastando(null); setBlocoSobre(null); }}>
                    {b.content}

            })()}

            <footer className={"text-center text-[11px] py-2 " + mutedText}>

              <a href="https://docs.google.com/document/d/195gJ3JvQCOG-GdLzX-eYT7pBzHpMJhJ3cukFeIEVDI8/edit" target="_blank" rel="noopener noreferrer"
                className={dark ? "underline hover:text-neutral-300" : "underline hover:text-neutral-700"}>

          </>
        )}

      <ChatWidget dark={dark} />

  );

/* ================================================================== */
/* 9) APP (login gate)                                                  */
/* ================================================================== */

function App() {
  const [session, setSession] = useState(() => {
    const token = localStorage.getItem("raviera_token");
    const role = localStorage.getItem("raviera_role");
    const email = localStorage.getItem("raviera_email");
    const nome = localStorage.getItem("raviera_nome");
    const permissoesRaw = localStorage.getItem("raviera_permissoes");
    const permissoes = permissoesRaw ? JSON.parse(permissoesRaw) : { verSaldo: true, verInvestimento: true, verFunil: true, verNoticias: true };
    return token ? { token, role, email, nome, permissoes } : null;
  });
  const [justLoggedIn, setJustLoggedIn] = useState(false);

  function handleLogin(result) {
    const permissoes = { verSaldo: result.verSaldo, verInvestimento: result.verInvestimento, verFunil: result.verFunil, verNoticias: result.verNoticias };
    localStorage.setItem("raviera_token", result.access_token);
    localStorage.setItem("raviera_role", result.role);
    localStorage.setItem("raviera_email", result.email);
    localStorage.setItem("raviera_nome", result.nome || "");
    localStorage.setItem("raviera_permissoes", JSON.stringify(permissoes));
    setJustLoggedIn(true);
    setSession({ token: result.access_token, role: result.role, email: result.email, nome: result.nome, permissoes });
  }
  function handleLogout() {
    localStorage.removeItem("raviera_token");
    localStorage.removeItem("raviera_role");
    localStorage.removeItem("raviera_email");
    localStorage.removeItem("raviera_nome");
    localStorage.removeItem("raviera_permissoes");
    setSession(null);
  }

  if (!session) return <LoginScreen onLogin={handleLogin} />;
  return <RavieraDashboard token={session.token} role={session.role} email={session.email} nome={session.nome} permissoes={session.permissoes} justLoggedIn={justLoggedIn} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
