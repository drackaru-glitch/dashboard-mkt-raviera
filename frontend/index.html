<!DOCTYPE html>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  @keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
  .toast-enter { animation: toastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .toast-leave { animation: toastOut 0.25s ease-in forwards; }
  @keyframes welcomeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes welcomeLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .welcome-in { animation: welcomeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .welcome-line { animation: welcomeLine 0.5s cubic-bezier(0.65, 0, 0.35, 1) 0.15s both; transform-origin: center; }

  /* --- Linhas neon ---------------------------------------------------------
     Traço curto na borda de cima do card, na cor de acento do próprio card (nenhuma paleta
     nova foi criada). O degradê apaga nas pontas pra linha não virar uma "tampa" no card, e a
     largura é limitada: num card largo, uma linha de ponta a ponta vira um borrão em vez de um
     detalhe. O ::before é o fio nítido e o ::after é só o brilho — separados porque box-shadow
     ilumina a caixa inteira (vira mancha retangular) em vez de acompanhar o degradê.
     O brilho existe só no tema escuro: no claro ele sumiria no branco e deixaria a linha com
     aspecto sujo, então lá fica só o traço, mais opaco pra não desaparecer. */
  .neon-top { position: relative; }
  .neon-top::before, .neon-top::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    width: min(70%, 230px); pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--neon, #3b82f6), transparent);
  }
  .neon-top::before { top: -1px; height: 1px; opacity: .85; }
  .neon-top::after { top: -2px; height: 3px; filter: blur(4px); opacity: 0; }
  .neon-top.is-dark::before { opacity: 1; }
  .neon-top.is-dark::after { opacity: .7; }

  /* Botão de período ativo (só no escuro, mesmo motivo do brilho acima). */
  .neon-ativo { box-shadow: 0 0 0 1px rgba(59,130,246,.45), 0 0 14px -4px rgba(59,130,246,.95); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;
const APP_VERSION = "0.51";

/* ================================================================== */
/* 1) CLIENTE DA API (backend próprio, substitui o Apps Script)         */
/* ================================================================== */

function formatApiError(detail) {
  if (!detail) return "";
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) {
    return detail
      .map((e) => (e && typeof e === "object" ? (e.loc ? e.loc[e.loc.length - 1] + ": " : "") + (e.msg || JSON.stringify(e)) : String(e)))
      .join(" · ");
  }
  return JSON.stringify(detail);
}
function authFetch(path, token, options = {}) {
  return fetch(path, { ...options, headers: { ...(options.headers || {}), Authorization: "Bearer " + token } });
}
async function authJson(path, token, options = {}) {
  const res = await authFetch(path, token, {
    ...options,
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(formatApiError(body.detail) || "Falha na requisição (" + res.status + ")");
  }
  if (res.status === 204) return null;
  return res.json();
}
async function login(email, password) {
  const body = new URLSearchParams();
  body.set("username", email);
  body.set("password", password);
  const res = await fetch("/auth/login", { method: "POST", body });
  if (!res.ok) throw new Error("E-mail ou senha incorretos.");
  return res.json();
}

const RUNWAY_CRITICO = 3;
const RUNWAY_ATENCAO = 7;

/* ================================================================== */
/* 2) HELPERS DE DATA / AGREGAÇÃO / FORMATAÇÃO                          */
/* ================================================================== */

function getPeriodRange(periodo, customStart, customEnd) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (periodo === "mesAtual" || periodo === "comparativo") return { start: new Date(today.getFullYear(), today.getMonth(), 1), end: today };
  if (periodo === "mesAnterior") {
    return { start: new Date(today.getFullYear(), today.getMonth() - 1, 1), end: new Date(today.getFullYear(), today.getMonth(), 0) };
  }
  return {
    start: customStart ? new Date(customStart) : new Date(today.getFullYear(), today.getMonth(), 1),
    end: customEnd ? new Date(customEnd) : today,
  };
}
function getPreviousRange({ start, end }) {
  const lengthDays = Math.round((end - start) / 86400000) + 1;
  const prevEnd = new Date(start); prevEnd.setDate(prevEnd.getDate() - 1);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevStart.getDate() - (lengthDays - 1));
  return { start: prevStart, end: prevEnd };
}
// Comparativo: mês atual (dia 1 até hoje) contra o mesmo recorte de dias no mês anterior ou
// no mesmo mês do ano passado — evita comparar mês parcial com mês inteiro.
function getComparativoRange(range, tipo) {
  const monthsBack = tipo === "anoAnterior" ? 12 : 1;
  const refYear = range.start.getFullYear();
  const refMonth = range.start.getMonth() - monthsBack;
  const prevStart = new Date(refYear, refMonth, 1);
  const daysInPrevMonth = new Date(refYear, refMonth + 1, 0).getDate();
  const prevEnd = new Date(refYear, refMonth, Math.min(range.end.getDate(), daysInPrevMonth));
  return { start: prevStart, end: prevEnd };
}
// r.data vem do backend como "AAAA-MM-DD" (sem hora). new Date("AAAA-MM-DD") interpreta isso
// como meia-noite UTC, mas os limites do range (range.start/end) são meia-noite LOCAL — em
// fusos negativos (Brasil) isso empurrava cada registro pro dia anterior e sumia com o dia 1
// de cada mês nos filtros de "Mês Atual". Por isso datas sem hora sempre são interpretadas
// como hora local aqui, nunca via new Date(string) direto.
function parseDateLocal(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtDateOnly(dateStr) {
  return parseDateLocal(dateStr).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}
// dashboardData.meta.lastSync vem com "Z" (horário UTC de verdade, ver backend) quando é um
// horário de sincronização real — nesse caso o navegador já converte certinho pro horário
// local de quem estiver olhando. Quando vem só "AAAA-MM-DD" (funil, sem hora de sincronização
// própria) mostramos só a data, sem hora nenhuma pra não inventar um horário sem sentido.
function fmtAtualizado(lastSync) {
  if (!lastSync) return "";
  if (lastSync.includes("T")) {
    const d = new Date(lastSync);
    return "Atualizado em " + d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" }) +
      " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }
  return "Atualizado em " + parseDateLocal(lastSync).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function filterByRange(records, range) {
  return records.filter((r) => { const d = parseDateLocal(r.data); return d >= range.start && d <= range.end; });
}
function aggregateTrafego(records) {
  const base = records.reduce((acc, r) => { acc.gasto += r.gasto; acc.quantidade += r.quantidade; return acc; }, { gasto: 0, quantidade: 0 });
  base.cpl = base.quantidade > 0 ? base.gasto / base.quantidade : 0;
  return base;
}
function variacao(atual, anterior) {
  if (!anterior) return null;
  return ((atual - anterior) / anterior) * 100;
}
function statusRunway(dias) {
  if (dias === null) return "semDados";
  if (dias <= RUNWAY_CRITICO) return "critico";
  if (dias <= RUNWAY_ATENCAO) return "atencao";
  return "ok";
}
const fmtBRL = (v) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 }).format(v || 0);
const fmtNum = (v) => new Intl.NumberFormat("pt-BR").format(Math.round(v || 0));
const fmtDateShort = (iso) => new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });

}

const IconAlertTriangle = (p) => <Icon {...p} path={<><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></>} />;

const IconRefresh = (p) => <Icon {...p} path={<><path d="M23 4v6h-6" /><path d="M1 20v-6h6" /><path d="M3.51 9a9 9 0 0114.85-3.36L23 10" /><path d="M20.49 15a9 9 0 01-14.85 3.36L1 14" /></>} />;
const IconSettings = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" /></>} />;
const IconX = (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>} />;
const IconImage = (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="M21 15l-5-5L5 21" /></>} />;

const IconLogOut = (p) => <Icon {...p} path={<><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></>} />;

const IconInstagram = (p) => <Icon {...p} path={<><rect x="2" y="2" width="20" height="20" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z" /><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" /></>} />;
const IconHeart = (p) => <Icon {...p} path={<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" />} />;
const IconSparkle = (p) => <Icon {...p} path={<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z" />} />;
const IconSend = (p) => <Icon {...p} path={<><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></>} />;

/* ================================================================== */
/* 4) GRÁFICOS EM SVG NATIVO COM TOOLTIP INTERATIVO                     */
/* ================================================================== */

const PAD = { top: 14, right: 16, bottom: 58, left: 54 };
const CHART_H = 280;

function scaleFn(min, max, rangeMin, rangeMax) {
  if (max === min) max = min + 1;
  return (v) => rangeMax - ((v - min) / (max - min)) * (rangeMax - rangeMin);
}

function useElementWidth(ref, fallback) {
  const [width, setWidth] = useState(fallback);
  useEffect(() => {
    if (!ref.current) return;
    const update = () => { if (ref.current) setWidth(ref.current.clientWidth || fallback); };
    update();
    let ro;
    if (window.ResizeObserver) { ro = new ResizeObserver(update); ro.observe(ref.current); }
    window.addEventListener("resize", update);
    return () => { if (ro) ro.disconnect(); window.removeEventListener("resize", update); };
  }, [ref]);
  return width;
}

function Tooltip({ hover, dark }) {
  if (!hover) return null;
  return (
    <div
      className={"absolute z-10 pointer-events-none rounded-lg border px-2.5 py-1.5 text-[11px] shadow-lg whitespace-nowrap " +
        (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100" : "bg-white border-neutral-200 text-neutral-900")}
      style={{ left: hover.xPct + "%", top: hover.yPct + "%", transform: "translate(-50%, -125%)" }}
    >
      {hover.lines.map((l, i) => <div key={i} className={i === 0 ? "font-semibold" : ""}>{l}</div>)}
    </div>
  );
}

function ChartLegend({ items, dark }) {
  return (
    <div className="flex flex-wrap items-center gap-4 mb-3">
      {items.map((it, i) => (
        <div key={i} className="flex items-center gap-1.5 text-[11px]">
          {it.shape === "bar" ? (
            <span className="inline-block shrink-0 w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: it.color }} />
          ) : (
            <svg width="16" height="8" className="shrink-0">
              <line x1="0" y1="4" x2="16" y2="4" stroke={it.color} strokeWidth="2" strokeDasharray={it.dashed ? "4 3" : undefined} />
            </svg>
          )}
          <span className={dark ? "text-neutral-400" : "text-neutral-500"}>{it.label}</span>
        </div>
      ))}
    </div>
  );
}

function EvolutionChart({ data, dark }) {
  const containerRef = useRef(null);
  const CHART_W = useElementWidth(containerRef, 760);
  const [hover, setHover] = useState(null);
  if (!data.length) return <div ref={containerRef} className="h-[280px] flex items-center justify-center text-xs text-neutral-500">Sem dados no período.</div>;
  const innerW = CHART_W - PAD.left - PAD.right;
  const innerH = CHART_H - PAD.top - PAD.bottom;
  const gastoMax = Math.max(...data.map((d) => d.gasto)) * 1.15 || 1;
  const leadsMax = Math.max(...data.map((d) => d.quantidade)) * 1.2 || 1;
  const yGasto = scaleFn(0, gastoMax, PAD.top, PAD.top + innerH);
  const yLeads = scaleFn(0, leadsMax, PAD.top, PAD.top + innerH);
  const x = (i) => PAD.left + (data.length > 1 ? (i / (data.length - 1)) * innerW : innerW / 2);
  const areaPath = data.map((d, i) => (i === 0 ? "M" : "L") + x(i) + "," + yGasto(d.gasto)).join(" ")
    + ` L${x(data.length - 1)},${PAD.top + innerH} L${x(0)},${PAD.top + innerH} Z`;
  const linePath = data.map((d, i) => (i === 0 ? "M" : "L") + x(i) + "," + yLeads(d.quantidade)).join(" ");
  const step = Math.max(1, Math.floor(data.length / 6));

  return (
    <div ref={containerRef} className="relative">
      <svg viewBox={`0 0 ${CHART_W} ${CHART_H}`} className="w-full h-[280px] block">
        {[0, 0.25, 0.5, 0.75, 1].map((g, i) => (
          <line key={i} x1={PAD.left} x2={CHART_W - PAD.right} y1={PAD.top + g * innerH} y2={PAD.top + g * innerH} stroke={dark ? "#1e293b" : "#e2e8f0"} strokeWidth="1" />
        ))}
        <path d={areaPath} fill="#3b82f6" fillOpacity="0.15" stroke="none" />
        <path d={data.map((d, i) => (i === 0 ? "M" : "L") + x(i) + "," + yGasto(d.gasto)).join(" ")} fill="none" stroke="#3b82f6" strokeWidth="2" />
        <path d={linePath} fill="none" stroke="#f59e0b" strokeWidth="2" strokeDasharray="4 3" />
        {data.map((d, i) => (
          <g key={i}
            onMouseEnter={() => setHover({ xPct: (x(i) / CHART_W) * 100, yPct: (Math.min(yGasto(d.gasto), yLeads(d.quantidade)) / CHART_H) * 100, lines: [d.dataLabel, "Leads: " + fmtNum(d.quantidade), "Investimento: " + fmtBRL(d.gasto)] })}
            onMouseLeave={() => setHover(null)}>
            <circle cx={x(i)} cy={yLeads(d.quantidade)} r="8" fill="transparent" />
            <circle cx={x(i)} cy={yLeads(d.quantidade)} r="2.5" fill="#f59e0b" />
          </g>
        ))}
        {data.map((d, i) => (i % step === 0 || i === data.length - 1) && (
          <text key={i} x={x(i)} y={CHART_H - PAD.bottom + 34} fontSize="10" textAnchor="middle" fill={dark ? "#64748b" : "#94a3b8"}>{d.dataLabel}</text>
        ))}
        <text x={PAD.left - 8} y={PAD.top + 4} fontSize="9" textAnchor="end" fill={dark ? "#64748b" : "#94a3b8"}>R${Math.round(gastoMax / 1000)}k</text>
        <text x={CHART_W - PAD.right + 8} y={PAD.top + 4} fontSize="9" textAnchor="end" fill={dark ? "#64748b" : "#94a3b8"}>{fmtNum(leadsMax)}</text>
      </svg>
      <Tooltip hover={hover} dark={dark} />
    </div>
  );
}

function RankingChart({ data, dark }) {
  const containerRef = useRef(null);
  const CHART_W = useElementWidth(containerRef, 760);
  const [hover, setHover] = useState(null);
  if (!data.length) return <div ref={containerRef} className="h-[280px] flex items-center justify-center text-xs text-neutral-500">Sem dados.</div>;
  const maxLabelLen = Math.max(...data.map((d) => d.marca.length));
  const pad = { ...PAD, bottom: Math.min(170, Math.max(80, maxLabelLen * 5.4 + 30)) };
  const chartH = 280 - PAD.bottom + pad.bottom;
  const innerW = CHART_W - pad.left - pad.right;
  const innerH = chartH - pad.top - pad.bottom;
  const leadsMax = Math.max(...data.map((d) => d.quantidade)) * 1.2 || 1;
  const gastoMax = Math.max(...data.map((d) => d.gasto)) * 1.2 || 1;
  const yLeads = scaleFn(0, leadsMax, pad.top, pad.top + innerH);
  const yGasto = scaleFn(0, gastoMax, pad.top, pad.top + innerH);
  const slot = innerW / data.length;
  const barW = Math.min(30, slot * 0.45);

  return (
    <div ref={containerRef} className="relative">
      <svg viewBox={`0 0 ${CHART_W} ${chartH}`} className="w-full block" style={{ height: chartH }}>
        {[0, 0.25, 0.5, 0.75, 1].map((g, i) => (
          <line key={i} x1={pad.left} x2={CHART_W - pad.right} y1={pad.top + g * innerH} y2={pad.top + g * innerH} stroke={dark ? "#1e293b" : "#e2e8f0"} strokeWidth="1" />
        ))}
        {data.map((d, i) => {
          const cx = pad.left + slot * i + slot / 2;
          const barY = yLeads(d.quantidade);
          const gastoY = yGasto(d.gasto);
          return (
            <g key={i}
              onMouseEnter={() => setHover({ xPct: (cx / CHART_W) * 100, yPct: (Math.min(barY, gastoY) / chartH) * 100, lines: [d.marca, "Leads: " + fmtNum(d.quantidade), "Investimento: " + fmtBRL(d.gasto)] })}
              onMouseLeave={() => setHover(null)}>
              <rect x={pad.left + slot * i} y={pad.top} width={slot} height={innerH} fill="transparent" />
              <rect x={cx - barW / 2} y={barY} width={barW} height={pad.top + innerH - barY} fill="#3b82f6" rx="3" />
              <circle cx={cx} cy={gastoY} r="3.5" fill="#f59e0b" />
              <text x={cx} y={chartH - pad.bottom + 14} fontSize="10" textAnchor="end" fill={dark ? "#94a3b8" : "#64748b"} transform={`rotate(-60, ${cx}, ${chartH - pad.bottom + 14})`}>{d.marca}</text>
            </g>
          );
        })}
        <path d={data.map((d, i) => (i === 0 ? "M" : "L") + (pad.left + slot * i + slot / 2) + "," + yGasto(d.gasto)).join(" ")} fill="none" stroke="#f59e0b" strokeWidth="2" strokeDasharray="4 3" />
      </svg>
      <Tooltip hover={hover} dark={dark} />
    </div>
  );
}

// Arco desenhado ponto a ponto (em vez de large-arc/sweep-flag do SVG) — mais fácil de
// acertar a direção certa em qualquer sentido, positivo ou negativo.
// Mini gráfico da evolução dia a dia da métrica dentro do período selecionado. Substituiu o
// velocímetro que ficava aqui: ele desenhava a variação percentual num arco de -100% a +100%,
// uma escala inventada (variação não tem teto), travava no talo em qualquer valor extremo e
// repetia em desenho o número que já aparece escrito logo abaixo. O sparkline usa o mesmo
// espaço pra mostrar algo que o número sozinho não conta: se o resultado veio de uma evolução
// constante ou de um pico isolado.
function Sparkline({ valores, cor, dark }) {
  const w = 132, h = 38;
  const pts = (valores || []).filter((v) => v !== null && v !== undefined && isFinite(v));
  if (pts.length < 2) {
    return (
      <div style={{ height: h }} className={"w-full flex items-center justify-center text-[10px] " + (dark ? "text-neutral-600" : "text-neutral-400")}>
        sem dados no período
      </div>
    );
  }
  const min = Math.min(...pts), max = Math.max(...pts);
  const passo = w / (pts.length - 1);
  // 3px de folga em cima e embaixo pra linha e o ponto final não encostarem na borda.
  // Quando todos os dias têm o mesmo valor não há amplitude pra normalizar: aí a linha vai pro
  // meio da caixa (lê como "estável") em vez de colar no fundo, que daria a impressão errada
  // de ter caído a zero.
  const coords = pts.map((v, i) => [
    i * passo,
    max === min ? h / 2 : h - 3 - ((v - min) / (max - min)) * (h - 6),
  ]);
  const linha = coords.map(([x, y], i) => (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
  const area = linha + " L " + w + " " + h + " L 0 " + h + " Z";
  const fim = coords[coords.length - 1];
  const gradId = "spark-" + cor.replace("#", "");
  return (
    <svg viewBox={"0 0 " + w + " " + h} width="100%" height={h} preserveAspectRatio="none" className="block">
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={cor} stopOpacity="0.25" />
          <stop offset="100%" stopColor={cor} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={"url(#" + gradId + ")"} />
      <path d={linha} fill="none" stroke={cor} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
      <circle cx={fim[0]} cy={fim[1]} r="2.4" fill={cor} vectorEffect="non-scaling-stroke" />
    </svg>
  );
}

function NewsCarousel({ itens, dark, mutedText }) {
  const scrollRef = useRef(null);
  const [activeIndex, setActiveIndex] = useState(0);

  function handleScroll() {
    const el = scrollRef.current;
    if (!el) return;
    const center = el.scrollLeft + el.clientWidth / 2;
    let closest = 0, closestDist = Infinity;
    Array.from(el.children).forEach((child, i) => {
      const childCenter = child.offsetLeft + child.offsetWidth / 2;
      const dist = Math.abs(center - childCenter);
      if (dist < closestDist) { closestDist = dist; closest = i; }
    });
    setActiveIndex(closest);
  }
  useEffect(() => { const t = setTimeout(handleScroll, 50); return () => clearTimeout(t); }, [itens]);

  function scrollToIndex(i) {
    const el = scrollRef.current;
    const child = el && el.children[i];
    if (!el || !child) return;
    el.scrollTo({ left: child.offsetLeft - (el.clientWidth - child.offsetWidth) / 2, behavior: "smooth" });
  }

  if (!itens.length) return null;
  return (
    <div className="relative">
      <div ref={scrollRef} onScroll={handleScroll}
        className="flex gap-4 overflow-x-auto pb-2 px-[16%] snap-x snap-mandatory scroll-smooth [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        {itens.map((n, i) => (
          <a key={i} href={n.link} target="_blank" rel="noopener noreferrer"
            className={"shrink-0 w-64 sm:w-72 snap-center rounded-xl border overflow-hidden transition-all duration-300 hover:scale-105 hover:opacity-100 hover:shadow-lg hover:z-10 relative " +
              (dark ? "bg-neutral-900 border-neutral-800" : "bg-white border-neutral-200 shadow-sm") + " " +
              (i === activeIndex ? "scale-100 opacity-100" : "scale-90 opacity-40")}>
            <div className={"h-36 w-full " + (dark ? "bg-neutral-800" : "bg-neutral-100")}>
              {n.thumbnailUrl ? <img src={n.thumbnailUrl} alt="" className="h-full w-full object-cover" /> : (
                <div className="h-full w-full flex items-center justify-center"><IconImage className={"h-6 w-6 " + mutedText} /></div>
              )}
            </div>
            <div className="p-3">
              <p className="text-sm font-semibold leading-snug line-clamp-3">{n.titulo}</p>
              <p className={"text-[11px] mt-1 " + mutedText}>{n.fonte}{n.publicadoEm ? " · " + fmtDateShort(n.publicadoEm) : ""}</p>
            </div>
          </a>
        ))}
      </div>
      {itens.length > 1 && (
        <>
          <button onClick={() => scrollToIndex(Math.max(0, activeIndex - 1))} aria-label="Anterior"
            className={"absolute left-0 top-1/2 -translate-y-1/2 h-8 w-8 rounded-full flex items-center justify-center border z-10 " + (dark ? "bg-neutral-900 border-neutral-700" : "bg-white border-neutral-200 shadow")}>
            <IconChevronDown className="h-4 w-4 rotate-90" />

function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    setLoading(true);
    try {
      const result = await login(email, password);
      onLogin(result);
    } catch (err) {
      setError(err.message || "Não foi possível entrar.");
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="min-h-screen w-full bg-neutral-950 text-neutral-100 flex items-center justify-center px-4">
      <form onSubmit={handleSubmit} className="w-full max-w-sm bg-neutral-900/70 border border-neutral-800 rounded-xl p-6 flex flex-col gap-4">
        <div className="flex items-center gap-3 mb-2">
          <img src="/static/assets/logo-escuro.png" alt="Grupo Raviera" className="h-10 w-auto object-contain" />
          <div>
            <h1 className="text-lg font-bold leading-none">FEFO</h1>
            <p className="text-xs text-neutral-400">Fast Executive Follow-up & Overview</p>
          </div>
        </div>
        {error && <div className="text-xs text-red-400 bg-red-500/10 border border-red-500/20 rounded-md px-3 py-2">{error}</div>}
        <div className="flex flex-col gap-1">
          <label className="text-xs font-medium text-neutral-400">E-mail</label>
          <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
            className="px-3 py-2 rounded-md bg-neutral-800 border border-neutral-700 text-sm" />
        </div>
        <div className="flex flex-col gap-1">
          <label className="text-xs font-medium text-neutral-400">Senha</label>
          <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
            className="px-3 py-2 rounded-md bg-neutral-800 border border-neutral-700 text-sm" />
        </div>
        <button type="submit" disabled={loading}
          className="mt-2 flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-60 text-white text-sm font-semibold rounded-md py-2">
          <IconLock className="h-3.5 w-3.5" /> {loading ? "Entrando..." : "Entrar"}
        </button>
      </form>
    </div>
  );
}

            {users.map((u) => (
              <tr key={u.id}>
                <td className="py-1.5 font-semibold">{u.nome || "—"}</td>
                <td className="py-1.5">{u.email}</td>
                <td className="py-1.5">{u.role}</td>
                <td className="py-1.5">{u.role === "admin" ? "Todas" : u.brand_ids.map((id) => (brands.find((b) => b.id === id) || {}).nome).filter(Boolean).join(", ") || "Nenhuma"}</td>
                <td className="py-1.5">
                  {u.role === "admin" ? (
                    <span className={"text-xs " + mutedText}>Tudo (admin)</span>
                  ) : (
                    <div className="flex flex-wrap gap-1">
                      {[
                        { campo: "ver_saldo", label: "Saldo" },
                        { campo: "ver_investimento", label: "Investimento" },
                        { campo: "ver_funil", label: "Info. Gerais" },
                        { campo: "ver_noticias", label: "Notícias" },
                      ].map((p) => (
                        <button key={p.campo}
                          onClick={() => withErrorHandling(() => authJson(`/admin/users/${u.id}`, token, { method: "PUT", body: JSON.stringify({ [p.campo]: !u[p.campo] }) }))}
                          title={u[p.campo] ? `Clique pra esconder ${p.label.toLowerCase()} desse usuário` : `Clique pra liberar ${p.label.toLowerCase()} pra esse usuário`}
                          className={"text-[11px] px-1.5 py-0.5 rounded-full border font-semibold " +
                            (u[p.campo] ? (dark ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-400" : "bg-emerald-50 border-emerald-200 text-emerald-700") : (dark ? "bg-neutral-800 border-neutral-700 text-neutral-500" : "bg-neutral-100 border-neutral-200 text-neutral-400"))}>
                          {p.label}
                        </button>
                      ))}
                    </div>
                  )}
                </td>
                <td className="py-1.5 text-right">
                  <button onClick={() => askConfirm(`Excluir o usuário "${u.email}"?`, () => withErrorHandling(() => authJson(`/admin/users/${u.id}`, token, { method: "DELETE" })))} className="text-red-500"><IconTrash className="h-3.5 w-3.5" /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        <p className={"text-[11px] mb-3 -mt-1 " + mutedText}>Clique nos rótulos "Saldo" / "Investimento" / "Info. Gerais" / "Notícias" pra liberar ou esconder cada um, marca a marca não é possível — vale pra todas as marcas que esse usuário acessa.</p>
        <div className="flex flex-col gap-2">
          <div className="flex flex-wrap gap-2 items-end">
            <input placeholder="Nome" className={inputCls} value={newUser.nome} onChange={(e) => setNewUser({ ...newUser, nome: e.target.value })} />
            <input type="email" placeholder="E-mail" className={inputCls} value={newUser.email} onChange={(e) => setNewUser({ ...newUser, email: e.target.value })} />
            <input type="password" placeholder="Senha inicial" className={inputCls} value={newUser.password} onChange={(e) => setNewUser({ ...newUser, password: e.target.value })} />
            <select className={inputCls} value={newUser.role} onChange={(e) => setNewUser({ ...newUser, role: e.target.value })}>
              <option value="gerente">Gerente</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          {newUser.role === "gerente" && (
            <div className="flex flex-wrap gap-2">
              {brands.map((b) => {
                const checked = newUser.brand_ids.includes(b.id);
                return (
                  <label key={b.id} className={"text-xs px-2 py-1 rounded-md border cursor-pointer " + (checked ? "bg-blue-600 text-white border-blue-600" : inputCls)}>
                    <input type="checkbox" className="hidden" checked={checked} onChange={() => {
                      setNewUser({ ...newUser, brand_ids: checked ? newUser.brand_ids.filter((id) => id !== b.id) : [...newUser.brand_ids, b.id] });
                    }} />
                    {b.nome}
                  </label>
                );
              })}
            </div>
          )}
          {newUser.role === "gerente" && (
            <div className="flex flex-wrap gap-2 items-center">
              <span className={"text-xs " + mutedText}>Pode ver:</span>
              {[
                { campo: "ver_saldo", label: "Saldo" },
                { campo: "ver_investimento", label: "Investimento" },
                { campo: "ver_funil", label: "Informações Gerais" },
                { campo: "ver_noticias", label: "Notícias do Setor" },
              ].map((p) => (
                <label key={p.campo} className={"text-xs px-2 py-1 rounded-md border cursor-pointer " + (newUser[p.campo] ? "bg-blue-600 text-white border-blue-600" : inputCls)}>
                  <input type="checkbox" className="hidden" checked={newUser[p.campo]} onChange={() => setNewUser({ ...newUser, [p.campo]: !newUser[p.campo] })} />
                  {p.label}
                </label>
              ))}
            </div>
          )}
          <button onClick={() => withErrorHandling(async () => {
            await authJson("/admin/users", token, { method: "POST", body: JSON.stringify(newUser) });
            setNewUser({ nome: "", email: "", password: "", role: "gerente", brand_ids: [], ver_saldo: true, ver_investimento: true, ver_funil: true, ver_noticias: true });
          })} className="self-start px-3 py-1.5 rounded-md text-xs font-semibold bg-blue-600 text-white">Adicionar usuário</button>
        </div>
      </div>

      <ConfirmModal confirm={confirm} dark={dark} onCancel={() => setConfirm(null)} onConfirm={handleConfirm} />
    </div>
  );
}

function KeywordCard({ kw, dark, cardBg, mutedText }) {
  return (
    <div className={"rounded-xl border p-3 flex gap-2.5 items-center " + cardBg}>
      <span className="text-lg leading-none shrink-0">{RANK_MEDAL[kw.rank] || kw.rank}</span>
      <div className="min-w-0 flex-1">
        <p className="text-sm font-semibold truncate">{kw.texto || "—"}</p>
        <p className={"text-xs " + mutedText}>
          Investido {fmtBRL(kw.gasto)} · {fmtNum(kw.cliques)} cliques · {fmtNum(kw.conversoes)} conv. · CPA {fmtBRL(kw.custoPorConversao)}
        </p>
      </div>
    </div>
  );
}

function KeywordsBrandGroup({ item, dark, cardBg, mutedText }) {
  return (
    <div className="flex flex-col gap-2">
      <p className={"text-[11px] font-semibold uppercase tracking-wide " + mutedText}>{item.marca}</p>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {item.palavrasChave.map((k) => (
          <KeywordCard key={k.rank} kw={k} dark={dark} cardBg={cardBg} mutedText={mutedText} />
        ))}
      </div>
    </div>
  );
}

function LocationHeatRow({ loc, maxConversoes, dark, mutedText }) {
  const intensidade = maxConversoes > 0 ? loc.conversoes / maxConversoes : 0;
  return (
    <div className={"relative rounded-lg overflow-hidden border " + (dark ? "border-neutral-800" : "border-neutral-200")}>
      <div className="absolute inset-y-0 left-0" style={{
        width: (8 + intensidade * 92) + "%",
        background: dark ? "rgba(248,113,113," + (0.1 + intensidade * 0.35).toFixed(2) + ")" : "rgba(220,38,38," + (0.06 + intensidade * 0.3).toFixed(2) + ")",
      }} />
      <div className="relative flex items-center justify-between gap-2 px-3 py-2 text-xs">
        <span className="font-semibold truncate">{loc.cidade}{loc.estado ? " · " + loc.estado : ""}</span>
        <span className={"shrink-0 " + mutedText}>{fmtNum(loc.conversoes)} conv. · {fmtNum(loc.cliques)} cliques · {fmtBRL(loc.gasto)}</span>
      </div>
    </div>
  );
}

function LocationHeatmapBrandGroup({ item, dark, mutedText }) {
  const maxConversoes = Math.max(...item.localidades.map((l) => l.conversoes), 0.001);
  return (
    <div className="flex flex-col gap-2">
      <p className={"text-[11px] font-semibold uppercase tracking-wide " + mutedText}>{item.marca}</p>
      <div className="flex flex-col gap-1.5">
        {item.localidades.map((l) => (
          <LocationHeatRow key={l.cidade} loc={l} maxConversoes={maxConversoes} dark={dark} mutedText={mutedText} />
        ))}
      </div>
    </div>
  );
}

function GoogleAdsDashboard({ token, dark, cardBg, mutedText, pushToast, permissoes }) {
  const [marcaFiltro, setMarcaFiltro] = useState("todas");
  const [periodo, setPeriodo] = useState("mesAtual");
  const [comparativoTipo, setComparativoTipo] = useState("mesAnterior");
  const [customStart, setCustomStart] = useState("");
  const [customEnd, setCustomEnd] = useState("");
  const [dashboardData, setDashboardData] = useState({ brands: [], trafego: [], orcamentos: [], topKeywords: [], heatmap: [], meta: {} });
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);

  async function loadDashboard() {
    setLoading(true);
    try {
      const data = await authJson("/api/dashboard/google", token);
      setDashboardData(data);
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setLoading(false);
    }
  }
  async function refreshData() {
    setSyncing(true);
    try {
      await authJson("/api/sync", token, { method: "POST" });
      await loadDashboard();
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setSyncing(false);
    }
  }
  useEffect(() => { loadDashboard(); }, []);

  const brandsList = useMemo(() => dashboardData.brands.map((b) => b.nome).sort(), [dashboardData.brands]);
  const brandsToShow = useMemo(() => (marcaFiltro === "todas" ? brandsList : [marcaFiltro]), [marcaFiltro, brandsList]);

  const range = useMemo(() => getPeriodRange(periodo, customStart, customEnd), [periodo, customStart, customEnd]);
  const prevRange = useMemo(
    () => (periodo === "comparativo" ? getComparativoRange(range, comparativoTipo) : getPreviousRange(range)),
    [range, periodo, comparativoTipo]
  );

  const scopedTrafego = useMemo(() => dashboardData.trafego.filter((r) => brandsToShow.includes(r.marca)), [dashboardData.trafego, brandsToShow]);
  const currentRecords = useMemo(() => filterByRange(scopedTrafego, range), [scopedTrafego, range]);
  const previousRecords = useMemo(() => filterByRange(scopedTrafego, prevRange), [scopedTrafego, prevRange]);

  function aggregateGoogle(records) {
    const base = records.reduce((acc, r) => { acc.gasto += r.gasto; acc.cliques += r.cliques; acc.conversoes += r.conversoes; return acc; }, { gasto: 0, cliques: 0, conversoes: 0 });
    base.cpa = base.conversoes > 0 ? base.gasto / base.conversoes : 0;
    return base;
  }
  const currentAgg = useMemo(() => aggregateGoogle(currentRecords), [currentRecords]);
  const previousAgg = useMemo(() => aggregateGoogle(previousRecords), [previousRecords]);

  const topKeywordsToShow = useMemo(() => dashboardData.topKeywords.filter((g) => brandsToShow.includes(g.marca)), [dashboardData.topKeywords, brandsToShow]);
  const heatmapToShow = useMemo(() => dashboardData.heatmap.filter((g) => brandsToShow.includes(g.marca)), [dashboardData.heatmap, brandsToShow]);

  const [keywordsExpanded, setKeywordsExpanded] = useState(false);
  const [heatmapExpanded, setHeatmapExpanded] = useState(false);
  useEffect(() => { setKeywordsExpanded(false); setHeatmapExpanded(false); }, [brandsToShow]);
  const KEYWORDS_PREVIEW_COUNT = 3;
  const HEATMAP_PREVIEW_COUNT = 3;
  const keywordsToRender = keywordsExpanded ? topKeywordsToShow : topKeywordsToShow.slice(0, KEYWORDS_PREVIEW_COUNT);
  const hasMoreKeywords = topKeywordsToShow.length > KEYWORDS_PREVIEW_COUNT;
  const heatmapToRender = heatmapExpanded ? heatmapToShow : heatmapToShow.slice(0, HEATMAP_PREVIEW_COUNT);
  const hasMoreHeatmap = heatmapToShow.length > HEATMAP_PREVIEW_COUNT;

  const linhasOrcamento = useMemo(() => {
    return brandsToShow.map((marca) => {
      const orc = dashboardData.orcamentos.find((o) => o.marca === marca) || {};
      const recs = filterByRange(dashboardData.trafego.filter((r) => r.marca === marca), range);
      const agg = aggregateGoogle(recs);
      return {
        marca, orcamentoDiario: orc.orcamentoDiario || 0, status: orc.status || "",
        orcamentoMensal: orc.orcamentoMensal || 0, gastoMesAtual: orc.gastoMesAtual || 0, saldoAtual: orc.saldoAtual || 0,
        gasto: agg.gasto, cliques: agg.cliques, conversoes: agg.conversoes, cpa: agg.cpa,
      };
    });
  }, [brandsToShow, dashboardData.orcamentos, dashboardData.trafego, range]);

  const totals = useMemo(() => {
    const t = linhasOrcamento.reduce((acc, r) => {
      acc.gasto += r.gasto; acc.cliques += r.cliques; acc.conversoes += r.conversoes; acc.orcamentoDiario += r.orcamentoDiario;
      acc.orcamentoMensal += r.orcamentoMensal; acc.saldoAtual += r.saldoAtual;
      return acc;
    }, { gasto: 0, cliques: 0, conversoes: 0, orcamentoDiario: 0, orcamentoMensal: 0, saldoAtual: 0 });
    t.cpa = t.conversoes > 0 ? t.gasto / t.conversoes : 0;
    return t;
  }, [linhasOrcamento]);

  const previousLabel = comparativoTipo === "anoAnterior" ? "mesmo mês " + prevRange.start.getFullYear() : "mês anterior";

  return (
    <div className="flex flex-col gap-6">
      {dashboardData.meta.demoMode && (
        <div className={"rounded-lg border px-3 py-2 flex items-center gap-2 text-xs " + (dark ? "bg-amber-500/5 border-amber-500/20 text-amber-400" : "bg-amber-50 border-amber-200 text-amber-700")}>
          <IconRefresh className="h-3.5 w-3.5 shrink-0" />
          Exibindo dados de demonstração (credenciais do Google Ads não configuradas no servidor).
        </div>
      )}

      {syncing && (
        <div className={"rounded-lg border px-3 py-2 flex items-center gap-2 text-xs " + (dark ? "bg-blue-500/5 border-blue-500/20 text-blue-400" : "bg-blue-50 border-blue-200 text-blue-700")}>
          <IconRefresh className="h-3.5 w-3.5 shrink-0 animate-spin" />
          Sincronizando com o Meta e o Google Ads — pode levar alguns minutos. Não clique de novo nem feche esta aba.
        </div>
      )}

      <div className={"rounded-xl border p-3 flex flex-wrap items-center gap-3 " + cardBg}>
        <div className="flex items-center gap-1.5"><IconCalendar className={"h-4 w-4 " + mutedText} /><span className={"text-xs font-medium " + mutedText}>Período:</span></div>
        <div className="flex flex-wrap gap-1">
          {[{ id: "mesAtual", label: "Mês Atual" }, { id: "mesAnterior", label: "Mês Anterior" }, { id: "comparativo", label: "Comparativo" }, { id: "custom", label: "Customizado" }].map((p) => (
            <button key={p.id} onClick={() => setPeriodo(p.id)} className={"px-3 py-1.5 rounded-md text-xs font-semibold transition-colors " + (periodo === p.id ? "bg-blue-600 text-white" + (dark ? " neon-ativo" : "") : (dark ? "bg-neutral-800 text-neutral-300 hover:bg-neutral-700" : "bg-neutral-100 text-neutral-600 hover:bg-neutral-200"))}>{p.label}</button>
          ))}
        </div>
        <span className={"text-xs " + mutedText}>
          {range.start.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })} – {range.end.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })}
        </span>
        {periodo === "comparativo" && (
          <div className="w-full flex flex-wrap items-center gap-3">
            <span className={"text-xs font-medium " + mutedText}>Comparar com:</span>
            <div className="flex flex-wrap gap-1">
              {[{ id: "mesAnterior", label: "Mês Anterior" }, { id: "anoAnterior", label: "Mesmo Mês Ano Passado" }].map((c) => (
                <button key={c.id} onClick={() => setComparativoTipo(c.id)} className={"px-3 py-1.5 rounded-md text-xs font-semibold transition-colors " + (comparativoTipo === c.id ? "bg-blue-600 text-white" : (dark ? "bg-neutral-800 text-neutral-300 hover:bg-neutral-700" : "bg-neutral-100 text-neutral-600 hover:bg-neutral-200"))}>{c.label}</button>
              ))}
            </div>
            <span className={"text-xs " + mutedText}>
              vs {prevRange.start.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" })} – {prevRange.end.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" })}
            </span>
          </div>
        )}
        {periodo === "custom" && (
          <div className="flex items-center gap-2">
            <input type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)} className={"px-2 py-1.5 rounded-md border text-xs " + (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100" : "bg-white border-neutral-200")} />
            <span className={"text-xs " + mutedText}>até</span>
            <input type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} className={"px-2 py-1.5 rounded-md border text-xs " + (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100" : "bg-white border-neutral-200")} />
          </div>
        )}
        <div className="flex items-center gap-3 ml-auto">
          <div className="flex items-center gap-1.5 text-xs">
            <span className={mutedText}>{fmtAtualizado(dashboardData.meta.lastSync)}</span>
            <button onClick={refreshData} disabled={loading || syncing} aria-label="Atualizar dados"
              className={"h-7 w-7 flex items-center justify-center rounded-md border disabled:opacity-50 " + (dark ? "bg-neutral-800 border-neutral-700" : "bg-neutral-100 border-neutral-200")}>
              <IconRefresh className={"h-3.5 w-3.5 " + mutedText + (loading || syncing ? " animate-spin" : "")} />
            </button>
          </div>
          <div className="flex items-center gap-1.5">
            <IconBuilding className={"h-4 w-4 " + mutedText} />
            <div className="relative">
              <select value={marcaFiltro} onChange={(e) => setMarcaFiltro(e.target.value)} className={"appearance-none pl-3 pr-8 py-1.5 rounded-md border text-xs font-semibold cursor-pointer " + (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100" : "bg-white border-neutral-200 text-neutral-900")}>
                <option value="todas">Todas as Marcas</option>
                {brandsList.map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
              <IconChevronDown className={"h-3.5 w-3.5 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none " + mutedText} />
            </div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        {permissoes.verInvestimento && (
          <KpiCard IconComp={IconDollar} label="Investimento" value={fmtBRL(currentAgg.gasto)} badgeValue={variacao(currentAgg.gasto, previousAgg.gasto)} previousValue={periodo === "comparativo" ? fmtBRL(previousAgg.gasto) : undefined} previousLabel={previousLabel} dark={dark} accent="#3b82f6" />
        )}
        <KpiCard IconComp={IconTarget} label="Cliques" value={fmtNum(currentAgg.cliques)} badgeValue={variacao(currentAgg.cliques, previousAgg.cliques)} previousValue={periodo === "comparativo" ? fmtNum(previousAgg.cliques) : undefined} previousLabel={previousLabel} dark={dark} accent="#6366f1" />
        <KpiCard IconComp={IconCheck} label="Conversões" value={fmtNum(currentAgg.conversoes)} badgeValue={variacao(currentAgg.conversoes, previousAgg.conversoes)} previousValue={periodo === "comparativo" ? fmtNum(previousAgg.conversoes) : undefined} previousLabel={previousLabel} dark={dark} accent="#a855f7" />
        {permissoes.verSaldo && (
          <KpiCard IconComp={IconAlertCircle} label="Saldo Total" value={fmtBRL(totals.saldoAtual)} dark={dark} accent={totals.saldoAtual >= 0 ? "#10b981" : "#ef4444"} />
        )}
      </div>

      {topKeywordsToShow.length > 0 && (
        <div className={"rounded-xl border p-4 " + cardBg}>
          <h2 className="text-sm font-bold mb-1 flex items-center gap-1.5"><IconAward className="h-4 w-4 text-amber-500" /> Impacto das Palavras-Chave por Marca</h2>
          <p className={"text-xs mb-3 " + mutedText}>Palavras-chave com mais conversões de cada marca nos últimos 30 dias</p>
          <div className="flex flex-col gap-4">
            {keywordsToRender.map((item) => (
              <KeywordsBrandGroup key={item.brandId} item={item} dark={dark} cardBg={cardBg} mutedText={mutedText} />
            ))}
          </div>
          {hasMoreKeywords && (
            <button onClick={() => setKeywordsExpanded((v) => !v)}
              className={"mt-4 w-full flex items-center justify-center gap-1.5 py-2 rounded-md text-xs font-semibold border transition-colors " +
                (dark ? "bg-neutral-800 border-neutral-700 text-neutral-200 hover:bg-neutral-700" : "bg-neutral-100 border-neutral-200 text-neutral-700 hover:bg-neutral-200")}>
              {keywordsExpanded ? "Ver menos" : "Ver todas (" + topKeywordsToShow.length + ")"}
              <IconChevronDown className={"h-3.5 w-3.5 transition-transform" + (keywordsExpanded ? " rotate-180" : "")} />
            </button>
          )}
        </div>
      )}

      {heatmapToShow.length > 0 && (
        <div className={"rounded-xl border p-4 " + cardBg}>
          <h2 className="text-sm font-bold mb-1 flex items-center gap-1.5">🗺️ Mapa de Calor por Localidade</h2>
          <p className={"text-xs mb-3 " + mutedText}>Cidades onde as pessoas realmente estavam ao clicar/converter, nos últimos 30 dias</p>
          <div className="flex flex-col gap-4">
            {heatmapToRender.map((item) => (
              <LocationHeatmapBrandGroup key={item.brandId} item={item} dark={dark} mutedText={mutedText} />
            ))}
          </div>
          {hasMoreHeatmap && (
            <button onClick={() => setHeatmapExpanded((v) => !v)}
              className={"mt-4 w-full flex items-center justify-center gap-1.5 py-2 rounded-md text-xs font-semibold border transition-colors " +
                (dark ? "bg-neutral-800 border-neutral-700 text-neutral-200 hover:bg-neutral-700" : "bg-neutral-100 border-neutral-200 text-neutral-700 hover:bg-neutral-200")}>
              {heatmapExpanded ? "Ver menos" : "Ver todas (" + heatmapToShow.length + ")"}
              <IconChevronDown className={"h-3.5 w-3.5 transition-transform" + (heatmapExpanded ? " rotate-180" : "")} />
            </button>
          )}
        </div>
      )}

      {permissoes.verSaldo && (
      <div className={"rounded-xl border p-4 overflow-x-auto " + cardBg}>
        <h2 className="text-sm font-bold mb-1">Orçamento das Contas (Google Ads)</h2>
        <p className={"text-xs mb-4 " + mutedText}>Orçamento diário configurado nas campanhas ativas de cada conta</p>
        <table className="w-full text-sm min-w-[680px]">
          <thead><tr className={"text-left text-xs uppercase tracking-wide " + mutedText}>
            <th className="pb-2">Marca</th>
            <th className="pb-2">Investimento</th>
            <th className="pb-2">Cliques</th>
            <th className="pb-2">Conversões</th>

/* 7.1) FUNIL DE VENDAS (Lead → Proposta → Venda)                       */
/* ================================================================== */

function aggregateFunil(records) {
  const base = records.reduce((acc, r) => { acc.leads += r.leads; acc.propostas += r.propostas; acc.vendas += r.vendas; return acc; }, { leads: 0, propostas: 0, vendas: 0 });
  base.taxaLeadProposta = base.leads > 0 ? (base.propostas / base.leads) * 100 : 0;
  base.taxaPropostaVenda = base.propostas > 0 ? (base.vendas / base.propostas) * 100 : 0;
  base.taxaGeral = base.leads > 0 ? (base.vendas / base.leads) * 100 : 0;
  return base;
}
function clampNum(v, min, max) { return Math.min(max, Math.max(min, v)); }
const fmtPct1 = (v) => v.toFixed(1).replace(".", ",") + "%";

// Arredonda os cantos de um polígono qualquer (usado nos trapézios do funil):
// pra cada vértice, recua um pouco pelas duas arestas vizinhas e conecta com uma curva quadrática.
function roundedPolygonPath(points, radius) {
  const n = points.length;
  const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  let d = "";
  for (let i = 0; i < n; i++) {
    const curr = points[i];
    const prev = points[(i - 1 + n) % n];
    const next = points[(i + 1) % n];
    const len1 = dist(prev, curr) || 1;
    const len2 = dist(curr, next) || 1;
    const r = Math.min(radius, len1 / 2, len2 / 2);
    const p1 = [curr[0] + (prev[0] - curr[0]) / len1 * r, curr[1] + (prev[1] - curr[1]) / len1 * r];
    const p2 = [curr[0] + (next[0] - curr[0]) / len2 * r, curr[1] + (next[1] - curr[1]) / len2 * r];
    d += (i === 0 ? `M ${p1[0]},${p1[1]} ` : `L ${p1[0]},${p1[1]} `) + `Q ${curr[0]},${curr[1]} ${p2[0]},${p2[1]} `;
  }
  return d + "Z";
}
function FunnelShape({ y0, y1, topHalf, bottomHalf, cx, fill, dark }) {
  const points = [[cx - topHalf, y0], [cx + topHalf, y0], [cx + bottomHalf, y1], [cx - bottomHalf, y1]];
  return (
    <path d={roundedPolygonPath(points, 12)} fill={fill}
      stroke={dark ? "rgba(255,255,255,0.10)" : "rgba(255,255,255,0.5)"} strokeWidth="1"
      style={!dark ? { filter: "drop-shadow(0 10px 16px rgba(15,23,42,0.14))" } : undefined} />
  );
}
function FunnelDiagram({ agg, dark }) {
  const cx = 190, maxHalf = 150, stageH = 82, gap = 14, marginTop = 16, labelX = 372;
  const s0y0 = marginTop, s0y1 = s0y0 + stageH;
  const s1y0 = s0y1 + gap, s1y1 = s1y0 + stageH;
  const s2y0 = s1y1 + gap, s2y1 = s2y0 + stageH;
  const viewH = s2y1 + marginTop;

  const propostasRatio = agg.leads > 0 ? agg.propostas / agg.leads : 0;
  const vendasRatio = agg.leads > 0 ? agg.vendas / agg.leads : 0;
  const w0 = maxHalf;
  const w1 = clampNum(maxHalf * propostasRatio, 55, maxHalf);
  const w2 = clampNum(Math.min(w1, maxHalf * vendasRatio), 38, w1);
  const w3 = clampNum(w2 - 18, 26, w2);

  const mid = (a, b) => (a + b) / 2;
  const textMuted = dark ? "#9ca3af" : "#64748b";
  const textStrong = dark ? "#e5e7eb" : "#334155";
  const lineColor = dark ? "#404040" : "#cbd5e1";

  return (
    <svg viewBox={`0 0 500 ${viewH}`} className="w-full h-auto block" style={{ maxWidth: 460, margin: "0 auto" }}>
      <defs>
        <linearGradient id="funilGradLeads" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#60a5fa" /><stop offset="100%" stopColor="#3b82f6" />
        </linearGradient>
        <linearGradient id="funilGradPropostas" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#a78bfa" /><stop offset="100%" stopColor="#8b5cf6" />
        </linearGradient>
        <linearGradient id="funilGradVendas" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#34d399" /><stop offset="100%" stopColor="#10b981" />
        </linearGradient>
      </defs>

      <FunnelShape y0={s0y0} y1={s0y1} topHalf={w0} bottomHalf={w1} cx={cx} fill="url(#funilGradLeads)" dark={dark} />
      <FunnelShape y0={s1y0} y1={s1y1} topHalf={w1} bottomHalf={w2} cx={cx} fill="url(#funilGradPropostas)" dark={dark} />
      <FunnelShape y0={s2y0} y1={s2y1} topHalf={w2} bottomHalf={w3} cx={cx} fill="url(#funilGradVendas)" dark={dark} />

      <text x={cx} y={mid(s0y0, s0y1) - 6} textAnchor="middle" fontSize="11" fontWeight="600" letterSpacing="0.5" fill="rgba(255,255,255,0.85)">LEADS</text>
      <text x={cx} y={mid(s0y0, s0y1) + 19} textAnchor="middle" fontSize="23" fontWeight="700" fill="#fff">{fmtNum(agg.leads)}</text>

      <text x={cx} y={mid(s1y0, s1y1) - 6} textAnchor="middle" fontSize="11" fontWeight="600" letterSpacing="0.5" fill="rgba(255,255,255,0.85)">PROPOSTAS</text>
      <text x={cx} y={mid(s1y0, s1y1) + 19} textAnchor="middle" fontSize="23" fontWeight="700" fill="#fff">{fmtNum(agg.propostas)}</text>

      <text x={cx} y={mid(s2y0, s2y1) - 6} textAnchor="middle" fontSize="11" fontWeight="600" letterSpacing="0.5" fill="rgba(255,255,255,0.85)">VENDAS</text>
      <text x={cx} y={mid(s2y0, s2y1) + 19} textAnchor="middle" fontSize="23" fontWeight="700" fill="#fff">{fmtNum(agg.vendas)}</text>

      <text x={labelX} y={mid(s0y0, s0y1)} dominantBaseline="middle" fontSize="12" fontWeight="600" fill={textStrong}>100% do total</text>

      <line x1={cx + w1 + 6} y1={mid(s0y1, s1y0)} x2={labelX - 10} y2={mid(s0y1, s1y0)} stroke={lineColor} strokeWidth="1" />
      <text x={labelX} y={mid(s0y1, s1y0)} dominantBaseline="middle" fontSize="11" fontWeight="600" fill={textMuted}>{fmtPct1(agg.taxaLeadProposta)} de conversão</text>

      <text x={labelX} y={mid(s1y0, s1y1)} dominantBaseline="middle" fontSize="12" fontWeight="600" fill={textStrong}>{fmtPct1(agg.taxaLeadProposta)} do total</text>

      <line x1={cx + w2 + 6} y1={mid(s1y1, s2y0)} x2={labelX - 10} y2={mid(s1y1, s2y0)} stroke={lineColor} strokeWidth="1" />
      <text x={labelX} y={mid(s1y1, s2y0)} dominantBaseline="middle" fontSize="11" fontWeight="600" fill={textMuted}>{fmtPct1(agg.taxaPropostaVenda)} de conversão</text>

      <text x={labelX} y={mid(s2y0, s2y1)} dominantBaseline="middle" fontSize="12" fontWeight="600" fill={textStrong}>{fmtPct1(agg.taxaGeral)} do total</text>
    </svg>
  );
}

function normalizeTexto(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w\s]/g, " ");
}
function buscarRespostaFaq(pergunta) {
  // Cada gatilho "casa" se todas as suas palavras aparecem em algum lugar da pergunta,
  // não precisa ser a frase exata na mesma ordem (ex: "usuário novo" também bate com "novo usuário").
  const texto = normalizeTexto(pergunta);
  let melhor = null;
  let melhorPontos = 0;
  for (const item of FAQ_BASE) {
    for (const gatilho of item.gatilhos) {
      const palavras = normalizeTexto(gatilho).split(/\s+/).filter(Boolean);
      const matches = palavras.filter((p) => texto.includes(p)).length;
      if (matches === palavras.length && matches > melhorPontos) {
        melhor = item;
        melhorPontos = matches;
      }
    }
  }
  return melhor ? melhor.resposta : null;
}
const FAQ_FALLBACK = 'Ainda não tenho uma resposta pronta pra isso. Pode perguntar coisas como: "como fazer um comparativo?", "o que é o funil de vendas?", "como funciona o saldo do Google Ads?" ou "como sincronizar os dados?".';

function ChatWidget({ dark }) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([
    { role: "assistant", text: 'Oi! Posso tirar dúvidas sobre como usar o painel — pergunte algo como "como fazer um comparativo?" ou "o que é o funil de vendas?".' },
  ]);
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (open && scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, open]);

  function handleSend() {
    const text = input.trim();
    if (!text || sending) return;
    setMessages((m) => [...m, { role: "user", text }]);
    setInput("");
    setSending(true);
    const resposta = buscarRespostaFaq(text) || FAQ_FALLBACK;
    setTimeout(() => {
      setMessages((m) => [...m, { role: "assistant", text: resposta }]);
      setSending(false);
    }, 500);

  return (
    <>
      <button onClick={() => setOpen((v) => !v)} aria-label={open ? "Fechar assistente" : "Abrir assistente"}

              <p className={"text-[11px] " + (dark ? "text-neutral-500" : "text-neutral-400")}>Tira dúvidas sobre o painel</p>
            </div>
          </div>

          <div ref={scrollRef} className="flex-1 overflow-y-auto px-3 py-3 flex flex-col gap-2">
            {messages.map((m, i) => (
              <div key={i} className={"max-w-[85%] rounded-xl px-3 py-2 text-sm leading-snug " +
                (m.role === "user"
                  ? "self-end bg-blue-600 text-white"
                  : (dark ? "self-start bg-neutral-800 text-neutral-200" : "self-start bg-neutral-100 text-neutral-700"))}>

            ))}
            {sending && (
              <div className={"self-start rounded-xl px-3 py-2 text-sm " + (dark ? "bg-neutral-800 text-neutral-400" : "bg-neutral-100 text-neutral-400")}>

          <div className={"p-2.5 border-t flex items-center gap-2 " + (dark ? "border-neutral-800" : "border-neutral-200")}>
            <input value={input} onChange={(e) => setInput(e.target.value)}

                (dark ? "bg-neutral-800 border-neutral-700 text-neutral-100 placeholder:text-neutral-500" : "bg-neutral-50 border-neutral-200 text-neutral-900 placeholder:text-neutral-400")} />
            <button onClick={handleSend} disabled={!input.trim() || sending} aria-label="Enviar"

function RavieraDashboard({ token, role, email, nome, permissoes, justLoggedIn, onLogout }) {
  const [showWelcome, setShowWelcome] = useState(justLoggedIn);
  useEffect(() => {
    if (!justLoggedIn) return;
    const t = setTimeout(() => setShowWelcome(false), 2200);
    return () => clearTimeout(t);
  }, [justLoggedIn]);
  const [dark, setDark] = useState(() => localStorage.getItem("raviera_theme") !== "light");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [view, setView] = useState("dashboard"); // "dashboard" (Meta) | "google" | "funil" | "config"
  const [dashboardMenuOpen, setDashboardMenuOpen] = useState(false);
  const [marcaFiltro, setMarcaFiltro] = useState("todas");
  const [periodo, setPeriodo] = useState("mesAtual");
  const [comparativoTipo, setComparativoTipo] = useState("mesAnterior");
  const [customStart, setCustomStart] = useState("");
  const [customEnd, setCustomEnd] = useState("");
  const [sortConfig, setSortConfig] = useState({ key: "status", dir: "asc" });

  const [dashboardData, setDashboardData] = useState({ brands: [], trafego: [], saldos: [], criativosDiarios: [], organico: [], noticias: [], meta: {} });
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [selectedCreative, setSelectedCreative] = useState(null);

  function pushToast(message, type) {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { id, message, type: type || "error" }]);
    setTimeout(() => setToasts((prev) => prev.map((t) => (t.id === id ? { ...t, leaving: true } : t))), 3700);
    setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 4000);
  }

  useEffect(() => { localStorage.setItem("raviera_theme", dark ? "dark" : "light"); }, [dark]);

  async function loadDashboard() {
    setLoading(true);
    try {
      const data = await authJson("/api/dashboard", token);
      setDashboardData(data);
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setLoading(false);
    }
  }
  async function refreshData() {
    setSyncing(true);
    try {
      const result = await authJson("/api/sync", token, { method: "POST" });
      await loadDashboard();
      pushToast(`Dados atualizados — ${result.contas_sincronizadas} contas do Meta sincronizadas`, "success");
    } catch (e) {
      pushToast(e.message, "error");
    } finally {
      setSyncing(false);
    }
  }
  useEffect(() => { loadDashboard(); }, []);

  const brandsList = useMemo(
    () => dashboardData.brands.map((b) => b.nome).sort(),
    [dashboardData.brands]
  );
  const brandsToShow = useMemo(() => (marcaFiltro === "todas" ? brandsList : [marcaFiltro]), [marcaFiltro, brandsList]);

  const range = useMemo(() => getPeriodRange(periodo, customStart, customEnd), [periodo, customStart, customEnd]);
  const prevRange = useMemo(
    () => (periodo === "comparativo" ? getComparativoRange(range, comparativoTipo) : getPreviousRange(range)),
    [range, periodo, comparativoTipo]
  );

  const scopedTrafego = useMemo(() => dashboardData.trafego.filter((r) => brandsToShow.includes(r.marca)), [dashboardData.trafego, brandsToShow]);
  const currentRecords = useMemo(() => filterByRange(scopedTrafego, range), [scopedTrafego, range]);
  const previousRecords = useMemo(() => filterByRange(scopedTrafego, prevRange), [scopedTrafego, prevRange]);
  const currentAgg = useMemo(() => aggregateTrafego(currentRecords), [currentRecords]);
  const previousAgg = useMemo(() => aggregateTrafego(previousRecords), [previousRecords]);

  const evolucaoDiaria = useMemo(() => {
    const byDate = {};
    currentRecords.forEach((r) => {
      if (!byDate[r.data]) byDate[r.data] = { data: r.data, gasto: 0, quantidade: 0 };
      byDate[r.data].gasto += r.gasto; byDate[r.data].quantidade += r.quantidade;
    });
    return Object.values(byDate).sort((a, b) => a.data.localeCompare(b.data)).map((d) => ({ ...d, dataLabel: fmtDateOnly(d.data) }));
  }, [currentRecords]);

  // Séries diárias dos sparklines dos KPIs — saem da mesma evolucaoDiaria já usada no gráfico
  // maior, então acompanham o período selecionado sem nenhuma chamada extra ao backend.
  const seriesKpi = useMemo(() => ({
    gasto: evolucaoDiaria.map((d) => d.gasto),
    quantidade: evolucaoDiaria.map((d) => d.quantidade),
    // dia sem lead não tem CPL definido (seria divisão por zero) — vira null e o sparkline ignora.
    cpl: evolucaoDiaria.map((d) => (d.quantidade > 0 ? d.gasto / d.quantidade : null)),
  }), [evolucaoDiaria]);

  const rankingMarcas = useMemo(() => {
    return brandsList.map((marca) => {
      const recs = filterByRange(dashboardData.trafego.filter((r) => r.marca === marca), range);
      const agg = aggregateTrafego(recs);
      return { marca, gasto: agg.gasto, quantidade: agg.quantidade };
    }).filter((r) => brandsToShow.includes(r.marca)).sort((a, b) => b.quantidade - a.quantidade);
  }, [brandsList, brandsToShow, range, dashboardData.trafego]);

  const linhasSaldo = useMemo(() => {
    return brandsToShow.map((marca) => {
      const saldo = dashboardData.saldos.find((s) => s.marca === marca) || {};
      const trafRecs = filterByRange(dashboardData.trafego.filter((r) => r.marca === marca), range);
      const agg = aggregateTrafego(trafRecs);
      const saldoAtual = saldo.saldoAtualMeta || 0;
      const diarioEsperado = saldo.diarioEsperadoMeta || 0;
      const diasRestantes = diarioEsperado > 0 ? saldoAtual / diarioEsperado : null;
      return { marca, tier: saldo.tier || "—", gasto: agg.gasto, quantidade: agg.quantidade, cpl: agg.cpl, saldoAtual, diarioEsperado, diasRestantes, status: statusRunway(diasRestantes) };
    });
  }, [brandsToShow, dashboardData.saldos, dashboardData.trafego, range]);

  const contasEmRisco = useMemo(() => linhasSaldo.filter((l) => l.status === "critico" || l.status === "atencao").length, [linhasSaldo]);

  const STATUS_ORDER = { critico: 0, atencao: 1, semDados: 2, ok: 3 };
  const linhasSaldoOrdenadas = useMemo(() => {
    const arr = [...linhasSaldo];
    const { key, dir } = sortConfig;
    const mult = dir === "asc" ? 1 : -1;
    arr.sort((a, b) => {
      let av, bv;
      if (key === "status") { av = STATUS_ORDER[a.status]; bv = STATUS_ORDER[b.status]; }
      else if (key === "diasRestantes") { av = a.diasRestantes === null ? Infinity : a.diasRestantes; bv = b.diasRestantes === null ? Infinity : b.diasRestantes; }
      else { av = a[key]; bv = b[key]; }
      if (typeof av === "string") return av.localeCompare(bv) * mult;
      return (av - bv) * mult;
    });
    return arr;
  }, [linhasSaldo, sortConfig]);

  const totalsSaldo = useMemo(() => {
    const t = linhasSaldo.reduce((acc, r) => {
      acc.gasto += r.gasto; acc.quantidade += r.quantidade; acc.saldoAtual += r.saldoAtual; acc.diarioEsperado += r.diarioEsperado;
      return acc;
    }, { gasto: 0, quantidade: 0, saldoAtual: 0, diarioEsperado: 0 });
    t.cpl = t.quantidade > 0 ? t.gasto / t.quantidade : 0;
    return t;
  }, [linhasSaldo]);

  // Recalcula o top 3 de criativos a partir do histórico diário por anúncio, filtrado pelo
  // MESMO período selecionado no topo da tela (Mês Atual, Mês Anterior, período customizado
  // etc.) — igual já fazemos com leads/gasto. Não existe mais um "top 3" fixo do backend.
  const topCreativesToShow = useMemo(() => {
    const filtrados = filterByRange(
      dashboardData.criativosDiarios.filter((c) => brandsToShow.includes(c.marca)),
      range
    );
    const porMarca = {};
    filtrados.forEach((c) => {
      const porAnuncio = (porMarca[c.marca] ||= {});
      const acc = (porAnuncio[c.adId] ||= {
        brandId: c.brandId, nomeAnuncio: c.nomeAnuncio, thumbnailUrl: c.thumbnailUrl, gasto: 0, leads: 0, ultimaData: c.data,
      });
      acc.gasto += c.gasto;
      acc.leads += c.leads;
      if (c.data > acc.ultimaData) acc.ultimaData = c.data;
    });
    return Object.entries(porMarca)
      .map(([marca, anuncios]) => {
        const lista = Object.values(anuncios)
          .sort((a, b) => b.leads - a.leads)
          .slice(0, 3)
          .map((a, i) => ({
            rank: i + 1,
            nomeAnuncio: a.nomeAnuncio,
            thumbnailUrl: a.thumbnailUrl,
            gasto: a.gasto,
            leads: a.leads,
            custoPorLead: a.leads ? a.gasto / a.leads : 0,
            atualizadoEm: a.ultimaData,
          }));
        return { brandId: Object.values(anuncios)[0]?.brandId, marca, criativos: lista };
      })
      .filter((item) => item.criativos.length > 0);
  }, [dashboardData.criativosDiarios, brandsToShow, range]);

    () => dashboardData.organico.filter((o) => o.marcas.some((m) => brandsToShow.includes(m))),

  );

  const ORGANICO_PREVIEW_COUNT = 6;

                <div className="flex flex-col gap-4">

              {loading ? <div className="h-[280px] flex items-center justify-center text-xs text-neutral-500">Carregando dados...</div> : <EvolutionChart data={evolucaoDiaria} dark={dark} />}
            </div>

            {brandsToShow.length > 1 && (
              <div className={"neon-top rounded-xl border p-4 " + (dark ? "is-dark " : "") + cardBg} style={{ "--neon": "#3b82f6" }}>
                <h2 className="text-sm font-bold mb-1">Desempenho por Marca</h2>
                <p className={"text-xs mb-3 " + mutedText}>Ranking de leads e investimento no período — passe o mouse para ver os valores</p>
                <ChartLegend dark={dark} items={[
                  { shape: "bar", color: "#3b82f6", label: "Leads gerados — barras" },
                  { shape: "line", color: "#f59e0b", label: "Investimento (R$) — linha tracejada e pontos", dashed: true },
                ]} />
                <RankingChart data={rankingMarcas} dark={dark} />
              </div>
            )}

            {permissoes.verSaldo && (
            <div className={"neon-top rounded-xl border p-4 " + (dark ? "is-dark " : "") + cardBg} style={{ "--neon": "#10b981" }}>
              <h2 className="text-sm font-bold mb-1">Saldo das Contas de Anúncios (Meta Ads)</h2>
              <p className={"text-xs mb-4 " + mutedText}>Runway estimado: saldo atual ÷ diário esperado · Crítico ≤{RUNWAY_CRITICO}d · Atenção ≤{RUNWAY_ATENCAO}d</p>
              <div className="overflow-x-auto">
                <table className="w-full text-sm min-w-[680px]">
                <thead><tr className={"text-left text-xs uppercase tracking-wide " + mutedText}>
                  <SortableTh label="Marca" sortKey="marca" sortConfig={sortConfig} onSort={handleSort} />
                  <SortableTh label="Investimento" sortKey="gasto" sortConfig={sortConfig} onSort={handleSort} />
                  <SortableTh label="Leads" sortKey="quantidade" sortConfig={sortConfig} onSort={handleSort} />
                  <SortableTh label="CPL" sortKey="cpl" sortConfig={sortConfig} onSort={handleSort} />
                  <SortableTh label="Saldo Atual" sortKey="saldoAtual" sortConfig={sortConfig} onSort={handleSort} />
                  <SortableTh label="Diário Esperado" sortKey="diarioEsperado" sortConfig={sortConfig} onSort={handleSort} />
                  <SortableTh label="Runway" sortKey="diasRestantes" sortConfig={sortConfig} onSort={handleSort} />
                  <SortableTh label="Status" sortKey="status" sortConfig={sortConfig} onSort={handleSort} />
                </tr></thead>
                <tbody className={"divide-y " + (dark ? "divide-neutral-800" : "divide-neutral-100")}>
                  {linhasSaldoOrdenadas.map((row) => (
                    <tr key={row.marca}>
                      <td className="py-2.5 font-semibold">{row.marca}</td>
                      <td className="py-2.5 tabular-nums">{fmtBRL(row.gasto)}</td>
                      <td className="py-2.5 tabular-nums">{fmtNum(row.quantidade)}</td>
                      <td className="py-2.5 tabular-nums">{fmtBRL(row.cpl)}</td>
                      <td className="py-2.5 tabular-nums">{fmtBRL(row.saldoAtual)}</td>
                      <td className="py-2.5 tabular-nums">{fmtBRL(row.diarioEsperado)}</td>
                      <td className="py-2.5 tabular-nums">{row.diasRestantes !== null ? row.diasRestantes.toFixed(1) + "d" : "—"}</td>
                      <td className="py-2.5"><StatusPill status={row.status} dark={dark} /></td>
                    </tr>
                  ))}
                </tbody>
                <tfoot>
                  <tr className={"border-t font-semibold " + (dark ? "border-neutral-800" : "border-neutral-200")}>
                    <td className="py-2.5">Total ({linhasSaldo.length})</td>
                    <td className="py-2.5 tabular-nums">{fmtBRL(totalsSaldo.gasto)}</td>
                    <td className="py-2.5 tabular-nums">{fmtNum(totalsSaldo.quantidade)}</td>
                    <td className="py-2.5 tabular-nums">{fmtBRL(totalsSaldo.cpl)}</td>
                    <td className="py-2.5 tabular-nums">{fmtBRL(totalsSaldo.saldoAtual)}</td>
                    <td className="py-2.5 tabular-nums">{fmtBRL(totalsSaldo.diarioEsperado)}</td>
                    <td className="py-2.5" colSpan="2">
                      <span className={contasEmRisco > 0 ? (dark ? "text-amber-400" : "text-amber-700") : mutedText}>
                        {contasEmRisco} conta{contasEmRisco === 1 ? "" : "s"} em risco
                      </span>
                    </td>
                  </tr>
                </tfoot>
              </table>
              </div>
            </div>
            )}

            <footer className={"text-center text-[11px] py-2 " + mutedText}>FEFO · Vendas e test-drives serão integrados em uma etapa futura (outro sistema) · v{APP_VERSION}</footer>
          </>
        )}
      </div>
      <ChatWidget dark={dark} />
    </div>
  );
}

/* ================================================================== */
/* 9) APP (login gate)                                                  */
/* ================================================================== */

function App() {
  const [session, setSession] = useState(() => {
    const token = localStorage.getItem("raviera_token");
    const role = localStorage.getItem("raviera_role");
    const email = localStorage.getItem("raviera_email");
    const nome = localStorage.getItem("raviera_nome");
    const permissoesRaw = localStorage.getItem("raviera_permissoes");
    const permissoes = permissoesRaw ? JSON.parse(permissoesRaw) : { verSaldo: true, verInvestimento: true, verFunil: true, verNoticias: true };
    return token ? { token, role, email, nome, permissoes } : null;
  });
  const [justLoggedIn, setJustLoggedIn] = useState(false);

  function handleLogin(result) {
    const permissoes = { verSaldo: result.verSaldo, verInvestimento: result.verInvestimento, verFunil: result.verFunil, verNoticias: result.verNoticias };
    localStorage.setItem("raviera_token", result.access_token);
    localStorage.setItem("raviera_role", result.role);
    localStorage.setItem("raviera_email", result.email);
    localStorage.setItem("raviera_nome", result.nome || "");
    localStorage.setItem("raviera_permissoes", JSON.stringify(permissoes));
    setJustLoggedIn(true);
    setSession({ token: result.access_token, role: result.role, email: result.email, nome: result.nome, permissoes });
  }
  function handleLogout() {
    localStorage.removeItem("raviera_token");
    localStorage.removeItem("raviera_role");
    localStorage.removeItem("raviera_email");
    localStorage.removeItem("raviera_nome");
    localStorage.removeItem("raviera_permissoes");
    setSession(null);
  }

  if (!session) return <LoginScreen onLogin={handleLogin} />;
  return <RavieraDashboard token={session.token} role={session.role} email={session.email} nome={session.nome} permissoes={session.permissoes} justLoggedIn={justLoggedIn} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
