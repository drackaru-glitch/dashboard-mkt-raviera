# Configuração do Nginx como proxy reverso na frente da aplicação (que roda em 127.0.0.1:8000).
#
# Instalação (como root, em servidor Ubuntu/Debian):
#   1. Troque "dashboard.gruporaviera.com.br" pelo subdomínio real escolhido, nas duas ocorrências abaixo.
#   2. Copie este arquivo para /etc/nginx/sites-available/dashboard-raviera
#   3. Rode:
#        ln -s /etc/nginx/sites-available/dashboard-raviera /etc/nginx/sites-enabled/
#        nginx -t
#        systemctl reload nginx
#   4. Gere o certificado HTTPS com Certbot (grátis, renova sozinho):
#        certbot --nginx -d dashboard.gruporaviera.com.br
#      O Certbot edita este arquivo automaticamente pra adicionar os caminhos do certificado
#      e o bloco de redirecionamento HTTP -> HTTPS — não precisa escrever isso na mão.

server {
    listen 80;
    server_name dashboard.gruporaviera.com.br;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
